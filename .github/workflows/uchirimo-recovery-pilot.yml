name: Uchirimo Recovery Pilot

on:
  workflow_call:
    inputs:
      controller_head:
        required: true
        type: string
    outputs:
      pilot_hard_gate:
        description: Recovery gate state
        value: ${{ jobs.recovery-gate.outputs.pilot_hard_gate }}
      full_coverage_authorized:
        description: Full Coverage authorization after recovery integration
        value: ${{ jobs.recovery-gate.outputs.full_coverage_authorized }}

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: uchirimo-recovery-pilot-${{ inputs.controller_head }}
  cancel-in-progress: true

jobs:
  governance-authority:
    uses: ./.github/workflows/governance-authorization.yml
    with:
      controller_head: ${{ inputs.controller_head }}
      release: false

  endurance-calibration:
    needs: ["governance-authority"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HEAD_SHA: ${{ inputs.controller_head }}
      UCHIRIMO_SELECTOR_MODE: shard
      UCHIRIMO_SELECTOR_BATCH_ID: recovery-v3-endurance-00
      UCHIRIMO_SELECTOR_BATCH_JSON: '[{"shard":0,"node_id":"UCH-RES-SL2-T","partition_key":"UCH-RES-SL2-T|single_glazing|reverse_handing=\"reverse\"|frame_color=\"clear\"|glass_structure=\"F4\"|crescent_position=\"custom\"|crescent_presence=\"crescentless_special_order\"","room_specification":"residential","window_type":"sliding_window","sash_configuration":"two_panel","size_class":"terrace","glass_family":"single_glazing","partition_seed_json":"{\"crescent_position\":\"custom\",\"crescent_presence\":\"crescentless_special_order\",\"frame_color\":\"clear\",\"glass_structure\":\"F4\",\"reverse_handing\":\"reverse\"}"}]'
      UCHIRIMO_SELECTOR_CHILD_TIMEOUT_MS: 18000000
      UCHIRIMO_SELECTOR_EXPECTED_SHARDS: 1
      UCHIRIMO_RESOLVER_CACHE_MAX: 4096
      UCHIRIMO_SELECTOR_MAX_STATES: 5000000
      UCHIRIMO_SELECTOR_MAX_TERMINALS: 5000000
      UCHIRIMO_FULL_SELECTOR_OUT: artifacts/uchirimo-recovery-v3-endurance
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --ignore-scripts

      - name: Verify exact HEAD
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Run one isolated heavy partition to natural completion
        run: node scripts/governance/uchirimo-selector-batch-runner.mjs

      - name: Verify terminal artifact integrity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const out='artifacts/uchirimo-recovery-v3-endurance';
          const report=JSON.parse(readFileSync(out+'/shard-0-report.json','utf8'));
          const data=readFileSync(out+'/'+report.case_artifact);
          const actual=createHash('sha256').update(data).digest('hex');
          if(report.status!=='PASS')throw new Error('ENDURANCE_SHARD_NOT_PASS');
          if(report.runtime_integrity_match!==true)throw new Error('ENDURANCE_RUNTIME_INTEGRITY_FAIL');
          if(report.unverified_discrete_selector_case_count!==0)throw new Error('ENDURANCE_UNVERIFIED_NONZERO');
          if(actual!==report.case_artifact_sha256)throw new Error('ENDURANCE_CASE_SHA_MISMATCH');
          console.log('UCHIRIMO_RECOVERY_V3_ENDURANCE=PASS states='+report.visited_state_count+' terminals='+report.terminal_context_count+' peak_heap_mb='+report.observed_peak_heap_mb);
          NODE

      - name: Remove large terminal digest after integrity verification
        if: always()
        run: rm -f artifacts/uchirimo-recovery-v3-endurance/shard-*-terminal-digests.jsonl

      - name: Upload lightweight endurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uchirimo-recovery-v3-endurance-${{ env.HEAD_SHA }}
          path: artifacts/uchirimo-recovery-v3-endurance/
          if-no-files-found: error

  recovery-gate:
    needs:
      - governance-authority
      - endurance-calibration
    if: ${{ always() && needs.governance-authority.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      pilot_hard_gate: ${{ steps.gate.outputs.pilot_hard_gate }}
      full_coverage_authorized: ${{ steps.gate.outputs.full_coverage_authorized }}
    steps:
      - name: Keep Full Coverage closed after calibration
        id: gate
        shell: bash
        env:
          ENDURANCE_RESULT: ${{ needs.endurance-calibration.result }}
        run: |
          set -euo pipefail
          echo "pilot_hard_gate=BLOCKED" >> "$GITHUB_OUTPUT"
          echo "full_coverage_authorized=false" >> "$GITHUB_OUTPUT"
          if [ "$ENDURANCE_RESULT" = "success" ]; then
            echo "RECOVERY_V3_ENDURANCE_CALIBRATION=PASS"
            echo "RECOVERY_INTEGRATION_GATE=BLOCKED reason=GLOBAL_HEAVY_PARTITION_STRATEGY_PENDING"
          else
            echo "RECOVERY_V3_ENDURANCE_CALIBRATION=FAIL result=$ENDURANCE_RESULT"
            echo "RECOVERY_INTEGRATION_GATE=BLOCKED reason=ENDURANCE_CALIBRATION_NOT_PASS"
          fi
          echo "FULL_COVERAGE_QA_GATE=BLOCKED"
          exit 1
