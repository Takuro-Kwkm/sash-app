name: Stage A Samos Options Self-Reference Diagnostic

on:
  workflow_call:
    inputs:
      controller_head:
        required: true
        type: string

permissions:
  contents: read

jobs:
  governance-authority:
    uses: ./.github/workflows/governance-authorization.yml
    with:
      controller_head: ${{ inputs.controller_head }}
      release: false

  closed-evidence-gate:
    needs: ["governance-authority"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && (true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve Samos source-rule evidence
        shell: bash
        run: |
          set -euo pipefail
          echo 'DIAGNOSTIC_EVIDENCE_RUN=34926697862'
          echo 'SAMOS2H_OPTIONS=33 conflict=OP-S2H-ANGLE-COVER::OP-S2H-FINGER-GUARD source=OPR-S2H-001 shape=$contains+DENY_CANDIDATE'
          echo 'SAMOSL_OPTIONS=39 conflict=OP-SL-ANGLE-COVER::OP-SL-FINGER-GUARD shape=mutual_$notContains'
          echo 'HIGHER_ORDER_SELF_REFERENCE_COUNT=0'
          echo 'RETRY_AUTHORIZED=false'
          echo 'REOPEN_CONDITION=NEW_CONFLICT_GRAPH_V4_MODEL'
          echo 'APP_INTEGRATION_READY=false'
          echo 'RELEASE_INPUT_GATE=BLOCKED'
