name: Stage A Samos Options Self-Reference Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage-a-samos-options-self-reference-diagnostic.yml'
      - 'scripts/stage-a-samos-options-self-reference-diagnostic.mjs'
      - 'src/catalog/runtime-master/**'
      - 'src/catalog/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      STAGE_A_SAMOS_OPTIONS_DIAG_OUT: artifacts/stage-a-samos-options-self-reference-diagnostic
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact SHA gate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA"
          echo "EXACT_HEAD_GATE=PASS sha=$actual"
      - name: Run Samos options self-reference diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stage-a-samos-options-self-reference-diagnostic.mjs
          node scripts/stage-a-samos-options-self-reference-diagnostic.mjs
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-samos-options-self-reference-diagnostic
          path: artifacts/stage-a-samos-options-self-reference-diagnostic/report.json
          if-no-files-found: error
