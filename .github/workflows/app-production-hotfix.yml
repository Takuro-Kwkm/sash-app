name: Adopted App Production Release

on:
  pull_request:
    paths:
      - '.github/workflows/app-production-hotfix.yml'
      - 'contracts/production/app-release.v1.json'
      - 'scripts/production/verify-app-release.mjs'
      - 'scripts/vercel-rest-deploy.mjs'
      - 'src/server/recovery-app.mjs'
      - '.release/app-production-hotfix-v1'
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: 'Existing executor build only; production is staged until Shared authorization'
        type: choice
        options: [preview, production]
        default: preview
        required: true
      expected_sha:
        description: 'Exact candidate for preview, or reviewed Main for staged production'
        required: true
        type: string
      approval_reference:
        description: 'Approved release request or review reference; product Formal remains separate'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.release/app-production-hotfix-v1'

permissions:
  contents: read
  actions: read

concurrency:
  group: app-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  app-release-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Native connection and application regression
        run: |
          python -B scripts/production/validate-architecture-connection.py
          python -B scripts/production/validate-product-master-profile.py
          npm run lint
          npm run typecheck
          npm test
      - name: Browser setup
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Local runtime, UI and output QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/sash-release.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 0.5
          done
          GITHUB_SHA="$HEAD_SHA" npm run verify:app-release
          GITHUB_SHA="$HEAD_SHA" npm run test:browser:release
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-review-${{ github.event.pull_request.head.sha }}
          path: artifacts/

  production-hotfix:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      VERCEL_ORG_ID: team_AkuHacuJlCl8LuvaFpCzFmbv
      VERCEL_PROJECT_ID: prj_4z0zqW6yKyPuFINODfGX8LPBuJRP
      VERCEL_PROJECT_NAME: sash-app-wave3-preview
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      DEPLOY_MODE: ${{ inputs.deployment_mode || 'production' }}
      VERCEL_DEPLOY_SOURCE: files
      RELEASE_SERIES: APP_NON_PRODUCT_MASTER_UI
      RELEASE_PACKAGE_VERSION: adopted-app-release-v1
      PRODUCTION_URL: https://sash-app-wave3-preview.vercel.app
      PRODUCTION_HOST: sash-app-wave3-preview.vercel.app

    steps:
      - name: Checkout exact main hotfix SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Assert hotfix scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$DEPLOY_MODE" == 'production' ]]; then test "$GITHUB_REF" = 'refs/heads/main'; fi
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const event=JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          if(event.inputs.expected_sha!==process.env.GITHUB_SHA)throw new Error('REVIEWED_MAIN_SHA_MISMATCH');
          if(!event.inputs.approval_reference?.trim())throw new Error('RELEASE_APPROVAL_REFERENCE_REQUIRED');
          NODE
          fi
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const marker=JSON.parse(readFileSync('.release/app-production-hotfix-v1','utf8'));
          if(marker.scope!=='NON_PRODUCT_MASTER_UI')throw new Error('HOTFIX_SCOPE_INVALID');
          if(typeof marker.change!=='string'||!marker.change.trim())throw new Error('HOTFIX_CHANGE_INVALID');
          console.log('HOTFIX_SCOPE_GATE=PASS '+marker.change);
          NODE

      - name: Install and application regression
        run: |
          npm install --ignore-scripts
          npm run lint
          npm run typecheck
          npm test

      - name: Install browser QA dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify actual local release before deployment
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/sash-release.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 0.5
          done
          npm run verify:app-release -- --output artifacts/app-hotfix-production/local-verification.json
          npm run test:browser:release

      - name: Prepare Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          if [[ -z "$token" ]]; then echo 'VERCEL_CREDENTIAL_GATE=BLOCKED'; exit 42; fi
          echo "VERCEL_TOKEN_EFFECTIVE=$token" >> "$GITHUB_ENV"
          status="$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' -H "Authorization: Bearer $token" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")"
          test "$status" = "200"
          node -e 'const p=require("/tmp/vercel-project.json"); if(p.id!==process.env.VERCEL_PROJECT_ID||p.accountId!==process.env.VERCEL_ORG_ID) process.exit(1)'
          echo 'VERCEL_CREDENTIAL_GATE=PASS'

      - name: Build exact candidate Preview or exact Main staged Production
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_MODE" == 'preview' ]]; then export VERCEL_DEPLOY_SOURCE=inline; fi
          node scripts/vercel-rest-deploy.mjs "$DEPLOY_MODE" artifacts/app-hotfix-production/deployment.json

      - name: Verify staged build and preserved production alias
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('artifacts/app-hotfix-production/deployment.json','utf8'));
          if(d.readyState!=='READY'||d.githubSha!==process.env.GITHUB_SHA||d.releaseCommitSha!==process.env.GITHUB_SHA||d.mode!==process.env.DEPLOY_MODE)throw new Error('STAGED_IDENTITY_INVALID');
          if(process.env.DEPLOY_MODE==='preview'){if(d.releaseState!=='PREVIEW_READY')throw new Error('PREVIEW_IDENTITY_INVALID');console.log('PREVIEW_READY; QA_AND_FIXED_PACKET_REQUIRED');process.exit(0);}
          if(d.releaseState!=='STAGED_NOT_RELEASED'||d.autoAssignCustomDomains!==false||d.aliasBefore.deploymentId!==d.aliasAfter.deploymentId)throw new Error('PRODUCTION_ALIAS_HOLD_REQUIRED');
          console.log('STAGED_NOT_RELEASED: new staged native QA, exact Main CI and actual fixed Release packet required before Shared authorize-publication and existing provider promotion');
          NODE

      - name: Upload hotfix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-production-hotfix-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
