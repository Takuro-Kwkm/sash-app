name: Adopted App Production Release

on:
  pull_request:
    paths:
      - '.github/workflows/app-production-hotfix.yml'
      - 'contracts/production/app-release.v1.json'
      - 'scripts/production/verify-app-release.mjs'
      - 'scripts/vercel-rest-deploy.mjs'
      - 'src/server/recovery-app.mjs'
      - '.release/app-production-hotfix-v1'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Reviewed exact main commit to deploy'
        required: true
        type: string
      approval_reference:
        description: 'Approved release request or review reference; product Formal remains separate'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.release/app-production-hotfix-v1'

permissions:
  contents: read
  actions: read

concurrency:
  group: app-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  app-release-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Native connection and application regression
        run: |
          python -B scripts/production/validate-architecture-connection.py
          python -B scripts/production/validate-product-master-profile.py
          npm run lint
          npm run typecheck
          npm test
      - name: Browser setup
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Local runtime, UI and output QA
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/sash-release.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 0.5
          done
          GITHUB_SHA="$HEAD_SHA" npm run verify:app-release
          GITHUB_SHA="$HEAD_SHA" npm run test:browser:release
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-review-${{ github.event.pull_request.head.sha }}
          path: artifacts/

  production-hotfix:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      VERCEL_ORG_ID: team_AkuHacuJlCl8LuvaFpCzFmbv
      VERCEL_PROJECT_ID: prj_4z0zqW6yKyPuFINODfGX8LPBuJRP
      VERCEL_PROJECT_NAME: sash-app-wave3-preview
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_DEPLOY_SOURCE: files
      RELEASE_SERIES: APP_NON_PRODUCT_MASTER_UI
      RELEASE_PACKAGE_VERSION: adopted-app-release-v1
      PRODUCTION_URL: https://sash-app-wave3-preview.vercel.app
      PRODUCTION_HOST: sash-app-wave3-preview.vercel.app

    steps:
      - name: Checkout exact main hotfix SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Assert hotfix scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/main'
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const event=JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          if(event.inputs.expected_sha!==process.env.GITHUB_SHA)throw new Error('REVIEWED_MAIN_SHA_MISMATCH');
          if(!event.inputs.approval_reference?.trim())throw new Error('RELEASE_APPROVAL_REFERENCE_REQUIRED');
          NODE
          fi
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const marker=JSON.parse(readFileSync('.release/app-production-hotfix-v1','utf8'));
          if(marker.scope!=='NON_PRODUCT_MASTER_UI')throw new Error('HOTFIX_SCOPE_INVALID');
          if(typeof marker.change!=='string'||!marker.change.trim())throw new Error('HOTFIX_CHANGE_INVALID');
          console.log('HOTFIX_SCOPE_GATE=PASS '+marker.change);
          NODE

      - name: Install and application regression
        run: |
          npm install --ignore-scripts
          npm run lint
          npm run typecheck
          npm test

      - name: Install browser QA dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify actual local release before deployment
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/sash-release.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 0.5
          done
          npm run verify:app-release -- --output artifacts/app-hotfix-production/local-verification.json
          npm run test:browser:release

      - name: Prepare Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          if [[ -z "$token" ]]; then echo 'VERCEL_CREDENTIAL_GATE=BLOCKED'; exit 42; fi
          echo "VERCEL_TOKEN_EFFECTIVE=$token" >> "$GITHUB_ENV"
          status="$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' -H "Authorization: Bearer $token" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")"
          test "$status" = "200"
          node -e 'const p=require("/tmp/vercel-project.json"); if(p.id!==process.env.VERCEL_PROJECT_ID||p.accountId!==process.env.VERCEL_ORG_ID) process.exit(1)'
          echo 'VERCEL_CREDENTIAL_GATE=PASS'

      - name: Deploy exact hotfix SHA to Production
        run: node scripts/vercel-rest-deploy.mjs production artifacts/app-hotfix-production/deployment.json

      - name: Verify Production identity and alias
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('artifacts/app-hotfix-production/deployment.json','utf8'));
          if(d.readyState!=='READY'||d.githubSha!==process.env.GITHUB_SHA||d.releaseCommitSha!==process.env.GITHUB_SHA||d.mode!=='production')throw new Error('PRODUCTION_IDENTITY_INVALID');
          console.log('PRODUCTION_IDENTITY_GATE=PASS '+d.deploymentUrl);
          NODE
          status="$(curl -sS -o artifacts/app-hotfix-production/vercel-deployment.json -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" "https://api.vercel.com/v13/deployments/$DEPLOY_ID?teamId=$VERCEL_ORG_ID")"
          test "$status" = "200"
          node -e 'const d=require("./artifacts/app-hotfix-production/vercel-deployment.json"); if(d.readyState!=="READY"||d.target!=="production"||d.meta?.releaseCommitSha!==process.env.GITHUB_SHA||!Array.isArray(d.alias)||!d.alias.includes(process.env.PRODUCTION_HOST)) process.exit(1)'
          echo 'PRODUCTION_ALIAS_GATE=PASS'

      - name: Production health smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/app-hotfix-production
          curl -fsS "$PRODUCTION_URL/api/health" > artifacts/app-hotfix-production/health.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const h=JSON.parse(readFileSync('artifacts/app-hotfix-production/health.json','utf8'));
          if(!h.ok)throw new Error('PRODUCTION_HEALTH_FAILED');
          const expected=['SER-LIXIL-TW','SER-LIX-EW','SER-LIX-SAMOS2H','SER-LIX-SAMOSL','SER-YKK-APW430','SER-YKK-APW431','SER-YKKAP-UCHIRIMO'];
          const byId=new Map((h.runtimeMasterIntegrations??[]).map(x=>[x.id,x]));
          if(expected.some(id=>!byId.has(id)||byId.get(id).status!=='READY'||byId.get(id).selectable!==true))throw new Error('SEVEN_SERIES_RUNTIME_SMOKE_FAILED');
          console.log('PRODUCTION_HEALTH_GATE=PASS');
          NODE

      - name: Compare deployed commit, Runtime identities and UI bytes
        run: npm run verify:app-release -- --url "$PRODUCTION_URL" --require-release-commit --output artifacts/app-hotfix-production/production-verification.json

      - name: Production UI and business-flow QA
        env:
          QA_BASE_URL: ${{ env.PRODUCTION_URL }}
        run: |
          npm run test:browser:work
          npm run test:browser:estimate-output
          node test/browser/eight-series-business-flow-qa.mjs
          node test/browser/inplus-reverse-handing-browser-qa.mjs
          node test/browser/inplus-accessory-request-browser-qa.mjs
          node test/browser/bathroom-estimate-workflow-browser-qa.mjs
          node test/browser/inner-window-canonical-frame-qa.mjs
          node test/browser/release-regression-browser-qa.mjs
          echo 'PRODUCTION_BROWSER_QA_GATE=PASS'

      - name: Upload hotfix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-production-hotfix-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
