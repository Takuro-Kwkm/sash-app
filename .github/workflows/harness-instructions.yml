name: Harness Instructions
on:
  pull_request:
    paths: ['AGENTS.md', 'contracts/production/harness-instructions-scope.v1.json', 'scripts/production/instruction-scope.py', 'scripts/production/test_instruction_scope.py', 'scripts/production/new-product-environment-scope.py', '.github/workflows/harness-instructions.yml']
  push:
    branches: [main]
    paths: ['AGENTS.md', 'contracts/production/harness-instructions-scope.v1.json', 'scripts/production/instruction-scope.py', 'scripts/production/test_instruction_scope.py', 'scripts/production/new-product-environment-scope.py', '.github/workflows/harness-instructions.yml']
permissions:
  contents: read
jobs:
  instruction-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14'}
      - run: python -B scripts/production/test_instruction_scope.py
