name: Harness Instructions
"on":
  pull_request:
    paths:
      - AGENTS.md
      - contracts/production/harness-instructions-scope.v1.json
      - scripts/production/instruction-scope.py
      - scripts/production/test_instruction_scope.py
      - scripts/production/new-product-environment-scope.py
      - .github/workflows/harness-instructions.yml
  push:
    branches:
      - main
    paths:
      - AGENTS.md
      - contracts/production/harness-instructions-scope.v1.json
      - scripts/production/instruction-scope.py
      - scripts/production/test_instruction_scope.py
      - scripts/production/new-product-environment-scope.py
      - .github/workflows/harness-instructions.yml
permissions:
  contents: read
jobs:
  instruction-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify runtime maintenance scope and retain predecessor
        if: hashFiles('contracts/production/authority-successors/node-security.20261021.json') != ''
        working-directory: ${{ github.workspace }}
        run: python3 -B scripts/production/node-security.py prepare --github-env "$GITHUB_ENV"
      - name: Verify conditions successor and inspect preserved predecessor
        run: |-
          python3 -B scripts/production/product-conditions-scope.py --predecessor /tmp/product-conditions-predecessor
          python3 -B scripts/production/test_product_conditions_scope.py
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.14
      - run: python -B scripts/production/test_instruction_scope.py
        working-directory: /tmp/product-conditions-predecessor
