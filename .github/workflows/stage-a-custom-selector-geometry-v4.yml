name: Stage A CUSTOM Selector Geometry V5

on:
  workflow_call:
    inputs:
      controller_head:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stage-a-custom-selector-geometry-v5
  cancel-in-progress: true

jobs:
  governance-authority:
    uses: ./.github/workflows/governance-authorization.yml
    with:
      controller_head: ${{ inputs.controller_head }}
      release: false

  prove:
    needs: ["governance-authority"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && (true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_SHA: ${{ github.sha }}
      STAGE_A_CUSTOM_SHAPE_OUT: artifacts/stage-a-custom-dimension-source-shape
      STAGE_A_CUSTOM_GUARD_OUT: artifacts/stage-a-formal-split-custom-guard-shape
      STAGE_A_CUSTOM_SHAPE_INPUT: artifacts/stage-a-custom-dimension-source-shape/report.json
      STAGE_A_CUSTOM_GUARD_INPUT: artifacts/stage-a-formal-split-custom-guard-shape/report.json
      STAGE_A_CUSTOM_PARTITION_OUT: artifacts/stage-a-custom-dimension-boundary-partition
      STAGE_A_CUSTOM_PARTITION_INPUT: artifacts/stage-a-custom-dimension-boundary-partition/report.json
      STAGE_A_CUSTOM_REACHABILITY_OUT: artifacts/stage-a-custom-selector-reachability
      STAGE_A_CUSTOM_REACHABILITY_INPUT: artifacts/stage-a-custom-selector-reachability/report.json
      STAGE_A_CUSTOM_GEOMETRY_EQ_OUT: artifacts/stage-a-custom-runtime-geometry-equivalence
    steps:
      - name: Checkout exact push HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Exact SHA and syntax gate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA"
          node --check scripts/stage-a-custom-dimension-boundary-partition-proof-v2.mjs
          node --check scripts/stage-a-custom-selector-reachability-v4.mjs
          node --check scripts/stage-a-custom-runtime-geometry-equivalence-v4.mjs
          node --check src/catalog/runtime-master/apw431-formal-split-v1-adapter.mjs
          echo "EXACT_HEAD_GATE=PASS sha=$actual"

      - name: Regenerate CUSTOM source and guard evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-a-custom-dimension-source-shape-diagnostic.mjs
          node scripts/stage-a-formal-split-custom-guard-shape-diagnostic.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const s=JSON.parse(readFileSync(`${process.env.STAGE_A_CUSTOM_SHAPE_OUT}/report.json`,'utf8'));
          const g=JSON.parse(readFileSync(`${process.env.STAGE_A_CUSTOM_GUARD_OUT}/report.json`,'utf8'));
          if(s.exact_head_sha!==process.env.HEAD_SHA||g.exact_head_sha!==process.env.HEAD_SHA)throw new Error('CUSTOM_V5_SOURCE_HEAD_MISMATCH');
          if(s.series_count!==6||s.total_custom_rule_count!==152||s.total_explicit_custom_window_id_count!==92||s.unsupported_count!==0||s.source_shape_status!=='CUSTOM_SOURCE_SHAPE_INVENTORIED')throw new Error('CUSTOM_V5_SOURCE_INVALID');
          if(g.status!=='PASS'||g.rule_count!==54)throw new Error(`CUSTOM_V5_GUARD_INVALID status=${g.status} rules=${g.rule_count}`);
          console.log(`CUSTOM_SOURCE_SHAPE_GATE=PASS rules=${s.total_custom_rule_count} windows=${s.total_explicit_custom_window_id_count}`);
          NODE

      - name: Regenerate null-safe CUSTOM boundary partition V2
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-a-custom-dimension-boundary-partition-proof-v2.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const p=JSON.parse(readFileSync(`${process.env.STAGE_A_CUSTOM_PARTITION_OUT}/report.json`,'utf8'));
          if(p.exact_head_sha!==process.env.HEAD_SHA)throw new Error('CUSTOM_V5_PARTITION_HEAD_MISMATCH');
          if(p.partition_model_version!=='CUSTOM_FINITE_LINE_ARRANGEMENT_COMMON_REFINEMENT_V2_NULL_SAFE')throw new Error(`CUSTOM_V5_PARTITION_MODEL ${p.partition_model_version}`);
          if(p.window_count!==92||p.rule_count!==152||p.arrangement_proof_class_count<=0||p.boundary_triplet_count<=0||p.invalid_boundary_triplet_count!==0||p.selector_geometry_separation_violation_count!==0)throw new Error('CUSTOM_V5_PARTITION_INVALID');
          if(p.status!=='GEOMETRY_PARTITION_PASS_RUNTIME_EQUIVALENCE_PENDING')throw new Error(`CUSTOM_V5_PARTITION_STATUS ${p.status}`);
          console.log(`CUSTOM_GEOMETRY_PARTITION_V2_GATE=PASS windows=${p.window_count} rules=${p.rule_count} classes=${p.arrangement_proof_class_count} triplets=${p.boundary_triplet_count} lines=${p.line_count}`);
          console.log(`CUSTOM_GEOMETRY_PARTITION_V2_DIGEST=${p.evidence_digest}`);
          NODE

      - name: Prove CUSTOM selector reachability V4
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-a-custom-selector-reachability-v4.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const r=JSON.parse(readFileSync(`${process.env.STAGE_A_CUSTOM_REACHABILITY_OUT}/report.json`,'utf8'));
          const memberships=(r.contexts??[]).reduce((n,c)=>n+(c.rule_ids??[]).length,0);
          if(r.exact_head_sha!==process.env.HEAD_SHA||r.model_version!=='CUSTOM_SELECTOR_UI_REACHABILITY_DIRECTED_V4_VISIBLE_VALUE_NORMALIZATION')throw new Error('CUSTOM_V5_REACHABILITY_MODEL_OR_HEAD');
          if(r.source_rule_count!==152||memberships!==152||r.unique_context_count!==137||r.unreachable_context_count!==0||r.status!=='PASS')throw new Error(`CUSTOM_V5_REACHABILITY_INVALID rules=${r.source_rule_count} memberships=${memberships} contexts=${r.unique_context_count} unreachable=${r.unreachable_context_count}`);
          console.log(`CUSTOM_SELECTOR_REACHABILITY_V4_GATE=PASS contexts=${r.unique_context_count} rules=${memberships} calls=${r.total_resolver_call_count}`);
          NODE

      - name: Prove full CUSTOM Runtime geometry equivalence V4
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-a-custom-runtime-geometry-equivalence-v4.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const r=JSON.parse(readFileSync(`${process.env.STAGE_A_CUSTOM_GEOMETRY_EQ_OUT}/report.json`,'utf8'));
          const p=JSON.parse(readFileSync(`${process.env.STAGE_A_CUSTOM_PARTITION_OUT}/report.json`,'utf8'));
          if(r.exact_head_sha!==process.env.HEAD_SHA)throw new Error('CUSTOM_V5_GEOMETRY_HEAD_MISMATCH');
          if(r.model_version!=='CUSTOM_RUNTIME_GEOMETRY_EQUIVALENCE_FULL_ARRANGEMENT_V4_NULL_SAFE_FORMAL_WRAPPER')throw new Error(`CUSTOM_V5_GEOMETRY_MODEL ${r.model_version}`);
          if(r.source_rule_count!==152||r.window_count!==92||r.selector_context_count!==137)throw new Error('CUSTOM_V5_GEOMETRY_CARDINALITY_DRIFT');
          if(r.arrangement_proof_class_count!==p.arrangement_proof_class_count||r.boundary_triplet_count!==p.boundary_triplet_count)throw new Error('CUSTOM_V5_GEOMETRY_PARTITION_DRIFT');
          if(r.mismatch_count!==0||r.status!=='PASS')throw new Error(`CUSTOM_V5_GEOMETRY_MISMATCHES=${r.mismatch_count} status=${r.status}`);
          if((r.contexts??[]).some((c)=>!c.positive_witness))throw new Error('CUSTOM_V5_POSITIVE_WITNESS_MISSING');
          console.log(`CUSTOM_RUNTIME_GEOMETRY_EQUIVALENCE_V4_GATE=PASS windows=${r.window_count} contexts=${r.selector_context_count} rules=${r.source_rule_count} classes=${r.arrangement_proof_class_count} triplets=${r.boundary_triplet_count} witnesses=${r.witness_evaluation_count} calls=${r.resolver_call_count}`);
          console.log(`CUSTOM_RUNTIME_GEOMETRY_EQUIVALENCE_V4_DIGEST=${r.evidence_digest}`);
          console.log('CUSTOM_SIZE_COVERAGE_GATE=PASS_GEOMETRY_EQUIVALENCE_ONLY_TRANSITION_PROOF_PENDING');
          console.log('APP_INTEGRATION_READY=false');
          console.log('RELEASE_INPUT_GATE=BLOCKED');
          NODE

      - name: Upload CUSTOM V5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-custom-selector-geometry-v5
          path: |
            artifacts/stage-a-custom-dimension-source-shape/
            artifacts/stage-a-formal-split-custom-guard-shape/
            artifacts/stage-a-custom-dimension-boundary-partition/
            artifacts/stage-a-custom-selector-reachability/
            artifacts/stage-a-custom-runtime-geometry-equivalence/
          if-no-files-found: error
