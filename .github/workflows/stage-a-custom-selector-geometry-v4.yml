name: Stage A CUSTOM Selector Geometry V4

on:
  push:
    branches:
      - feat/new-construction-runtime-ui-v16-20260910
    paths:
      - '.github/workflows/stage-a-custom-selector-geometry-v4.yml'
      - 'scripts/stage-a-custom-selector-reachability-v4.mjs'
      - 'scripts/stage-a-custom-runtime-geometry-equivalence-v2.mjs'
      - 'scripts/stage-a-custom-runtime-geometry-equivalence-v3.mjs'
      - 'src/catalog/runtime-master/apw431-formal-split-v1-adapter.mjs'

permissions:
  contents: read

concurrency:
  group: stage-a-custom-selector-geometry-v4
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_SHA: ${{ github.sha }}
      STAGE_A_CUSTOM_SHAPE_OUT: artifacts/stage-a-custom-dimension-source-shape
      STAGE_A_CUSTOM_GUARD_OUT: artifacts/stage-a-formal-split-custom-guard-shape
      STAGE_A_CUSTOM_SHAPE_INPUT: artifacts/stage-a-custom-dimension-source-shape/report.json
      STAGE_A_CUSTOM_GUARD_INPUT: artifacts/stage-a-formal-split-custom-guard-shape/report.json
      STAGE_A_CUSTOM_PARTITION_OUT: artifacts/stage-a-custom-dimension-boundary-partition
      STAGE_A_CUSTOM_PARTITION_INPUT: artifacts/stage-a-custom-dimension-boundary-partition/report.json
      STAGE_A_CUSTOM_REACHABILITY_OUT: artifacts/stage-a-custom-selector-reachability
      STAGE_A_CUSTOM_REACHABILITY_INPUT: artifacts/stage-a-custom-selector-reachability/report.json
      STAGE_A_CUSTOM_GEOMETRY_EQ_OUT: artifacts/stage-a-custom-runtime-geometry-equivalence
    steps:
      - name: Checkout exact push HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Exact SHA and syntax gate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA"
          node --check scripts/stage-a-custom-selector-reachability-v4.mjs
          node --check scripts/stage-a-custom-runtime-geometry-equivalence-v2.mjs
          node --check scripts/stage-a-custom-runtime-geometry-equivalence-v3.mjs
          node --check src/catalog/runtime-master/apw431-formal-split-v1-adapter.mjs
          echo "EXACT_HEAD_GATE=PASS sha=$actual"
          echo 'CUSTOM_V4_SCRIPT_SYNTAX_GATE=PASS'

      - name: Regenerate CUSTOM source and guard evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-a-custom-dimension-source-shape-diagnostic.mjs
          node scripts/stage-a-formal-split-custom-guard-shape-diagnostic.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const s=JSON.parse(readFileSync(`${process.env.STAGE_A_CUSTOM_SHAPE_OUT}/report.json`,'utf8'));
          const g=JSON.parse(readFileSync(`${process.env.STAGE_A_CUSTOM_GUARD_OUT}/report.json`,'utf8'));
          if(s.exact_head_sha!==process.env.HEAD_SHA||g.exact_head_sha!==process.env.HEAD_SHA)throw new Error('CUSTOM_V4_SOURCE_HEAD_MISMATCH');
          if(s.series_count!==6||s.total_custom_rule_count!==152||s.total_explicit_custom_window_id_count!==92||s.unsupported_count!==0||s.source_shape_status!=='CUSTOM_SOURCE_SHAPE_INVENTORIED')throw new Error('CUSTOM_V4_SOURCE_INVALID');
          if(g.status!=='PASS'||g.rule_count!==54)throw new Error(`CUSTOM_V4_GUARD_INVALID status=${g.status} rules=${g.rule_count}`);
          console.log(`CUSTOM_SOURCE_SHAPE_GATE=PASS rules=${s.total_custom_rule_count} windows=${s.total_explicit_custom_window_id_count}`);
          console.log(`FORMAL_SPLIT_CUSTOM_GUARD_SHAPE_GATE=PASS rules=${g.rule_count}`);
          NODE

      - name: Regenerate exact CUSTOM boundary partition
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-a-custom-dimension-boundary-partition-proof.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const p=JSON.parse(readFileSync(`${process.env.STAGE_A_CUSTOM_PARTITION_OUT}/report.json`,'utf8'));
          if(p.exact_head_sha!==process.env.HEAD_SHA)throw new Error('CUSTOM_V4_PARTITION_HEAD_MISMATCH');
          if(p.window_count!==92||p.rule_count!==152||p.arrangement_proof_class_count!==4268||p.boundary_triplet_count!==2088||p.invalid_boundary_triplet_count!==0||p.selector_geometry_separation_violation_count!==0)throw new Error('CUSTOM_V4_PARTITION_INVALID');
          if(p.status!=='GEOMETRY_PARTITION_PASS_RUNTIME_EQUIVALENCE_PENDING')throw new Error(`CUSTOM_V4_PARTITION_STATUS ${p.status}`);
          console.log(`CUSTOM_GEOMETRY_PARTITION_GATE=PASS windows=${p.window_count} rules=${p.rule_count} classes=${p.arrangement_proof_class_count} triplets=${p.boundary_triplet_count}`);
          NODE

      - name: Prove CUSTOM selector reachability V4
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-a-custom-selector-reachability-v4.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const r=JSON.parse(readFileSync(`${process.env.STAGE_A_CUSTOM_REACHABILITY_OUT}/report.json`,'utf8'));
          if(r.exact_head_sha!==process.env.HEAD_SHA)throw new Error('CUSTOM_V4_REACHABILITY_HEAD_MISMATCH');
          const memberships=(r.contexts??[]).reduce((n,c)=>n+(c.rule_ids??[]).length,0);
          if(r.model_version!=='CUSTOM_SELECTOR_UI_REACHABILITY_DIRECTED_V4_VISIBLE_VALUE_NORMALIZATION')throw new Error(`CUSTOM_V4_MODEL_UNEXPECTED ${r.model_version}`);
          if(r.source_rule_count!==152||memberships!==152||r.unreachable_context_count!==0||r.status!=='PASS')throw new Error(`CUSTOM_V4_REACHABILITY_INVALID rules=${r.source_rule_count} memberships=${memberships} unreachable=${r.unreachable_context_count} status=${r.status}`);
          if(!r.evidence_digest)throw new Error('CUSTOM_V4_REACHABILITY_DIGEST_MISSING');
          console.log(`CUSTOM_SELECTOR_REACHABILITY_V4_GATE=PASS contexts=${r.unique_context_count} rules=${memberships} calls=${r.total_resolver_call_count} implicit_geometry_inert=${r.implicit_geometry_inert_selector_count}`);
          console.log(`CUSTOM_SELECTOR_REACHABILITY_V4_DIGEST=${r.evidence_digest}`);
          NODE

      - name: Prove full CUSTOM Runtime geometry equivalence V3
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-a-custom-runtime-geometry-equivalence-v3.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const r=JSON.parse(readFileSync(`${process.env.STAGE_A_CUSTOM_GEOMETRY_EQ_OUT}/report.json`,'utf8'));
          if(r.exact_head_sha!==process.env.HEAD_SHA)throw new Error('CUSTOM_V4_GEOMETRY_HEAD_MISMATCH');
          if(r.model_version!=='CUSTOM_RUNTIME_GEOMETRY_EQUIVALENCE_FULL_ARRANGEMENT_V3_FORMAL_GUARD_SEMANTICS')throw new Error(`CUSTOM_V4_GEOMETRY_MODEL_UNEXPECTED ${r.model_version}`);
          if(r.source_rule_count!==152||r.window_count!==92||r.selector_context_count!==137)throw new Error(`CUSTOM_V4_GEOMETRY_CARDINALITY_DRIFT rules=${r.source_rule_count} windows=${r.window_count} contexts=${r.selector_context_count}`);
          if(r.arrangement_proof_class_count!==4268||r.boundary_triplet_count!==2088)throw new Error(`CUSTOM_V4_GEOMETRY_PARTITION_DRIFT classes=${r.arrangement_proof_class_count} triplets=${r.boundary_triplet_count}`);
          if(r.mismatch_count!==0||r.status!=='PASS')throw new Error(`CUSTOM_V4_GEOMETRY_MISMATCHES=${r.mismatch_count} status=${r.status}`);
          if(!r.evidence_digest)throw new Error('CUSTOM_V4_GEOMETRY_DIGEST_MISSING');
          if((r.contexts??[]).some((c)=>!c.positive_witness))throw new Error('CUSTOM_V4_POSITIVE_WITNESS_MISSING');
          console.log(`CUSTOM_RUNTIME_GEOMETRY_EQUIVALENCE_V3_GATE=PASS windows=${r.window_count} contexts=${r.selector_context_count} rules=${r.source_rule_count} classes=${r.arrangement_proof_class_count} triplets=${r.boundary_triplet_count} witnesses=${r.witness_evaluation_count} calls=${r.resolver_call_count}`);
          console.log(`CUSTOM_RUNTIME_GEOMETRY_EQUIVALENCE_V3_DIGEST=${r.evidence_digest}`);
          console.log('CUSTOM_SIZE_COVERAGE_GATE=PASS_GEOMETRY_EQUIVALENCE_ONLY_TRANSITION_PROOF_PENDING');
          console.log('APP_INTEGRATION_READY=false');
          console.log('RELEASE_INPUT_GATE=BLOCKED');
          NODE

      - name: Upload CUSTOM V4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-custom-selector-geometry-v4
          path: |
            artifacts/stage-a-custom-dimension-source-shape/
            artifacts/stage-a-formal-split-custom-guard-shape/
            artifacts/stage-a-custom-dimension-boundary-partition/
            artifacts/stage-a-custom-selector-reachability/
            artifacts/stage-a-custom-runtime-geometry-equivalence/
            artifacts/stage-a-custom-runtime-geometry-equivalence-v3-generated/
          if-no-files-found: error
