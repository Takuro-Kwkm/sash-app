name: Stage A MULTI_ENUM Browser Equivalence Candidate

on:
  workflow_call:
    inputs:
      controller_head:
        required: true
        type: string

permissions:
  issues: read
  contents: read

concurrency:
  group: stage-a-multienum-browser-equivalence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance-authority:
    uses: ./.github/workflows/governance-authorization.yml
    with:
      controller_head: ${{ inputs.controller_head }}
      release: false

  browser_equivalence_candidate:
    needs: ["governance-authority"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && (true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      STAGE_A_BROWSER_EQ_OUT: artifacts/stage-a-multienum-browser-equivalence-candidate
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify runtime maintenance scope and retain predecessor
        if: hashFiles('contracts/production/authority-successors/node-security.20261021.json') != ''
        working-directory: ${{ github.workspace }}
        run: python3 -B scripts/production/node-security.py prepare --github-env "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Exact SHA gate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA"
          echo "EXACT_HEAD_GATE=PASS sha=$actual"

        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Install app dependencies
        run: npm install --package-lock=false --ignore-scripts

        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Install Chromium QA dependency
        run: |
          npm install --package-lock=false --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Start exact-head local Runtime UI
        shell: bash
        run: |
          set -euo pipefail
          npm run start:qa > /tmp/stage-a-browser-equivalence.log 2>&1 &
          echo $! > /tmp/stage-a-browser-equivalence.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/api/health > artifacts-health.json; then
              cat artifacts-health.json
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/stage-a-browser-equivalence.log || true
          exit 1

        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Run non-governing Desktop / Smartphone equivalence candidate
        shell: bash
        run: |
          set -euo pipefail
          node test/browser/stage-a-multienum-browser-equivalence-candidate.mjs | tee /tmp/stage-a-browser-equivalence-candidate.log

        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Stop local Runtime UI
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/stage-a-browser-equivalence.pid ]]; then
            kill "$(cat /tmp/stage-a-browser-equivalence.pid)" 2>/dev/null || true
          fi

        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Upload browser equivalence candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-multienum-browser-equivalence-candidate
          path: |
            ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}/artifacts/stage-a-multienum-browser-equivalence-candidate/
            /tmp/stage-a-browser-equivalence-candidate.log
          if-no-files-found: warn
