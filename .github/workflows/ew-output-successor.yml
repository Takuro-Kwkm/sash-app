name: EW Output Successor
on:
  pull_request:
    paths: ['src/estimate-output/xlsx-renderer.mjs', 'test/74-estimate-output.test.mjs', 'scripts/production/ew-change.py', 'scripts/production/prepare-ew.py', 'scripts/production/test_ew_output_successor.py', 'contracts/production/order5-*.json', '.github/workflows/ew-output-successor.yml']
  push:
    branches: [main]
    paths: ['src/estimate-output/xlsx-renderer.mjs', 'test/74-estimate-output.test.mjs', 'scripts/production/ew-change.py', 'scripts/production/prepare-ew.py', 'scripts/production/test_ew_output_successor.py', 'contracts/production/order5-*.json', '.github/workflows/ew-output-successor.yml']
permissions:
  contents: read
jobs:
  output:
    runs-on: ubuntu-24.04
    env:
      SHARED_HARNESS_ROOT: /tmp/order5-shared-release
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24.19.0'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14'}
      - run: python -B scripts/production/unpack-release-authority.py /tmp/order5-shared-release
      - run: python -B scripts/production/test_ew_output_successor.py
      - run: node --test test/74-estimate-output.test.mjs
      - run: npm install --ignore-scripts --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Native EW and eight-series browser/output regression
        env:
          SASH_RELEASE_COMMIT_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'
          EW_QA_URL: http://127.0.0.1:4173
          EW_EXPECTED_COMMIT: '${{ github.event.pull_request.head.sha || github.sha }}'
          EW_QA_OUTPUT: artifacts/order5-ew-output/ew
          QA_BASE_URL: http://127.0.0.1:4173
          QA_EXPECTED_COMMIT: '${{ github.event.pull_request.head.sha || github.sha }}'
          QA_OUTPUT_DIR: artifacts/order5-ew-output/eight-series
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SASH_RELEASE_COMMIT_SHA"
          npm run start:qa > /tmp/order5-output.log 2>&1 &
          task_server_pid=$!
          trap 'kill "$task_server_pid"' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 0.5
          done
          node test/browser/ew-october-2026-browser-qa.mjs
          node test/browser/eight-series-business-flow-qa.mjs
      - uses: actions/upload-artifact@v4
        with: {name: order5-ew-output, path: artifacts/order5-ew-output, if-no-files-found: error}
