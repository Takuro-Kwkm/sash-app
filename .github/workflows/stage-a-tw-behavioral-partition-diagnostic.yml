name: Stage A TW Behavioral Partition Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage-a-tw-behavioral-partition-diagnostic.yml'
      - 'scripts/stage-a-tw-behavioral-partition-diagnostic.mjs'
      - 'src/catalog/runtime-master/**'
      - 'src/catalog/**'

permissions:
  contents: read

concurrency:
  group: stage-a-tw-behavioral-partition-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  completed_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Completed diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          echo 'TW_BEHAVIORAL_PARTITION_DIAGNOSTIC_ROUTE=CLOSED'
          echo 'EVIDENCE_RUN=34920333109'
          echo 'TARGET_WINDOW=SWT-LIX-TW-TATE-GREMON-TF'
          echo 'UI_EXPOSED_STANDARD_SIZE_COUNT=12'
          echo 'SIZE_BEHAVIOR_CLASS_COUNT=1'
          echo 'GLASS_TYPE_RAW_PER_BASE=4'
          echo 'GLASS_TYPE_BEHAVIOR_CLASSES_PER_BASE=2'
          echo 'GLASS_DETAIL_RAW_PER_BASE=4'
          echo 'GLASS_DETAIL_BEHAVIOR_CLASSES_PER_BASE=1'
          echo 'ACTIVE_OPTION_SELECTION_DENIAL_RULE_COUNT=0'
          echo 'NEXT_ACTIVE_ROUTE=TW_BEHAVIORAL_PROJECTION_COUNT_PILOT'
          echo 'APP_INTEGRATION_READY=false'
          echo 'RELEASE_INPUT_GATE=BLOCKED'
