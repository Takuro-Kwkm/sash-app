name: Global Window Selection Flow Gate

on:
  workflow_call:
    inputs:
      controller_head:
        required: true
        type: string

permissions:
  issues: read
  contents: read
  pull-requests: read

concurrency:
  group: global-window-selection-flow-${{ github.ref }}-${{ inputs.controller_head }}
  cancel-in-progress: true

jobs:
  governance-authority:
    uses: ./.github/workflows/governance-authorization.yml
    with:
      controller_head: ${{ inputs.controller_head }}
      release: false

  governance-precheck:
    needs: ["governance-authority"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && (true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      authorized: ${{ steps.human-review.outputs.authorized }}
    steps:
      - name: Checkout exact HEAD for governance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify project governance state
        run: node scripts/governance/verify-project-state.mjs

      - name: Evaluate Human Review authorization
        id: human-review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNANCE_EVIDENCE_MANIFEST: artifacts/governance/qa-evidence-manifest.json
        run: |
          set -euo pipefail
          node scripts/governance/build-human-flow-review.mjs
          node scripts/governance/verify-human-flow-field-coverage.mjs
          node scripts/governance/collect-qa-evidence.mjs
          node scripts/governance/read-human-approval.mjs
          node scripts/governance/evaluate-gates.mjs
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('artifacts/governance/gate-results.json', 'utf8'));
          const authorized = result.gates?.HUMAN_FLOW_REVIEW_GATE?.status === 'PASS';
          appendFileSync(process.env.GITHUB_OUTPUT, `authorized=${authorized ? 'true' : 'false'}\n`);
          console.log(`HUMAN_FLOW_REVIEW_GATE=${authorized ? 'PASS' : result.gates?.HUMAN_FLOW_REVIEW_GATE?.status || 'BLOCKED'}`);
          console.log(`POST_HUMAN_REVIEW_AUTHORIZED=${authorized ? 'TRUE' : 'FALSE'}`);
          NODE

      - name: Upload governance precheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-flow-governance-precheck-${{ env.HEAD_SHA }}
          path: artifacts/governance/
          if-no-files-found: error

  global-flow:
    needs: ["governance-authority", "governance-precheck"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && (needs.governance-precheck.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      STAGE_A_CUSTOM_SHAPE_OUT: artifacts/stage-a-custom-dimension-source-shape
      STAGE_A_CUSTOM_GUARD_OUT: artifacts/stage-a-formal-split-custom-guard-shape
      STAGE_A_CUSTOM_SHAPE_INPUT: artifacts/stage-a-custom-dimension-source-shape/report.json
      STAGE_A_CUSTOM_GUARD_INPUT: artifacts/stage-a-formal-split-custom-guard-shape/report.json
      STAGE_A_CUSTOM_PARTITION_OUT: artifacts/stage-a-custom-dimension-boundary-partition
      STAGE_A_CUSTOM_PARTITION_INPUT: artifacts/stage-a-custom-dimension-boundary-partition/report.json
      STAGE_A_CUSTOM_REACHABILITY_OUT: artifacts/stage-a-custom-selector-reachability
      STAGE_A_CUSTOM_REACHABILITY_INPUT: artifacts/stage-a-custom-selector-reachability/report.json
      STAGE_A_CUSTOM_GEOMETRY_EQ_OUT: artifacts/stage-a-custom-runtime-geometry-equivalence
      STAGE_A_CUSTOM_GEOMETRY_EQ_INPUT: artifacts/stage-a-custom-runtime-geometry-equivalence/report.json
      STAGE_A_CUSTOM_TRANSITION_OUT: artifacts/stage-a-custom-transition-proof-v4
      STAGE_A_REACHABILITY_REPORT: artifacts/stage-a-custom-selector-reachability/report.json
      STAGE_A_TRANSITION_REPORT: artifacts/stage-a-custom-transition-proof-v4/report.json
      STAGE_A_FULL_BROWSER_OUT: artifacts/stage-a-full-browser-qa
      POST_HUMAN_EVIDENCE_OUT: artifacts/governance/post-human
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --ignore-scripts

      - name: Global flow syntax and source gates
        shell: bash
        run: |
          set -euo pipefail
          node --check src/catalog/runtime-master/canonical-window-semantic-schema.mjs
          node --check src/catalog/runtime-master/global-window-selection-flow-engine.mjs
          node --check src/catalog/runtime-master/new-construction-sash-runtime-ui-contract.mjs
          node --check src/catalog/runtime-master/inner-window-runtime-ui-contract.mjs
          node --check src/catalog/runtime-master/formal-product-runtime-v2-loader.mjs
          node --check src/catalog/runtime-master/runtime-app-bridge.mjs
          node --check scripts/global-window-flow-field-inventory.mjs
          node --check test/79-global-window-selection-flow.test.mjs
          node --check test/80-canonical-window-semantic-schema.test.mjs
          node --check test/81-global-window-flow-signature-transition.test.mjs
          node --check test/browser/global-window-selection-flow-browser-qa.mjs
          node --check test/browser/inplus-v04r2-global-flow-full-coverage-browser-qa.mjs
          node --check scripts/uchirimo-full-selector-proof.mjs
          node --check scripts/governance/proof-dependency-fingerprint.mjs
          if grep -REn "other:\$\{String\(key\)|other:" src/catalog/runtime-master/new-construction-sash-runtime-ui-contract.mjs src/catalog/runtime-master/inner-window-runtime-ui-contract.mjs; then
            echo 'FLOW_SCHEMA_UNMAPPED_FIELD_GATE=FAIL legacy other:* fallback remains'
            exit 31
          fi
          if grep -REn "if[[:space:]]*\([^)]*(series|manufacturer|productId)[[:space:]]*={2,3}" src/catalog/runtime-master/global-window-selection-flow-engine.mjs src/catalog/runtime-master/canonical-window-semantic-schema.mjs; then
            echo 'SERIES_OVERRIDE_ELIMINATION_GATE=FAIL'
            exit 32
          fi
          echo 'SINGLE_FLOW_ENGINE_GATE=PASS_CODE'
          echo 'SERIES_OVERRIDE_ELIMINATION_GATE=PASS_CODE'

      - name: Runtime source lint and UI contract typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Global flow unit and signature-transition gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$POST_HUMAN_EVIDENCE_OUT"
          node --test test/79-global-window-selection-flow.test.mjs test/80-canonical-window-semantic-schema.test.mjs test/81-global-window-flow-signature-transition.test.mjs 2>&1 | tee "$POST_HUMAN_EVIDENCE_OUT/global-flow-unit.tap"
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          mkdirSync(process.env.POST_HUMAN_EVIDENCE_OUT,{recursive:true});
          writeFileSync(process.env.POST_HUMAN_EVIDENCE_OUT+'/global-flow-unit.json',JSON.stringify({
            exact_head:process.env.HEAD_SHA,
            status:'PASS',
            gates:['FULL_FLOW_SIGNATURE_COVERAGE_GATE','FLOW_TRANSITION_GATE'],
            command:'node --test test/79-global-window-selection-flow.test.mjs test/80-canonical-window-semantic-schema.test.mjs test/81-global-window-flow-signature-transition.test.mjs'
          },null,2)+'\n');
          NODE
          echo 'CANONICAL_SLOT_SCHEMA_GATE=PASS'
          echo 'FULL_FLOW_SIGNATURE_COVERAGE_GATE=PASS_PAIRWISE_WINDOW_USER_FACING_FIELD_UNIVERSES'
          echo 'FLOW_TRANSITION_GATE=PASS_WINDOW_RESOLVER_TRANSITIONS'

      - name: Current-head full CUSTOM geometry and transition proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          node scripts/stage-a-custom-dimension-source-shape-diagnostic.mjs
          node scripts/stage-a-formal-split-custom-guard-shape-diagnostic.mjs
          node scripts/stage-a-custom-dimension-boundary-partition-proof-v2.mjs
          node scripts/stage-a-custom-selector-reachability-v4.mjs
          node scripts/stage-a-custom-runtime-geometry-equivalence-v4.mjs
          CUSTOM_GEOMETRY_EVIDENCE_HEAD="$HEAD_SHA" node scripts/stage-a-custom-transition-proof-v4.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const read=(path)=>JSON.parse(readFileSync(path,'utf8'));
          const shape=read(process.env.STAGE_A_CUSTOM_SHAPE_INPUT);
          const reach=read(process.env.STAGE_A_CUSTOM_REACHABILITY_INPUT);
          const geometry=read(process.env.STAGE_A_CUSTOM_GEOMETRY_EQ_INPUT);
          const transition=read(`${process.env.STAGE_A_CUSTOM_TRANSITION_OUT}/report.json`);
          for(const row of [shape,reach,geometry,transition])if(row.exact_head_sha!==process.env.HEAD_SHA)throw new Error('CUSTOM_EXACT_HEAD_MISMATCH');
          if(shape.total_custom_rule_count!==152||shape.unsupported_count!==0)throw new Error('CUSTOM_SOURCE_SHAPE_INVALID');
          if(reach.source_rule_count!==152||reach.unique_context_count!==137||reach.unreachable_context_count!==0||reach.status!=='PASS')throw new Error('CUSTOM_REACHABILITY_INVALID');
          if(geometry.source_rule_count!==152||geometry.window_count!==92||geometry.selector_context_count!==137||geometry.mismatch_count!==0||geometry.status!=='PASS')throw new Error('CUSTOM_GEOMETRY_INVALID');
          if(transition.selector_context_count!==137||transition.evaluation_count!==1081||transition.status!=='PASS'||transition.gate_status?.custom_size_coverage_gate!=='PASS')throw new Error('CUSTOM_TRANSITION_INVALID');
          console.log('CUSTOM_SIZE_COVERAGE_GATE=PASS');
          console.log('UNVERIFIED_CUSTOM_QA_CASE_COUNT=0');
          NODE

      - name: Full Window Runtime field inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/global-window-flow-field-inventory.mjs
          echo 'FLOW_SCHEMA_UNMAPPED_FIELD_GATE=PASS_ALL_REGISTERED_WINDOW_USER_FACING_FIELDS'

      - name: Legacy core regression partition
        run: node --test test/01-core.test.mjs test/02-lr.test.mjs test/03-features.test.mjs test/04-thermosl.test.mjs test/61-vercel-route-contract.test.mjs

      - name: Runtime package regression partition
        run: node --test test/70-runtime-manifest-ew-integration.test.mjs test/70-runtime-manifest-tw-integration.test.mjs test/71-vercel-adapter.test.mjs

      - name: TW UI regression partition
        run: node --test test/71-runtime-ui-tw-gate.test.mjs

      - name: Uchirimo UI regression partition
        run: node --test test/72-runtime-manifest-uchirimo-integration.test.mjs test/73-runtime-ui-uchirimo-gate.test.mjs

      - name: Compute Uchirimo selector proof dependency fingerprint
        id: uchirimo-proof-fingerprint
        shell: bash
        run: |
          set -euo pipefail
          node scripts/governance/proof-dependency-fingerprint.mjs --mode fingerprint --family UCHIRIMO_SELECTOR --fingerprint-out artifacts/governance/uchirimo-selector-proof-fingerprint.json

      - name: Restore Uchirimo selector proof cache
        id: uchirimo-proof-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/uchirimo-full-selector-proof
          key: proof-uchirimo-selector-v1-${{ steps.uchirimo-proof-fingerprint.outputs.fingerprint }}

      - name: Bind cached Uchirimo selector proof to current HEAD
        id: uchirimo-proof-bind
        if: ${{ steps.uchirimo-proof-cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          set +e
          node scripts/governance/proof-dependency-fingerprint.mjs --mode bind --family UCHIRIMO_SELECTOR --artifact artifacts/uchirimo-full-selector-proof/report.json --metadata artifacts/uchirimo-full-selector-proof/source-metadata.json --binding artifacts/uchirimo-full-selector-proof/current-head-binding.json
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "UCHIRIMO_SELECTOR_PROOF_REUSE=PASS"
          else
            rm -rf artifacts/uchirimo-full-selector-proof
            echo "reused=false" >> "$GITHUB_OUTPUT"
            echo "UCHIRIMO_SELECTOR_PROOF_REUSE=INVALID_RERUN_REQUIRED"
          fi

      - name: Uchirimo full discrete selector proof
        if: ${{ steps.uchirimo-proof-bind.outputs.reused != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/uchirimo-full-selector-proof.mjs

      - name: Stamp fresh Uchirimo selector proof metadata
        if: ${{ steps.uchirimo-proof-bind.outputs.reused != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/governance/proof-dependency-fingerprint.mjs --mode stamp --family UCHIRIMO_SELECTOR --artifact artifacts/uchirimo-full-selector-proof/report.json --metadata artifacts/uchirimo-full-selector-proof/source-metadata.json

      - name: Save Uchirimo selector proof cache
        if: ${{ steps.uchirimo-proof-cache.outputs.cache-hit != 'true' && steps.uchirimo-proof-bind.outputs.reused != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: artifacts/uchirimo-full-selector-proof
          key: proof-uchirimo-selector-v1-${{ steps.uchirimo-proof-fingerprint.outputs.fingerprint }}

      - name: New-construction UI regression partition
        run: node --test test/74-new-construction-ui-v16.test.mjs test/75-stage-a-size-display-full-coverage.test.mjs test/76-custom-dimension-safety.test.mjs

      - name: App integration regression partition
        run: node --test test/72-work-management.test.mjs test/74-estimate-output.test.mjs test/75-formal-runtime-resync.test.mjs

      - name: Dependency gate direct proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$POST_HUMAN_EVIDENCE_OUT"
          node --test test/70-runtime-manifest-ew-integration.test.mjs test/73-runtime-ui-uchirimo-gate.test.mjs test/77-runtime-ui-inplus-v04r2-installability-coverage.test.mjs test/84-requested-flow-acceptance.test.mjs 2>&1 | tee "$POST_HUMAN_EVIDENCE_OUT/dependency-gate.tap"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.POST_HUMAN_EVIDENCE_OUT+'/dependency-gate.json',JSON.stringify({
            exact_head:process.env.HEAD_SHA,
            status:'PASS',
            gate:'DEPENDENCY_GATE',
            command:'node --test test/70-runtime-manifest-ew-integration.test.mjs test/73-runtime-ui-uchirimo-gate.test.mjs test/77-runtime-ui-inplus-v04r2-installability-coverage.test.mjs test/84-requested-flow-acceptance.test.mjs'
          },null,2)+'\n');
          NODE

      - name: UI flow gate direct proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$POST_HUMAN_EVIDENCE_OUT"
          node --test test/79-global-window-selection-flow.test.mjs test/74-new-construction-ui-v16.test.mjs test/73-runtime-ui-uchirimo-gate.test.mjs test/75-runtime-ui-inplus-v04r2-gate.test.mjs 2>&1 | tee "$POST_HUMAN_EVIDENCE_OUT/ui-flow-gate.tap"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.POST_HUMAN_EVIDENCE_OUT+'/ui-flow-gate.json',JSON.stringify({
            exact_head:process.env.HEAD_SHA,
            status:'PASS',
            gate:'UI_FLOW_GATE',
            command:'node --test test/79-global-window-selection-flow.test.mjs test/74-new-construction-ui-v16.test.mjs test/73-runtime-ui-uchirimo-gate.test.mjs test/75-runtime-ui-inplus-v04r2-gate.test.mjs'
          },null,2)+'\n');
          NODE

      - name: Full repository regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$POST_HUMAN_EVIDENCE_OUT"
          npm test 2>&1 | tee "$POST_HUMAN_EVIDENCE_OUT/full-repository-regression.log"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.POST_HUMAN_EVIDENCE_OUT+'/full-repository-regression.json',JSON.stringify({
            exact_head:process.env.HEAD_SHA,
            status:'PASS',
            gate:'AUTOMATED_TEST_GATE',
            command:'npm test'
          },null,2)+'\n');
          NODE
          echo 'FLOW_REGRESSION_GATE=PASS_ALL_REPOSITORY_TESTS'

      - name: Runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run start:qa > /tmp/sash-global-flow.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/api/health > /tmp/health.json; then break; fi
            sleep 0.5
          done
          cat /tmp/health.json
          node -e 'const h=require("/tmp/health.json"); if(!h.ok) process.exit(1); const ids=new Set(h.runtimeMasterIntegrations.map(x=>x.id)); const expected=["SER-LIX-EW","SER-LIX-SAMOS2H","SER-LIX-SAMOSL","SER-LIXIL-TW","SER-LIXIL-INPLUS","SER-LIXIL-RECHENT-D3-NF","SER-YKK-APW430","SER-YKK-APW431","SER-YKKAP-UCHIRIMO"]; if(ids.size!==expected.length||expected.some(id=>!ids.has(id))) process.exit(1); const s=h.runtimeMasterIntegrations.find(x=>x.id==="SER-LIX-SAMOS2H"); const l=h.runtimeMasterIntegrations.find(x=>x.id==="SER-LIX-SAMOSL"); if(s?.packageVersion!=="v0.9-R4"||s?.sourceHash!=="993481b2f0ab1d519a091e1b9f99a329eef7c67ec89cd1c82ddfab0d3c624955"||l?.packageVersion!=="v0.7-R2"||l?.sourceHash!=="4cf2a4b1572f68288fa108ccd33d30cc80d5170f2f5303864ca56ca67c34cec3") process.exit(1)'
          echo 'WINDOW_FLOW_BASELINE_GATE=PASS_RUNTIME_SMOKE_9_READY_INTEGRATIONS'

      - name: Install browser QA dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Desktop and smartphone runtime browser flow QA
        shell: bash
        run: |
          set -euo pipefail
          npm run start:qa > /tmp/sash-global-flow-browser.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 0.5
          done
          node test/browser/global-window-selection-flow-browser-qa.mjs
          node test/browser/ew-runtime-browser-qa.mjs
          node test/browser/tw-runtime-browser-qa.mjs
          node test/browser/uchirimo-runtime-browser-qa.mjs
          node test/browser/formal-runtime-resync-browser-qa.mjs
          node test/browser/release-regression-browser-qa.mjs
          node test/browser/stage-a-full-browser-qa.mjs
          echo 'FULL_BROWSER_FLOW_QA_GATE=PASS_8_WINDOW_RUNTIME_TRANSITIONS_DESKTOP_SMARTPHONE'

      - name: Inplus v0.4-R2 exhaustive Global Flow browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm run start:qa > /tmp/sash-inplus-global-flow-browser.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 0.5
          done
          node test/browser/inplus-v04r2-global-flow-full-coverage-browser-qa.mjs
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const base={
            exact_head:process.env.HEAD_SHA,
            status:'PASS',
            desktop_smartphone:true,
            global_flow_browser:'artifacts/global-window-selection-flow-browser-qa/report.json',
            inplus_exhaustive_browser:'artifacts/inplus-v04r2-global-flow-full-coverage-browser-qa/report.json'
          };
          writeFileSync(process.env.POST_HUMAN_EVIDENCE_OUT+'/browser-flow-qa.json',JSON.stringify({...base,gate:'FULL_BROWSER_FLOW_QA_GATE'},null,2)+'\n');
          writeFileSync(process.env.POST_HUMAN_EVIDENCE_OUT+'/regression-gate.json',JSON.stringify({...base,gate:'REGRESSION_GATE',automated_test_log:'artifacts/governance/post-human/full-repository-regression.log'},null,2)+'\n');
          NODE
          echo 'INPLUS_V04R2_GLOBAL_FLOW_QA_CASE_COUNT=1148'
          echo 'INPLUS_V04R2_GLOBAL_FLOW_BROWSER_STATE_CHECKS_TOTAL=3350'
          echo 'INPLUS_V04R2_GLOBAL_FLOW_UNVERIFIED_QA_CASE_COUNT=0'
          echo 'FULL_BROWSER_FLOW_QA_GATE=PASS'

      - name: Exact-head repository gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/24" > /tmp/pr24.json
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          const pr=JSON.parse(readFileSync('/tmp/pr24.json','utf8'));
          if(pr.state!=='open'||pr.merged_at!==null||pr.base?.ref!=='main'||pr.head?.ref!=='feat/new-construction-runtime-ui-v16-20260910'||pr.head?.sha!==process.env.HEAD_SHA)throw new Error('REPOSITORY_PR_IDENTITY_GATE');
          mkdirSync(process.env.POST_HUMAN_EVIDENCE_OUT,{recursive:true});
          writeFileSync(process.env.POST_HUMAN_EVIDENCE_OUT+'/repository-gate.json',JSON.stringify({
            exact_head:process.env.HEAD_SHA,status:'PASS',gate:'REPOSITORY_GATE',pull_request:24,state:pr.state,base:pr.base.ref,head:pr.head.ref,head_sha:pr.head.sha
          },null,2)+'\n');
          console.log('REPOSITORY_GATE=PASS');
          NODE

      - name: Emit and aggregate direct post-Human Governance evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNANCE_EVIDENCE_MANIFEST: artifacts/governance/qa-evidence-manifest.json
        run: |
          set -euo pipefail
          node scripts/governance/build-human-flow-review.mjs
          node scripts/governance/verify-human-flow-field-coverage.mjs
          node scripts/governance/emit-global-flow-evidence.mjs
          node scripts/governance/collect-qa-evidence.mjs
          node scripts/governance/read-human-approval.mjs
          node scripts/governance/evaluate-gates.mjs
          node scripts/governance/generate-progress-ledger.mjs

      - name: Upload Global Window Flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-window-selection-flow-evidence-${{ github.sha }}
          path: |
            artifacts/governance/
            artifacts/global-window-selection-flow-browser-qa/
            artifacts/inplus-v04r2-global-flow-full-coverage-browser-qa/
            artifacts/uchirimo-runtime-browser-qa/
            artifacts/uchirimo-full-selector-proof/
            artifacts/stage-a-custom-dimension-source-shape/
            artifacts/stage-a-custom-selector-reachability/
            artifacts/stage-a-custom-runtime-geometry-equivalence/
            artifacts/stage-a-custom-transition-proof-v4/
            artifacts/stage-a-full-browser-qa/
          if-no-files-found: error

      - name: Gate summary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result=JSON.parse(readFileSync('artifacts/governance/gate-results.json','utf8'));
          for(const id of [
