name: Global Window Selection Flow Gate

on:
  workflow_call:
    inputs:
      controller_head:
        required: true
        type: string

permissions:
  issues: read
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: global-window-selection-flow-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  governance-authority:
    uses: ./.github/workflows/governance-authorization.yml
    with:
      controller_head: ${{ inputs.controller_head }}
      release: false

  governance-precheck:
    needs: ["governance-authority"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && (true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      authorized: ${{ steps.human-review.outputs.authorized }}
    steps:
      - name: Checkout exact HEAD for governance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify project governance state
        run: node scripts/governance/verify-project-state.mjs

      - name: Evaluate Human Review authorization
        id: human-review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNANCE_EVIDENCE_MANIFEST: artifacts/governance/qa-evidence-manifest.json
        run: |
          set -euo pipefail
          node scripts/governance/build-human-flow-review.mjs
          node scripts/governance/verify-human-flow-field-coverage.mjs
          node scripts/governance/collect-qa-evidence.mjs
          node scripts/governance/read-human-approval.mjs
          node scripts/governance/evaluate-gates.mjs
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('artifacts/governance/gate-results.json', 'utf8'));
          const authorized = result.gates?.HUMAN_FLOW_REVIEW_GATE?.status === 'PASS';
          appendFileSync(process.env.GITHUB_OUTPUT, `authorized=${authorized ? 'true' : 'false'}\n`);
          console.log(`HUMAN_FLOW_REVIEW_GATE=${authorized ? 'PASS' : result.gates?.HUMAN_FLOW_REVIEW_GATE?.status || 'BLOCKED'}`);
          console.log(`POST_HUMAN_REVIEW_AUTHORIZED=${authorized ? 'TRUE' : 'FALSE'}`);
          NODE

      - name: Upload governance precheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-flow-governance-precheck-${{ env.HEAD_SHA }}
          path: artifacts/governance/
          if-no-files-found: error

  uchirimo-selector-proof-cache:
    needs: ["governance-authority", "governance-precheck"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && (needs.governance-precheck.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      reused: ${{ steps.cache-decision.outputs.reused }}
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compute Uchirimo selector proof dependency fingerprint
        id: uchirimo-proof-fingerprint
        shell: bash
        run: |
          set -euo pipefail
          node scripts/governance/proof-dependency-fingerprint.mjs --mode fingerprint --family UCHIRIMO_SELECTOR --fingerprint-out artifacts/governance/uchirimo-selector-proof-fingerprint.json

      - name: Restore aggregated Uchirimo selector proof cache
        id: uchirimo-proof-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/uchirimo-full-selector-proof
          key: proof-uchirimo-selector-v9-${{ steps.uchirimo-proof-fingerprint.outputs.fingerprint }}

      - name: Bind cached Uchirimo selector proof to current HEAD
        id: cache-decision
        shell: bash
        env:
          CACHE_HIT: ${{ steps.uchirimo-proof-cache.outputs.cache-hit }}
        run: |
          set +e
          reused=false
          if [ "$CACHE_HIT" = "true" ]; then
            node scripts/governance/proof-dependency-fingerprint.mjs --mode bind --family UCHIRIMO_SELECTOR --artifact artifacts/uchirimo-full-selector-proof/report.json --metadata artifacts/uchirimo-full-selector-proof/source-metadata.json --binding artifacts/uchirimo-full-selector-proof/current-head-binding.json
            rc=$?
            if [ "$rc" -eq 0 ]; then
              reused=true
              echo "UCHIRIMO_SELECTOR_PROOF_REUSE=PASS"
            else
              rm -rf artifacts/uchirimo-full-selector-proof
              echo "UCHIRIMO_SELECTOR_PROOF_REUSE=INVALID_RERUN_REQUIRED"
            fi
          else
            echo "UCHIRIMO_SELECTOR_PROOF_REUSE=CACHE_MISS"
          fi
          echo "reused=$reused" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload reused Uchirimo selector proof for current HEAD
        if: ${{ steps.cache-decision.outputs.reused == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: uchirimo-selector-proof-aggregate-${{ env.HEAD_SHA }}
          path: artifacts/uchirimo-full-selector-proof/
          if-no-files-found: error

  uchirimo-qa-preflight:
    needs: ["governance-authority", "governance-precheck", "uchirimo-selector-proof-cache"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && needs.governance-precheck.outputs.authorized == 'true' && needs.uchirimo-selector-proof-cache.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      UCHIRIMO_SELECTOR_MODE: plan-all
      UCHIRIMO_FULL_SELECTOR_OUT: artifacts/uchirimo-qa-preflight-plan
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --ignore-scripts

      - name: QA harness structural self-test
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const workflow=readFileSync('.github/workflows/global-window-selection-flow-gate.yml','utf8');
          const carry=readFileSync('scripts/governance/uchirimo-partition-carry-forward.mjs','utf8');
          const expected=Array.from({length:16},(_,i)=>i);
          const plan=[...workflow.matchAll(/^  uchirimo-selector-proof-plan-(\d+):/gm)].map((m)=>Number(m[1])).sort((a,b)=>a-b);
          const proof=[...workflow.matchAll(/^  uchirimo-selector-proof-(\d+):/gm)].map((m)=>Number(m[1])).sort((a,b)=>a-b);
          if(JSON.stringify(plan)!==JSON.stringify(expected))throw new Error('UCHIRIMO_HARNESS_PLAN_LANES_INVALID:'+JSON.stringify(plan));
          if(JSON.stringify(proof)!==JSON.stringify(expected))throw new Error('UCHIRIMO_HARNESS_EXECUTION_LANES_INVALID:'+JSON.stringify(proof));
          const a0=workflow.indexOf('\n  uchirimo-selector-proof-aggregate:');
          const a1=workflow.indexOf('\n  global-flow:',a0);
          if(a0<0||a1<0)throw new Error('UCHIRIMO_HARNESS_AGGREGATE_BLOCK_MISSING');
          const aggregate=workflow.slice(a0,a1);
          const needsLine=aggregate.split('\n').find((line)=>line.trimStart().startsWith('needs:'))??'';
          const missingNeeds=expected.filter((i)=>!needsLine.includes('"uchirimo-selector-proof-'+i+'"'));
          const missingConditions=expected.filter((i)=>!aggregate.includes("needs.uchirimo-selector-proof-"+i+".result == 'success'"));
          if(missingNeeds.length)throw new Error('UCHIRIMO_HARNESS_AGGREGATE_NEEDS_MISSING:'+missingNeeds.join(','));
          if(missingConditions.length)throw new Error('UCHIRIMO_HARNESS_AGGREGATE_CONDITION_MISSING:'+missingConditions.join(','));
          const exec0=workflow.indexOf('\n  uchirimo-selector-proof-0:');
          const exec1=workflow.indexOf('\n  uchirimo-selector-proof-aggregate:',exec0);
          const execBlock=workflow.slice(exec0,exec1);
          const plan0=workflow.indexOf('\n  uchirimo-selector-proof-plan-0:');
          const plan1=workflow.indexOf('\n  uchirimo-selector-proof-0:',plan0);
          const planBlock=workflow.slice(plan0,plan1);
          if((planBlock.match(/UCHIRIMO_SELECTOR_BATCH_SIZE: 1/g)??[]).length!==16)throw new Error('UCHIRIMO_HARNESS_BATCH_PLAN_COUNT_INVALID');
          if((planBlock.match(/UCHIRIMO_SELECTOR_NORMAL_CHILD_TIMEOUT_MS: 1080000/g)??[]).length!==16)throw new Error('UCHIRIMO_HARNESS_NORMAL_TIMEOUT_POLICY_INVALID');
          if((planBlock.match(/UCHIRIMO_SELECTOR_HEAVY_CHILD_TIMEOUT_MS: 1800000/g)??[]).length!==16)throw new Error('UCHIRIMO_HARNESS_HEAVY_TIMEOUT_POLICY_INVALID');
          if((execBlock.match(/UCHIRIMO_SELECTOR_BATCH_JSON:/g)??[]).length!==16)throw new Error('UCHIRIMO_HARNESS_BATCH_ENV_COUNT_INVALID');
          if((execBlock.match(/UCHIRIMO_SELECTOR_CHILD_TIMEOUT_MS: \$\{\{ matrix\.child_timeout_ms \}\}/g)??[]).length!==16)throw new Error('UCHIRIMO_HARNESS_MATRIX_TIMEOUT_BINDING_INVALID');
          if((execBlock.match(/uchirimo-selector-batch-runner\.mjs/g)??[]).length!==16)throw new Error('UCHIRIMO_HARNESS_BATCH_RUNNER_COUNT_INVALID');
          if(!carry.includes('batch-'))throw new Error('UCHIRIMO_HARNESS_BATCH_CARRY_FORWARD_DISABLED');
          if(carry.includes('head_sha!==HEAD'))throw new Error('UCHIRIMO_HARNESS_SAME_HEAD_RESUME_DISABLED');
          for(const token of ['RUN_ATTEMPT','Number(run.id)===RUN_ID','UCHIRIMO_CARRY_FORWARD_CANDIDATE_RUNS??32']){
            if(!carry.includes(token))throw new Error('UCHIRIMO_HARNESS_RESUME_TOKEN_MISSING:'+token);
          }
          console.log('UCHIRIMO_QA_HARNESS_SELF_TEST=PASS lanes=16 resume=same-head+prior-attempt');
          NODE

      - name: Build complete partition inventory
        run: node scripts/uchirimo-full-selector-proof.mjs

      - name: Collect seed-level resolver and semantic errors without fail-fast
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/uchirimo-qa-preflight
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { resolveRuntimeAppProduct } from './src/catalog/runtime-master/runtime-app-bridge.mjs';
          const plan=JSON.parse(readFileSync('artifacts/uchirimo-qa-preflight-plan/all-partitions.json','utf8'));
          const errors=[];
          const technical=new Set(['legacyConstruction','legacyConfiguration','internal_construction']);
          const stable=(value)=>{
            if(Array.isArray(value))return value.map(stable);
            if(!value||typeof value!=='object')return value;
            return Object.fromEntries(Object.entries(value).sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>[k,stable(v)]));
          };
          const same=(a,b)=>JSON.stringify(stable(a))===JSON.stringify(stable(b)) || String(a)===String(b);
          for(let index=0;index<plan.partitions.length;index+=1){
            const row=plan.partitions[index];
            const seed={room_specification:row.room_specification,window_type:row.window_type,glass_family:row.glass_family};
            if(row.sash_configuration!=='__UNSET__')seed.sash_configuration=row.sash_configuration;
            if(row.size_class!=='__UNSET__')seed.size_class=row.size_class;
            Object.assign(seed,JSON.parse(row.partition_seed_json??'{}'));
            try{
              const result=await resolveRuntimeAppProduct('SER-YKKAP-UCHIRIMO',seed);
              if(!result||!Array.isArray(result.fields)||!result.selection){
                errors.push({shard:row.shard,partition_key:row.partition_key,code:'INVALID_RESOLVER_RESULT'});
                continue;
              }
              for(const [key,value] of Object.entries(seed)){
                if(!same(result.selection?.[key],value))errors.push({shard:row.shard,partition_key:row.partition_key,code:'SEED_REJECTED',field:key});
              }
              const seen=new Set();
              for(const field of result.fields){
                if(!field?.key){errors.push({shard:row.shard,partition_key:row.partition_key,code:'FIELD_KEY_MISSING'});continue;}
                if(seen.has(field.key))errors.push({shard:row.shard,partition_key:row.partition_key,code:'DUPLICATE_FIELD_KEY',field:field.key});
                seen.add(field.key);
                if(technical.has(field.key))errors.push({shard:row.shard,partition_key:row.partition_key,code:'TECHNICAL_FIELD_VISIBLE',field:field.key});
                if(!field.semanticStage||!field.semanticSlot)errors.push({shard:row.shard,partition_key:row.partition_key,code:'UNMAPPED_UI_FIELD',field:field.key});
                if(!field.dataType)errors.push({shard:row.shard,partition_key:row.partition_key,code:'FIELD_DATATYPE_MISSING',field:field.key});
                if(field.required===true && ['ENUM','MULTI_ENUM'].includes(field.dataType)){
                  const enabled=(field.values??[]).filter((v)=>v?.disabled!==true);
                  if(enabled.length===0)errors.push({shard:row.shard,partition_key:row.partition_key,code:'REQUIRED_FIELD_WITHOUT_ENABLED_VALUE',field:field.key});
                }
              }
            }catch(error){
              errors.push({shard:row.shard,partition_key:row.partition_key,code:'RESOLVER_EXCEPTION',message:error?.message??String(error)});
            }
            if((index+1)%250===0)console.log('UCHIRIMO_PREFLIGHT_PROGRESS partitions='+(index+1)+' errors='+errors.length);
          }
          const report={
            schema_version:'1.0.0',
            exact_head:process.env.HEAD_SHA,
            status:errors.length?'FAIL':'PASS',
            partition_count:plan.partitions.length,
            error_count:errors.length,
            errors
          };
          writeFileSync('artifacts/uchirimo-qa-preflight/report.json',JSON.stringify(report,null,2)+'\n');
          console.log('UCHIRIMO_QA_PREFLIGHT='+report.status+' partitions='+report.partition_count+' errors='+report.error_count);
          if(errors.length)process.exit(41);
          NODE

      - name: Upload Uchirimo QA preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uchirimo-qa-preflight-${{ env.HEAD_SHA }}
          path: |
            artifacts/uchirimo-qa-preflight/
            artifacts/uchirimo-qa-preflight-plan/all-partitions.json
          if-no-files-found: error

  uchirimo-selector-proof-carry-forward:
    needs: ["governance-authority", "governance-precheck", "uchirimo-selector-proof-cache", "uchirimo-qa-preflight"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && needs.governance-precheck.outputs.authorized == 'true' && needs.uchirimo-selector-proof-cache.outputs.reused != 'true' && needs.uchirimo-qa-preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      UCHIRIMO_SELECTOR_MODE: plan-all
      UCHIRIMO_FULL_SELECTOR_OUT: artifacts/uchirimo-selector-proof-current-plan
      UCHIRIMO_SELECTOR_CURRENT_PLAN: artifacts/uchirimo-selector-proof-current-plan/all-partitions.json
      UCHIRIMO_SELECTOR_CARRY_FORWARD_OUT: artifacts/uchirimo-selector-proof-carry-forward
    steps:
      - name: Checkout exact HEAD with history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --ignore-scripts

      - name: Build current full Uchirimo partition plan
        run: node scripts/uchirimo-full-selector-proof.mjs

      - name: Revalidate reusable partition proofs against current HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --check scripts/governance/uchirimo-partition-carry-forward.mjs
          node scripts/governance/uchirimo-partition-carry-forward.mjs

      - name: Upload current-head partition carry-forward evidence
        uses: actions/upload-artifact@v4
        with:
          name: uchirimo-selector-proof-carry-forward-${{ env.HEAD_SHA }}
          path: artifacts/uchirimo-selector-proof-carry-forward/
          if-no-files-found: error

  uchirimo-selector-proof-plan-0:
    needs: ["governance-authority", "governance-precheck", "uchirimo-selector-proof-cache", "uchirimo-selector-proof-carry-forward"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && needs.governance-precheck.outputs.authorized == 'true' && needs.uchirimo-selector-proof-cache.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      lane_shard_count: ${{ steps.plan.outputs.lane_shard_count }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      UCHIRIMO_SELECTOR_MODE: plan
      UCHIRIMO_SELECTOR_PLAN_LANE_COUNT: 16
      UCHIRIMO_SELECTOR_PLAN_LANE_INDEX: 0
      UCHIRIMO_SELECTOR_BATCH_SIZE: 1
      UCHIRIMO_SELECTOR_NORMAL_CHILD_TIMEOUT_MS: 1080000
      UCHIRIMO_SELECTOR_HEAVY_CHILD_TIMEOUT_MS: 1800000
      UCHIRIMO_FULL_SELECTOR_OUT: artifacts/uchirimo-selector-proof-plan-0
      UCHIRIMO_SELECTOR_REUSE_MANIFEST: artifacts/uchirimo-selector-proof-carry-forward/manifest.json
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --ignore-scripts
      - name: Download current-head partition carry-forward manifest
        uses: actions/download-artifact@v4
        with:
          name: uchirimo-selector-proof-carry-forward-${{ env.HEAD_SHA }}
          path: artifacts/uchirimo-selector-proof-carry-forward

      - name: Build Uchirimo V8 selector shard matrix lane 0
        id: plan
        run: node scripts/uchirimo-full-selector-proof.mjs
      - name: Upload selector shard plan lane 0
        uses: actions/upload-artifact@v4
        with:
          name: uchirimo-selector-proof-plan-0-${{ env.HEAD_SHA }}
          path: artifacts/uchirimo-selector-proof-plan-0/
          if-no-files-found: error

  uchirimo-selector-proof-plan-1:
    needs: ["governance-authority", "governance-precheck", "uchirimo-selector-proof-cache", "uchirimo-selector-proof-carry-forward"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && needs.governance-precheck.outputs.authorized == 'true' && needs.uchirimo-selector-proof-cache.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      lane_shard_count: ${{ steps.plan.outputs.lane_shard_count }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      UCHIRIMO_SELECTOR_MODE: plan
      UCHIRIMO_SELECTOR_PLAN_LANE_COUNT: 16
      UCHIRIMO_SELECTOR_PLAN_LANE_INDEX: 1
      UCHIRIMO_SELECTOR_BATCH_SIZE: 1
      UCHIRIMO_SELECTOR_NORMAL_CHILD_TIMEOUT_MS: 1080000
      UCHIRIMO_SELECTOR_HEAVY_CHILD_TIMEOUT_MS: 1800000
      UCHIRIMO_FULL_SELECTOR_OUT: artifacts/uchirimo-selector-proof-plan-1
      UCHIRIMO_SELECTOR_REUSE_MANIFEST: artifacts/uchirimo-selector-proof-carry-forward/manifest.json
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --ignore-scripts
      - name: Download current-head partition carry-forward manifest
        uses: actions/download-artifact@v4
        with:
          name: uchirimo-selector-proof-carry-forward-${{ env.HEAD_SHA }}
          path: artifacts/uchirimo-selector-proof-carry-forward

      - name: Build Uchirimo V8 selector shard matrix lane 1
        id: plan
        run: node scripts/uchirimo-full-selector-proof.mjs
      - name: Upload selector shard plan lane 1
        uses: actions/upload-artifact@v4
        with:
          name: uchirimo-selector-proof-plan-1-${{ env.HEAD_SHA }}
          path: artifacts/uchirimo-selector-proof-plan-1/
          if-no-files-found: error

  uchirimo-selector-proof-plan-2:
    needs: ["governance-authority", "governance-precheck", "uchirimo-selector-proof-cache", "uchirimo-selector-proof-carry-forward"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && needs.governance-precheck.outputs.authorized == 'true' && needs.uchirimo-selector-proof-cache.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      lane_shard_count: ${{ steps.plan.outputs.lane_shard_count }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      UCHIRIMO_SELECTOR_MODE: plan
      UCHIRIMO_SELECTOR_PLAN_LANE_COUNT: 16
      UCHIRIMO_SELECTOR_PLAN_LANE_INDEX: 2
      UCHIRIMO_SELECTOR_BATCH_SIZE: 1
      UCHIRIMO_SELECTOR_NORMAL_CHILD_TIMEOUT_MS: 1080000
      UCHIRIMO_SELECTOR_HEAVY_CHILD_TIMEOUT_MS: 1800000
      UCHIRIMO_FULL_SELECTOR_OUT: artifacts/uchirimo-selector-proof-plan-2
      UCHIRIMO_SELECTOR_REUSE_MANIFEST: artifacts/uchirimo-selector-proof-carry-forward/manifest.json
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --ignore-scripts
      - name: Download current-head partition carry-forward manifest
        uses: actions/download-artifact@v4
        with:
          name: uchirimo-selector-proof-carry-forward-${{ env.HEAD_SHA }}
          path: artifacts/uchirimo-selector-proof-carry-forward

      - name: Build Uchirimo V8 selector shard matrix lane 2
        id: plan
        run: node scripts/uchirimo-full-selector-proof.mjs
      - name: Upload selector shard plan lane 2
        uses: actions/upload-artifact@v4
        with:
          name: uchirimo-selector-proof-plan-2-${{ env.HEAD_SHA }}
          path: artifacts/uchirimo-selector-proof-plan-2/
          if-no-files-found: error

  uchirimo-selector-proof-plan-3:
    needs: ["governance-authority", "governance-precheck", "uchirimo-selector-proof-cache", "uchirimo-selector-proof-carry-forward"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && needs.governance-precheck.outputs.authorized == 'true' && needs.uchirimo-selector-proof-cache.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      lane_shard_count: ${{ steps.plan.outputs.lane_shard_count }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      UCHIRIMO_SELECTOR_MODE: plan
      UCHIRIMO_SELECTOR_PLAN_LANE_COUNT: 16
      UCHIRIMO_SELECTOR_PLAN_LANE_INDEX: 3
      UCHIRIMO_SELECTOR_BATCH_SIZE: 1
      UCHIRIMO_SELECTOR_NORMAL_CHILD_TIMEOUT_MS: 1080000
