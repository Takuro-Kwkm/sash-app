name: Global Window Selection Flow Gate

on:
  push:
    branches:
      - feat/new-construction-runtime-ui-v16-20260910
    paths:
      - '.github/workflows/global-window-selection-flow-gate.yml'
      - 'src/catalog/runtime-master/**'
      - 'src/ui/web/**'
      - 'scripts/global-window-flow-*.mjs'
      - 'test/**'
      - 'package.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/global-window-selection-flow-gate.yml'
      - 'src/catalog/runtime-master/**'
      - 'src/ui/web/**'
      - 'scripts/global-window-flow-*.mjs'
      - 'test/**'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: global-window-selection-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  global-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --ignore-scripts

      - name: Global flow syntax and source gates
        shell: bash
        run: |
          set -euo pipefail
          node --check src/catalog/runtime-master/canonical-window-semantic-schema.mjs
          node --check src/catalog/runtime-master/global-window-selection-flow-engine.mjs
          node --check src/catalog/runtime-master/new-construction-sash-runtime-ui-contract.mjs
          node --check src/catalog/runtime-master/inner-window-runtime-ui-contract.mjs
          node --check src/catalog/runtime-master/runtime-app-bridge.mjs
          node --check scripts/global-window-flow-field-inventory.mjs
          node --check test/79-global-window-selection-flow.test.mjs
          node --check test/80-canonical-window-semantic-schema.test.mjs
          if grep -REn "other:\$\{String\(key\)|other:" src/catalog/runtime-master/new-construction-sash-runtime-ui-contract.mjs src/catalog/runtime-master/inner-window-runtime-ui-contract.mjs; then
            echo 'FLOW_SCHEMA_UNMAPPED_FIELD_GATE=FAIL legacy other:* fallback remains'
            exit 31
          fi
          if grep -REn "if[[:space:]]*\([^)]*(series|manufacturer|productId)[[:space:]]*={2,3}" src/catalog/runtime-master/global-window-selection-flow-engine.mjs src/catalog/runtime-master/canonical-window-semantic-schema.mjs; then
            echo 'SERIES_OVERRIDE_ELIMINATION_GATE=FAIL'
            exit 32
          fi
          echo 'SINGLE_FLOW_ENGINE_GATE=PASS_CODE'
          echo 'SERIES_OVERRIDE_ELIMINATION_GATE=PASS_CODE'

      - name: Runtime source lint and UI contract typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Global flow unit gate
        run: node --test test/79-global-window-selection-flow.test.mjs test/80-canonical-window-semantic-schema.test.mjs

      - name: Full Runtime field inventory
        run: node scripts/global-window-flow-field-inventory.mjs

      - name: Legacy core regression partition
        run: node --test test/01-core.test.mjs test/02-lr.test.mjs test/03-features.test.mjs test/04-thermosl.test.mjs test/61-vercel-route-contract.test.mjs

      - name: Runtime package regression partition
        run: node --test test/70-runtime-manifest-ew-integration.test.mjs test/70-runtime-manifest-tw-integration.test.mjs test/71-vercel-adapter.test.mjs

      - name: TW UI regression partition
        run: node --test test/71-runtime-ui-tw-gate.test.mjs

      - name: Uchirimo UI regression partition
        run: node --test test/72-runtime-manifest-uchirimo-integration.test.mjs test/73-runtime-ui-uchirimo-gate.test.mjs

      - name: New-construction UI regression partition
        run: node --test test/74-new-construction-ui-v16.test.mjs test/75-stage-a-size-display-full-coverage.test.mjs test/76-custom-dimension-safety.test.mjs

      - name: App integration regression partition
        run: node --test test/72-work-management.test.mjs test/74-estimate-output.test.mjs test/75-formal-runtime-resync.test.mjs

      - name: Full repository regression tests
        run: npm test

      - name: Runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run start:qa > /tmp/sash-global-flow.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/api/health > /tmp/health.json; then break; fi
            sleep 0.5
          done
          cat /tmp/health.json
          node -e 'const h=require("/tmp/health.json"); if(!h.ok) process.exit(1); const ids=new Set(h.runtimeMasterIntegrations.map(x=>x.id)); const expected=["SER-LIX-EW","SER-LIX-SAMOS2H","SER-LIX-SAMOSL","SER-LIXIL-TW","SER-LIXIL-INPLUS","SER-YKK-APW430","SER-YKK-APW431","SER-YKKAP-UCHIRIMO"]; if(expected.some(id=>!ids.has(id))) process.exit(1)'
          echo 'WINDOW_FLOW_BASELINE_GATE=PASS_RUNTIME_SMOKE'
          echo 'CANONICAL_SLOT_SCHEMA_GATE=PASS_UNIT_SCHEMA_ONLY'
          echo 'FLOW_SCHEMA_UNMAPPED_FIELD_GATE=PASS_INITIAL_RESOLUTION_ONLY'

      - name: Install browser QA dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Desktop and smartphone runtime browser regression
        shell: bash
        run: |
          set -euo pipefail
          npm run start:qa > /tmp/sash-global-flow-browser.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 0.5
          done
          node test/browser/ew-runtime-browser-qa.mjs
          node test/browser/tw-runtime-browser-qa.mjs
          node test/browser/uchirimo-runtime-browser-qa.mjs
          node test/browser/formal-runtime-resync-browser-qa.mjs
          node test/browser/release-regression-browser-qa.mjs
          echo 'FULL_BROWSER_FLOW_QA_GATE=PARTIAL_EXISTING_REGRESSION_SET_ONLY'

      - name: Gate summary
        run: |
          echo 'GLOBAL_WINDOW_SELECTION_FLOW_FOUNDATION_CODE_GATE=PASS'
          echo 'FLOW_REGRESSION_GATE=PASS_EXISTING_SET'
          echo 'GLOBAL_WINDOW_SELECTION_FLOW_READY=FALSE'
          echo 'REMAINING=FULL_FLOW_SIGNATURE_COVERAGE,FLOW_TRANSITION,FULL_BROWSER_FLOW_QA'
          echo 'APP_INTEGRATION_READY=FALSE'
          echo 'RELEASE_INPUT_GATE=BLOCKED'
