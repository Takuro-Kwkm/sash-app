      STAGE_A_CUSTOM_GEOMETRY_EQ_INPUT: artifacts/stage-a-custom-runtime-geometry-equivalence/report.json
      STAGE_A_CUSTOM_TRANSITION_OUT: artifacts/stage-a-custom-transition-proof-v4
      STAGE_A_REACHABILITY_REPORT: artifacts/stage-a-custom-selector-reachability/report.json
      STAGE_A_TRANSITION_REPORT: artifacts/stage-a-custom-transition-proof-v4/report.json
      STAGE_A_FULL_BROWSER_OUT: artifacts/stage-a-full-browser-qa
      POST_HUMAN_EVIDENCE_OUT: artifacts/governance/post-human
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --ignore-scripts

      - name: Restore aggregated Uchirimo selector proof
        uses: actions/download-artifact@v4
        with:
          name: uchirimo-selector-proof-aggregate-${{ env.HEAD_SHA }}
          path: artifacts/uchirimo-full-selector-proof

      - name: Verify restored Uchirimo selector proof
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report=JSON.parse(readFileSync('artifacts/uchirimo-full-selector-proof/report.json','utf8'));
          if(report.exact_head!==process.env.HEAD_SHA||report.status!=='PASS'||report.product_node_count<=0||report.shard_count<report.product_node_count||report.window_type_count!==4||report.unverified_discrete_selector_case_count!==0)throw new Error('UCHIRIMO_SHARDED_PROOF_RESTORE_INVALID');
          console.log('UCHIRIMO_FULL_SELECTOR_PROOF=PASS_RESTORED_SHARDED');
          NODE

      - name: Global flow syntax and source gates
        shell: bash
        run: |
          set -euo pipefail
          node --check src/catalog/runtime-master/canonical-window-semantic-schema.mjs
          node --check src/catalog/runtime-master/global-window-selection-flow-engine.mjs
          node --check src/catalog/runtime-master/new-construction-sash-runtime-ui-contract.mjs
          node --check src/catalog/runtime-master/inner-window-runtime-ui-contract.mjs
          node --check src/catalog/runtime-master/formal-product-runtime-v2-loader.mjs
          node --check src/catalog/runtime-master/runtime-app-bridge.mjs
          node --check scripts/global-window-flow-field-inventory.mjs
          node --check test/79-global-window-selection-flow.test.mjs
          node --check test/80-canonical-window-semantic-schema.test.mjs
          node --check test/81-global-window-flow-signature-transition.test.mjs
          node --check test/browser/global-window-selection-flow-browser-qa.mjs
          node --check test/browser/inplus-v04r2-global-flow-full-coverage-browser-qa.mjs
          node --check scripts/uchirimo-full-selector-proof.mjs
          node --check scripts/governance/uchirimo-selector-batch-runner.mjs
          node --check scripts/governance/proof-dependency-fingerprint.mjs
          if grep -REn "other:\$\{String\(key\)|other:" src/catalog/runtime-master/new-construction-sash-runtime-ui-contract.mjs src/catalog/runtime-master/inner-window-runtime-ui-contract.mjs; then
            echo 'FLOW_SCHEMA_UNMAPPED_FIELD_GATE=FAIL legacy other:* fallback remains'
            exit 31
          fi
          if grep -REn "if[[:space:]]*\([^)]*(series|manufacturer|productId)[[:space:]]*={2,3}" src/catalog/runtime-master/global-window-selection-flow-engine.mjs src/catalog/runtime-master/canonical-window-semantic-schema.mjs; then
            echo 'SERIES_OVERRIDE_ELIMINATION_GATE=FAIL'
            exit 32
          fi
          echo 'SINGLE_FLOW_ENGINE_GATE=PASS_CODE'
          echo 'SERIES_OVERRIDE_ELIMINATION_GATE=PASS_CODE'

      - name: Runtime source lint and UI contract typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Global flow unit and signature-transition gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$POST_HUMAN_EVIDENCE_OUT"
          node --test test/79-global-window-selection-flow.test.mjs test/80-canonical-window-semantic-schema.test.mjs test/81-global-window-flow-signature-transition.test.mjs 2>&1 | tee "$POST_HUMAN_EVIDENCE_OUT/global-flow-unit.tap"
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          mkdirSync(process.env.POST_HUMAN_EVIDENCE_OUT,{recursive:true});
          writeFileSync(process.env.POST_HUMAN_EVIDENCE_OUT+'/global-flow-unit.json',JSON.stringify({
            exact_head:process.env.HEAD_SHA,
            status:'PASS',
            gates:['FULL_FLOW_SIGNATURE_COVERAGE_GATE','FLOW_TRANSITION_GATE'],
            command:'node --test test/79-global-window-selection-flow.test.mjs test/80-canonical-window-semantic-schema.test.mjs test/81-global-window-flow-signature-transition.test.mjs'
          },null,2)+'\n');
          NODE
          echo 'CANONICAL_SLOT_SCHEMA_GATE=PASS'
          echo 'FULL_FLOW_SIGNATURE_COVERAGE_GATE=PASS_PAIRWISE_WINDOW_USER_FACING_FIELD_UNIVERSES'
          echo 'FLOW_TRANSITION_GATE=PASS_WINDOW_RESOLVER_TRANSITIONS'

      - name: Current-head full CUSTOM geometry and transition proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          node scripts/stage-a-custom-dimension-source-shape-diagnostic.mjs
          node scripts/stage-a-formal-split-custom-guard-shape-diagnostic.mjs
          node scripts/stage-a-custom-dimension-boundary-partition-proof-v2.mjs
          node scripts/stage-a-custom-selector-reachability-v4.mjs
          node scripts/stage-a-custom-runtime-geometry-equivalence-v4.mjs
          CUSTOM_GEOMETRY_EVIDENCE_HEAD="$HEAD_SHA" node scripts/stage-a-custom-transition-proof-v4.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const read=(path)=>JSON.parse(readFileSync(path,'utf8'));
          const shape=read(process.env.STAGE_A_CUSTOM_SHAPE_INPUT);
          const reach=read(process.env.STAGE_A_CUSTOM_REACHABILITY_INPUT);
          const geometry=read(process.env.STAGE_A_CUSTOM_GEOMETRY_EQ_INPUT);
          const transition=read(`${process.env.STAGE_A_CUSTOM_TRANSITION_OUT}/report.json`);
          for(const row of [shape,reach,geometry,transition])if(row.exact_head_sha!==process.env.HEAD_SHA)throw new Error('CUSTOM_EXACT_HEAD_MISMATCH');
          if(shape.total_custom_rule_count!==152||shape.unsupported_count!==0)throw new Error('CUSTOM_SOURCE_SHAPE_INVALID');
          if(reach.source_rule_count!==152||reach.unique_context_count!==137||reach.unreachable_context_count!==0||reach.status!=='PASS')throw new Error('CUSTOM_REACHABILITY_INVALID');
          if(geometry.source_rule_count!==152||geometry.window_count!==92||geometry.selector_context_count!==137||geometry.mismatch_count!==0||geometry.status!=='PASS')throw new Error('CUSTOM_GEOMETRY_INVALID');
          if(transition.selector_context_count!==137||transition.evaluation_count!==1081||transition.status!=='PASS'||transition.gate_status?.custom_size_coverage_gate!=='PASS')throw new Error('CUSTOM_TRANSITION_INVALID');
          console.log('CUSTOM_SIZE_COVERAGE_GATE=PASS');
          console.log('UNVERIFIED_CUSTOM_QA_CASE_COUNT=0');
          NODE

