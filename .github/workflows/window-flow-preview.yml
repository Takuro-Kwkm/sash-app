name: Window Flow Preview Deployment
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact reviewed candidate; superseded candidates are rejected'
        required: true
        type: string
      review_reference:
        description: 'Fixed preview scope or review reference'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: window-flow-preview-${{ inputs.expected_sha }}
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: team_AkuHacuJlCl8LuvaFpCzFmbv
      VERCEL_PROJECT_ID: prj_4z0zqW6yKyPuFINODfGX8LPBuJRP
      VERCEL_PROJECT_NAME: sash-app-wave3-preview
      RELEASE_SERIES: EIGHT_WINDOW_FLOW_COMPLIANCE
      RELEASE_PACKAGE_VERSION: integration-preview
      VERCEL_DEPLOY_SOURCE: gitSource
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Exact current candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REVIEW_REFERENCE: ${{ inputs.review_reference }}
        run: |
          set -euo pipefail
          test -n "$REVIEW_REFERENCE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          echo "GITHUB_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
          echo 'GITHUB_REF_NAME=main' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare deployment credential
        env:
          VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
        run: |
          token="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          if [[ -z "$token" ]]; then echo 'VERCEL_CREDENTIAL_GATE=BLOCKED'; exit 42; fi
          echo "VERCEL_TOKEN_EFFECTIVE=$token" >> "$GITHUB_ENV"
      - run: node scripts/vercel-rest-deploy.mjs preview artifacts/window-flow-compliance/deployment.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-flow-preview-${{ github.sha }}
          path: artifacts/window-flow-compliance/
          retention-days: 14
