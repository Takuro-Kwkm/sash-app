name: Stage A EW Free Powerset Exact Pilot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage-a-ew-free-powerset-exact-pilot.yml'
      - 'scripts/stage-a-ew-free-powerset-exact-runner.mjs'
      - 'scripts/stage-a-terminal-multi-enum-proof-pilot.mjs'
      - 'src/catalog/runtime-master/canonical-workbook-reference-v1-adapter.mjs'
      - 'src/catalog/runtime-master/canonical-workbook-reference-v1-model.mjs'
      - 'src/catalog/runtime-master/runtime-master-registry.mjs'
      - 'src/catalog/runtime-master/runtime-app-bridge.mjs'
      - 'src/catalog/runtime-master-packages/lixil-ew-v1.1/**'

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: WT-EW-HIKICHIGAI
            role: control
            expected_terminal: '3140812800'
          - target: WT-EW-KOSHO-YOKO
            role: candidate
            expected_terminal: ''
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      STAGE_A_TARGET_WINDOW: ${{ matrix.target }}
      STAGE_A_TERMINAL_MULTI_OUT: artifacts/stage-a-ew-free-powerset-${{ matrix.target }}
      STAGE_A_MAX_MEMO_STATES_PER_WINDOW: '12000'
      STAGE_A_MAX_RESOLVER_CALLS_PER_WINDOW: '100000'
      STAGE_A_MAX_EXPLICIT_MULTI_ENUM_VALUES: '12'
      STAGE_A_MAX_TERMINAL_BFS_SUBSETS: '4096'
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact SHA gate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA"
          echo "EXACT_HEAD_GATE=PASS sha=$actual"
      - name: Run EW source-shape audited free powerset exact count
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-a-ew-free-powerset-exact-runner.mjs
      - name: Validate per-window exact evidence
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          EXPECTED_ROLE: ${{ matrix.role }}
          EXPECTED_TERMINAL: ${{ matrix.expected_terminal }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const path=`artifacts/stage-a-ew-free-powerset-${process.env.EXPECTED_TARGET}/report.json`;
          const report=JSON.parse(readFileSync(path,'utf8'));
          if(report.exact_head_sha!==process.env.HEAD_SHA)throw new Error('exact head mismatch');
          if(report.series!=='EW'||report.window_type!==process.env.EXPECTED_TARGET)throw new Error('wrong EW target');
          if(report.status!=='COUNTED_CANDIDATE'||report.blocker)throw new Error(`EW exact count blocked: ${JSON.stringify(report.blocker)}`);
          if(!report.exact_discrete_terminal_context_count)throw new Error('missing terminal count');
          if(process.env.EXPECTED_TERMINAL&&report.exact_discrete_terminal_context_count!==process.env.EXPECTED_TERMINAL)throw new Error(`control exact mismatch ${report.exact_discrete_terminal_context_count}`);
          if(!report.base_runner_sha256)throw new Error('base runner digest missing');
          const proofs=report.terminal_multi_proofs??[];
          if(!proofs.length)throw new Error('terminal proof missing');
          for(const proof of proofs){
            if(proof.proof_type!=='SOURCE_SHAPE_AUDITED_FREE_POWERSET')throw new Error(`unexpected proof type ${proof.proof_type}`);
            if(!(Number(proof.candidate_count)>0))throw new Error('invalid candidate count');
            if(proof.all_options_witness!==true||proof.empty_option_witness!==true)throw new Error('resolver witness missing');
            if(!proof.source_shape_digest)throw new Error('source shape digest missing');
          }
          console.log(`EW_FREE_POWERSET_WINDOW_GATE=PASS role=${process.env.EXPECTED_ROLE} window=${report.window_type} terminal=${report.exact_discrete_terminal_context_count} custom=${report.custom_pending_context_count}`);
          console.log(`TERMINAL_PROOF_CONTEXTS=${proofs.length}`);
          console.log(`RESOLVER_CALL_COUNT=${report.resolver_call_count}`);
          console.log('APP_INTEGRATION_READY=false');
          console.log('RELEASE_INPUT_GATE=BLOCKED');
          NODE
      - name: Upload per-window evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-ew-free-powerset-${{ matrix.target }}
          path: artifacts/stage-a-ew-free-powerset-${{ matrix.target }}/report.json
          if-no-files-found: error

  aggregate:
    needs: count
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage-a-ew-free-powerset-*
          path: artifacts/collected
          merge-multiple: false
      - name: Aggregate two EW exact proofs
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readdirSync,readFileSync,statSync,mkdirSync,writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const files=[];
          const walk=(dir)=>{for(const name of readdirSync(dir)){const p=join(dir,name);if(statSync(p).isDirectory())walk(p);else if(name==='report.json')files.push(p);}};
          walk('artifacts/collected');
          const rows=files.map((p)=>JSON.parse(readFileSync(p,'utf8'))).sort((a,b)=>a.window_type.localeCompare(b.window_type));
          if(rows.length!==2)throw new Error(`expected 2 EW reports, got ${rows.length}`);
          if(new Set(rows.map((r)=>r.window_type)).size!==2)throw new Error('duplicate EW report');
          for(const row of rows){if(row.exact_head_sha!==process.env.HEAD_SHA||row.status!=='COUNTED_CANDIDATE'||row.blocker)throw new Error(`invalid EW evidence ${row.window_type}`);}
          const control=rows.find((r)=>r.window_type==='WT-EW-HIKICHIGAI');
          const candidate=rows.find((r)=>r.window_type==='WT-EW-KOSHO-YOKO');
          if(!control||!candidate)throw new Error('EW target report missing');
          if(control.exact_discrete_terminal_context_count!=='3140812800')throw new Error('EW control mismatch');
          const terminal=rows.reduce((sum,row)=>sum+BigInt(row.exact_discrete_terminal_context_count),0n);
          const custom=rows.reduce((sum,row)=>sum+BigInt(row.custom_pending_context_count??'0'),0n);
          const evidenceDigest=createHash('sha256').update(JSON.stringify(rows.map((r)=>({window:r.window_type,terminal:r.exact_discrete_terminal_context_count,custom:r.custom_pending_context_count,base:r.base_runner_sha256,proofs:(r.terminal_multi_proofs??[]).map((p)=>({type:p.proof_type,count:p.candidate_count,digest:p.source_shape_digest}))})))).digest('hex');
          const out={exact_head_sha:process.env.HEAD_SHA,task_classification:'NON-PRODUCT-MASTER',product_master_mutation:0,manufacturer:'LIXIL',series:'EW',target_window_count:2,verified_window_count:2,unverified_window_count:0,control_window:'WT-EW-HIKICHIGAI',control_exact_discrete_terminal_context_count:control.exact_discrete_terminal_context_count,candidate_window:'WT-EW-KOSHO-YOKO',candidate_exact_discrete_terminal_context_count:candidate.exact_discrete_terminal_context_count,total_exact_discrete_terminal_context_count:terminal.toString(),total_custom_pending_context_count:custom.toString(),proof_type:'SOURCE_SHAPE_AUDITED_FREE_POWERSET',evidence_digest:evidenceDigest,status:'EW_TWO_BLOCKER_WINDOWS_EXACT_PASS',gate_status:{ew_discrete_population_gate:'PARTIAL_PASS_TWO_PREVIOUS_BLOCKERS_RESOLVED',nontw_discrete_population_gate:'BLOCKED_PENDING_APW430_3_WINDOWS',custom_size_coverage_gate:'BLOCKED_CONTINUOUS_PARTITION_NOT_PROVEN',full_browser_qa_gate:'NOT_STARTED',app_integration_ready:false,release_input_gate:'BLOCKED'},windows:rows};
          mkdirSync('artifacts/stage-a-ew-free-powerset-summary',{recursive:true});
          writeFileSync('artifacts/stage-a-ew-free-powerset-summary/report.json',JSON.stringify(out,null,2)+'\n');
          console.log(`EW_FREE_POWERSET_AGGREGATE_STATUS=${out.status}`);
          console.log(`EW_CONTROL_TERMINAL=${out.control_exact_discrete_terminal_context_count}`);
          console.log(`EW_KOSHO_YOKO_TERMINAL=${out.candidate_exact_discrete_terminal_context_count}`);
          console.log(`EW_TWO_WINDOW_TERMINAL_TOTAL=${out.total_exact_discrete_terminal_context_count}`);
          console.log(`EW_TWO_WINDOW_CUSTOM_PENDING_TOTAL=${out.total_custom_pending_context_count}`);
          console.log(`EVIDENCE_DIGEST=${out.evidence_digest}`);
          console.log('APP_INTEGRATION_READY=false');
          console.log('RELEASE_INPUT_GATE=BLOCKED');
          NODE
      - name: Upload EW aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-ew-free-powerset-summary
          path: artifacts/stage-a-ew-free-powerset-summary/report.json
          if-no-files-found: error
