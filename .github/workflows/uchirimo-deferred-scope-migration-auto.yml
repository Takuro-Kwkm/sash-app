name: One-shot Uchirimo Deferred Scope Auto Migration

on:
  push:
    branches:
      - feat/new-construction-runtime-ui-v16-20260910

permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: one-shot-uchirimo-deferred-scope-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: feat/new-construction-runtime-ui-v16-20260910
      BASELINE_HEAD: 80178b357fa05c3557b293e18bb2ef457aab4bc9
    steps:
      - name: Checkout exact triggering HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify execution identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${{ github.ref_name }}" = "$BRANCH"

      - name: Apply corrected deferred-scope migration
        run: python scripts/governance/tmp-apply-uchirimo-deferred-scope.py

      - name: Install YAML validator
        run: python -m pip install PyYAML==6.0.2

      - name: Static validation before cleanup
        run: |
          set -euo pipefail
          python -m json.tool project-governance/release-scope.json >/dev/null
          python -m json.tool project-governance/workflow-authority-policy.json >/dev/null
          node --check scripts/governance/generate-human-flow-review.mjs
          node --check scripts/governance/verify-human-flow-field-coverage.mjs
          node --check scripts/governance/emit-global-flow-evidence.mjs
          node --check scripts/governance/finalize-post-human-evidence.mjs
          node --check scripts/governance/uchirimo-heavy-partition-analysis.mjs
          python - <<'PY'
          import yaml
          for p in [
              '.github/workflows/project-governance-gate.yml',
              '.github/workflows/global-window-selection-flow-gate.yml',
          ]:
              yaml.safe_load(open(p))
          print('YAML_VALIDATION=PASS')
          PY

      - name: Remove temporary independent execution plumbing
        run: |
          set -euo pipefail
          git rm -f .github/workflows/uchirimo-deferred-scope-migration.yml .github/workflows/uchirimo-deferred-scope-migration-auto.yml .github/workflows/uchirimo-deferred-heavy-analysis.yml scripts/governance/tmp-apply-uchirimo-deferred-scope.py

      - name: Verify governance authority after cleanup
        run: |
          set -euo pipefail
          python scripts/governance/verify-workflow-authority.py

      - name: Enforce requested diff scope
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          allowed={
            '.github/workflows/global-window-selection-flow-gate.yml',
            '.github/workflows/project-governance-gate.yml',
            'project-governance/gate-definition.json',
            'project-governance/release-scope.json',
            'project-governance/workflow-authority-policy.json',
            'scripts/governance/emit-global-flow-evidence.mjs',
            'scripts/governance/finalize-post-human-evidence.mjs',
            'scripts/governance/generate-human-flow-review.mjs',
            'scripts/governance/uchirimo-heavy-partition-analysis.mjs',
            'scripts/governance/verify-human-flow-field-coverage.mjs',
            'test/browser/global-window-selection-flow-browser-qa.mjs'
          }
          baseline=os.environ['BASELINE_HEAD']
          changed=set(subprocess.check_output(['git','diff','--name-only',baseline],text=True).split())
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit('UNREQUESTED_DIFF:'+','.join(sorted(unexpected)))
          required={
            'project-governance/release-scope.json',
            'project-governance/workflow-authority-policy.json',
            'scripts/governance/uchirimo-heavy-partition-analysis.mjs',
            '.github/workflows/project-governance-gate.yml',
            '.github/workflows/global-window-selection-flow-gate.yml'
          }
          missing=required-changed
          if missing:
              raise SystemExit('REQUESTED_DIFF_MISSING:'+','.join(sorted(missing)))
          print('REQUESTED_DIFF_COVERAGE=PASS')
          print('UNREQUESTED_DIFF_COUNT=0')
          print('CHANGED_FILES='+';'.join(sorted(changed)))
          PY

      - name: Commit and push final migration
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'qa: defer Uchirimo and reopen release-scope review'
          NEW_HEAD=$(git rev-parse HEAD)
          git push origin HEAD:"$BRANCH"
          echo "MIGRATION_HEAD=$NEW_HEAD"
