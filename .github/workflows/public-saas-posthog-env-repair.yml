name: Public SaaS PostHog Env Repair

on:
  push:
    branches: [feat/public-saas-foundation-a1]
    paths:
      - '.github/workflows/public-saas-posthog-env-repair.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_AkuHacuJlCl8LuvaFpCzFmbv
      VERCEL_PROJECT_ID: prj_4z0zqW6yKyPuFINODfGX8LPBuJRP
      PUBLIC_SAAS_HEAD_REF: feat/public-saas-foundation-a1
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
    steps:
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          test -n "$token"
          test -n "${POSTHOG_PROJECT_TOKEN:-}"
          echo "VERCEL_TOKEN_EFFECTIVE=$token" >> "$GITHUB_ENV"
          echo "POSTHOG_SECRET_INPUT_GATE=PASS"

      - name: Inspect matching Preview variable metadata
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/vercel-env-list.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID")"
          test "$status" = "200"
          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('/tmp/vercel-env-list.json','utf8'));
          const envs=Array.isArray(p?.envs)?p.envs:[];
          const branch=process.env.PUBLIC_SAAS_HEAD_REF;
          const matches=envs.filter((e)=>e?.key==='POSTHOG_PROJECT_TOKEN' && Array.isArray(e?.target) && e.target.includes('preview'));
          const exact=matches.find((e)=>String(e?.gitBranch??'')===branch)??null;
          const safe=matches.map((e)=>({id:e.id,key:e.key,type:e.type,target:e.target,gitBranch:e.gitBranch??null}));
          console.log(`POSTHOG_PREVIEW_METADATA=${JSON.stringify(safe)}`);
          if(exact){
            fs.appendFileSync(process.env.GITHUB_ENV,`POSTHOG_EXISTING_ENV_ID=${exact.id}\nPOSTHOG_EXISTING_ENV_TYPE=${exact.type||''}\n`);
            console.log('POSTHOG_BRANCH_PREVIEW_EXISTING=YES');
          }else{
            console.log('POSTHOG_BRANCH_PREVIEW_EXISTING=NO');
          }
          NODE
          rm -f /tmp/vercel-env-list.json

      - name: Configure branch Preview token
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const body={
            key:'POSTHOG_PROJECT_TOKEN',
            value:process.env.POSTHOG_PROJECT_TOKEN,
            type:'sensitive',
            target:['preview'],
            gitBranch:process.env.PUBLIC_SAAS_HEAD_REF,
            comment:'Public SaaS S7 sanitized browser exception monitoring',
          };
          fs.writeFileSync('/tmp/posthog-env-body.json',JSON.stringify(body));
          NODE

          if [[ -n "${POSTHOG_EXISTING_ENV_ID:-}" ]]; then
            endpoint="https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$POSTHOG_EXISTING_ENV_ID?teamId=$VERCEL_ORG_ID"
            method=PATCH
          else
            endpoint="https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID"
            method=POST
          fi

          status="$(curl -sS -o /tmp/posthog-env-response.json -w '%{http_code}' \
            -X "$method" \
            -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/posthog-env-body.json \
            "$endpoint")"
          rm -f /tmp/posthog-env-body.json

          if [[ "$status" != "200" && "$status" != "201" ]]; then
            STATUS="$status" node <<'NODE'
            const fs=require('node:fs');
            let p={};
            try{p=JSON.parse(fs.readFileSync('/tmp/posthog-env-response.json','utf8'));}catch{}
            const e=p?.error??p??{};
            const secret=String(process.env.POSTHOG_PROJECT_TOKEN??'');
            const sanitize=(v)=>String(v??'unknown').replaceAll(secret,'[REDACTED]').replace(/phc_[A-Za-z0-9_-]+/g,'[REDACTED]');
            console.error(`POSTHOG_PREVIEW_CONFIG_GATE=BLOCKED_VERCEL_ENV_API status=${process.env.STATUS} code=${sanitize(e.code)} message=${sanitize(e.message)}`);
            NODE
            rm -f /tmp/posthog-env-response.json
            exit 45
          fi

          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('/tmp/posthog-env-response.json','utf8'));
          const created=p?.created??p;
          const safe={id:created?.id??null,key:created?.key??'POSTHOG_PROJECT_TOKEN',type:created?.type??'sensitive',target:created?.target??['preview'],gitBranch:created?.gitBranch??process.env.PUBLIC_SAAS_HEAD_REF};
          console.log(`POSTHOG_PREVIEW_CONFIG_GATE=PASS metadata=${JSON.stringify(safe)}`);
          NODE
          rm -f /tmp/posthog-env-response.json
