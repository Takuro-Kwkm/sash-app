name: Antigravity Self-Hosted Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [feat/catalog-recovery-v2]
    paths:
      - .github/workflows/antigravity-self-hosted-smoke.yml

concurrency:
  group: antigravity-self-hosted-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify Antigravity Google AI Pro worker
    runs-on: [self-hosted, macOS, ARM64, gemini-worker]
    timeout-minutes: 5
    env:
      PATH: /Users/takuro/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Verify runner and Antigravity CLI
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_user=$(id -un)"
          echo "home=${HOME}"
          command -v agy
          agy --version
          file "$(command -v agy)"

      - name: Diagnose keychain access without exposing credentials
        shell: bash
        run: |
          set -u
          echo '--- keychain diagnostics (no secret output) ---'
          if /usr/bin/security find-generic-password -s gemini -a antigravity >/dev/null 2>&1; then
            echo 'keychain_item_lookup=PASS'
          else
            echo 'keychain_item_lookup=FAIL'
          fi
          if /usr/bin/security find-generic-password -s gemini -a antigravity -w >/dev/null 2>&1; then
            echo 'keychain_secret_read=PASS'
          else
            echo 'keychain_secret_read=FAIL'
          fi
          if /usr/bin/security show-keychain-info "$HOME/Library/Keychains/login.keychain-db" >/dev/null 2>&1; then
            echo 'login_keychain_info=PASS'
          else
            echo 'login_keychain_info=FAIL'
          fi

      - name: Verify headless Google AI Pro session
        shell: bash
        run: |
          set -euo pipefail
          agy -p "Return exactly: ANTIGRAVITY_RUNNER_OK" --output-format json | tee antigravity-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('antigravity-smoke.json').read_text())
          assert payload.get('status') == 'SUCCESS', payload
          assert payload.get('response', '').strip() == 'ANTIGRAVITY_RUNNER_OK', payload
          print('ANTIGRAVITY_SELF_HOSTED_GATE=PASS')
          PY
