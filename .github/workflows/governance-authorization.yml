name: Governance Authorization
on:
  workflow_call:
    inputs:
      controller_head:
        required: true
        type: string
      release:
        default: false
        type: boolean
    outputs:
      authorized:
        value: ${{ jobs.authorize.outputs.authorized }}
permissions:
  contents: read
  issues: read
jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CONTROLLER_HEAD: ${{ inputs.controller_head }}
      RELEASE_WORKFLOW: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - name: Verify runtime maintenance scope and retain predecessor
        if: hashFiles('contracts/production/authority-successors/node-security.20261021.json') != ''
        working-directory: ${{ github.workspace }}
        run: python3 -B scripts/production/node-security.py prepare --github-env "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: node scripts/governance/build-human-flow-review.mjs
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - run: node scripts/governance/verify-human-flow-field-coverage.mjs
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - run: node scripts/governance/collect-qa-evidence.mjs
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - run: node scripts/governance/read-human-approval.mjs
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - run: node scripts/governance/evaluate-gates.mjs
        env:
          GOVERNANCE_EVIDENCE_MANIFEST: artifacts/governance/qa-evidence-manifest.json
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - id: authorize
        run: node scripts/governance/authorize-workflow.mjs
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
