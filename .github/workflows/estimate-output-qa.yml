name: Estimate Output QA

on:
  pull_request:
    branches: [main]

jobs:
  estimate_output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --ignore-scripts
      - name: Unit and route tests
        run: npm test
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Estimate output browser QA
        run: |
          npm run start:qa > /tmp/sash-estimate-output.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 0.5
          done
          npm run test:browser:estimate-output
      - name: Upload estimate output QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estimate-output-browser-qa
          path: artifacts/estimate-output-browser-qa/
          if-no-files-found: warn
