name: Public SaaS S8 Environment Inventory

on:
  push:
    branches: [feat/public-saas-foundation-a1]
    paths:
      - '.github/workflows/public-saas-s8-environment-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_AkuHacuJlCl8LuvaFpCzFmbv
      VERCEL_PROJECT_ID: prj_4z0zqW6yKyPuFINODfGX8LPBuJRP
      STAGING_PROJECT_NAME: sash-app-public-saas-staging
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
    steps:
      - name: Resolve Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          test -n "$token"
          echo "VERCEL_TOKEN_EFFECTIVE=$token" >> "$GITHUB_ENV"

      - name: Inspect custom environment capacity
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/custom-envs.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/custom-environments?teamId=$VERCEL_ORG_ID")"
          echo "VERCEL_CUSTOM_ENV_API_HTTP=$status"
          if [[ "$status" != "200" ]]; then
            node -e 'const fs=require("node:fs");let p={};try{p=JSON.parse(fs.readFileSync("/tmp/custom-envs.json","utf8"));}catch{};const e=p?.error??p??{};console.log(`VERCEL_CUSTOM_ENV_GATE=BLOCKED code=${String(e.code??"unknown")} message=${String(e.message??"unknown").slice(0,200)}`)'
            exit 2
          fi
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("/tmp/custom-envs.json","utf8"));const envs=Array.isArray(p.environments)?p.environments:[];console.log(`VERCEL_CUSTOM_ENV_LIMIT=${p?.accountLimit?.total??"unknown"}`);console.log(`VERCEL_CUSTOM_ENV_COUNT=${envs.length}`);console.log(`VERCEL_STAGING_EXISTS=${envs.some(e=>e.slug==="staging")?"YES":"NO"}`);'

      - name: Ensure dedicated Staging project exists
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/staging-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
            "https://api.vercel.com/v9/projects/$STAGING_PROJECT_NAME?teamId=$VERCEL_ORG_ID")"

          if [[ "$status" == "404" ]]; then
            node -e 'require("node:fs").writeFileSync("/tmp/create-project.json",JSON.stringify({name:process.env.STAGING_PROJECT_NAME}))'
            team_status="$(curl -sS -o /tmp/staging-project.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/create-project.json \
              "https://api.vercel.com/v11/projects?teamId=$VERCEL_ORG_ID")"

            if [[ "$team_status" == "403" ]]; then
              personal_status="$(curl -sS -o /tmp/staging-project-personal.json -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
                -H 'Content-Type: application/json' \
                --data-binary @/tmp/create-project.json \
                "https://api.vercel.com/v11/projects")"
              if [[ "$personal_status" == "200" || "$personal_status" == "201" ]]; then
                mv /tmp/staging-project-personal.json /tmp/staging-project.json
                status="$personal_status"
                echo "S8_VERCEL_STAGING_SCOPE=personal"
              else
                STATUS="$personal_status" node -e 'const fs=require("node:fs");let p={};try{p=JSON.parse(fs.readFileSync("/tmp/staging-project-personal.json","utf8"));}catch{};const e=p?.error??p??{};console.error(`S8_VERCEL_PERSONAL_SCOPE_GATE=BLOCKED status=${process.env.STATUS} code=${String(e.code??"unknown")} message=${String(e.message??"unknown").slice(0,240)}`)'
                status="$personal_status"
              fi
            else
              status="$team_status"
              [[ "$status" == "200" || "$status" == "201" ]] && echo "S8_VERCEL_STAGING_SCOPE=team"
            fi
            rm -f /tmp/create-project.json /tmp/staging-project-personal.json
          else
            [[ "$status" == "200" ]] && echo "S8_VERCEL_STAGING_SCOPE=team-existing"
          fi

          if [[ "$status" != "200" && "$status" != "201" ]]; then
            STATUS="$status" node -e 'const fs=require("node:fs");let p={};try{p=JSON.parse(fs.readFileSync("/tmp/staging-project.json","utf8"));}catch{};const e=p?.error??p??{};console.error(`S8_VERCEL_STAGING_PROJECT_GATE=BLOCKED status=${process.env.STATUS} code=${String(e.code??"unknown")} message=${String(e.message??"unknown").slice(0,240)}`)'
            exit 3
          fi

          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("/tmp/staging-project.json","utf8"));if(!p.id||p.name!==process.env.STAGING_PROJECT_NAME)process.exit(1);console.log(`S8_VERCEL_STAGING_PROJECT_GATE=PASS project=${p.name} id=${p.id} account=${p.accountId??"unknown"}`)'
