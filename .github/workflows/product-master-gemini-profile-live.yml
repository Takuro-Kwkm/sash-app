name: Product Master Gemini API Profile LIVE (Legacy Disabled)

on:
  workflow_dispatch:
    inputs:
      profile_path:
        description: Legacy Gemini API path is disabled; use Antigravity profile LIVE workflow
        required: false
        default: config/product-master-profiles/lixil-thermosl.v1.json

permissions:
  contents: read

jobs:
  legacy_disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy API worker disabled
        run: |
          echo 'GEMINI_API_PROFILE_LIVE=DISABLED'
          echo 'Use .github/workflows/product-master-antigravity-profile-live.yml on the self-hosted gemini-worker runner.'
          exit 3
