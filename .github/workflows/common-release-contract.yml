name: Common Release Contract
on:
  pull_request:
    paths: ['contracts/production/order4-*.json', 'contracts/production/order5-*.json', 'contracts/production/order5-ew-assets/**', 'scripts/production/validate-order5-release.py', 'docs/ORDER5_BATCH1.md', 'contracts/production/shared-release-authority.v1.*', 'scripts/production/unpack-release-authority.py', 'scripts/production/validate-order4-release.py', 'docs/ORDER4_RELEASE.md', '.release/app-production-hotfix-v1', 'contracts/production/release-profile.v1.json', 'contracts/production/current-authority-successor.json', 'contracts/production/authority-successors/**', 'scripts/production/validate-current-authority-successor.py', 'scripts/production/release-contract.py', 'scripts/production/ignore-contract-only-build.mjs', 'docs/COMMON_RELEASE.md', '.github/workflows/common-release-contract.yml', 'vercel.json', 'apps/web/vercel.json']
  push:
    branches: [main]
    paths: ['contracts/production/order4-*.json', 'contracts/production/order5-*.json', 'contracts/production/order5-ew-assets/**', 'scripts/production/validate-order5-release.py', 'docs/ORDER5_BATCH1.md', 'contracts/production/shared-release-authority.v1.*', 'scripts/production/unpack-release-authority.py', 'scripts/production/validate-order4-release.py', 'docs/ORDER4_RELEASE.md', '.release/app-production-hotfix-v1', 'contracts/production/release-profile.v1.json', 'contracts/production/current-authority-successor.json', 'contracts/production/authority-successors/**', 'scripts/production/validate-current-authority-successor.py', 'scripts/production/release-contract.py', 'scripts/production/ignore-contract-only-build.mjs', 'docs/COMMON_RELEASE.md', '.github/workflows/common-release-contract.yml', 'vercel.json', 'apps/web/vercel.json']
permissions:
  contents: read
jobs:
  release-connection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact candidate identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14'}
      - run: python -B scripts/production/unpack-release-authority.py /tmp/order4-shared-release
      - run: python -B scripts/production/release-contract.py --central /tmp/order4-shared-release --check
      - run: python -B scripts/production/validate-order5-release.py
      - run: python -B -m unittest discover -s scripts/production -p test_order5_batch2_scope.py
      - run: python -B scripts/production/validate-architecture-connection.py
      - run: python -B scripts/production/validate-current-authority-successor.py --central /tmp/order4-shared-release
