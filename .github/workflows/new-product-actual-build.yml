name: Actual New Product Master Build
"on":
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact comparison base; omission uses first parent
        required: false
        type: string
permissions:
  contents: read
jobs:
  actual-native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      SHARED_HARNESS_ROOT: /tmp/shared-build-authority
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.14
      - name: Read back exact adopted shared dependency snapshot
        run: |-
          python -B scripts/production/product-conditions-scope.py
          python -B scripts/production/test_product_conditions_scope.py
          python -B scripts/production/test_sash_authority_successor.py
          python -B scripts/production/unpack-product-master-conditions.py "$SHARED_HARNESS_ROOT"
      - run: python -m pip install -r "$SHARED_HARNESS_ROOT/requirements.txt"
      - run: python -m pip install openpyxl==3.1.5
      - name: Verify existing XLSX Working recovery and sales-QA boundary
        run: |
          python -B scripts/production/validate-working-master-xlsx-profile.py
          python -B scripts/production/test-working-master-xlsx-recovery.py "$SHARED_HARNESS_ROOT"
          python -B scripts/production/test-working-master-recovery.py "$SHARED_HARNESS_ROOT"
          python -B scripts/production/test-working-master-business-qa.py "$SHARED_HARNESS_ROOT"
          python -B scripts/production/test_working_recovery_successor.py
      - name: Verify scoped Working Formal and immutable Human/native CAS boundary
        run: |
          python -B scripts/production/validate-scoped-working-formal.py
          SHARED_HARNESS_ROOT="$SHARED_HARNESS_ROOT" python -B scripts/production/test_scoped_working_formal.py
      - name: Assess bounded infrastructure changes through the existing router
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
          EVENT: ${{ github.event_name }}
        run: |
          base="${BASE_SHA:-$(git rev-parse HEAD^)}"
          python -B scripts/ci/sash-change-observation.py --central "$SHARED_HARNESS_ROOT" --base "$base" --head "$EXPECTED_HEAD" --event "$EVENT" --out artifacts/authority/sash-change-observation.json
      - name: Verify new-product environment without a registered product
        run: |
          python -c 'import json,os; print(json.dumps({os.environ["GITHUB_REPOSITORY"]:os.environ["GITHUB_WORKSPACE"]}))' > /tmp/native-new-product-repositories.json
          python -B "$SHARED_HARNESS_ROOT/scripts/verify-new-product-environment.py" --repositories /tmp/native-new-product-repositories.json --out artifacts/authority/new-product-environment.json
      - name: Real native profile, failure safety and actual isolated E2E
        run: |
          python -B scripts/production/validate-architecture-connection.py
          python -B scripts/production/validate-product-master-profile.py
          python -B scripts/production/test-product-master-build.py
          python -B scripts/production/test_actual_build.py
      - name: Verify JSON successor preserves existing Formal and QA boundaries
        run: |
          python -B scripts/production/test_json_master_formal.py "$SHARED_HARNESS_ROOT"
          python -B -m unittest discover -s scripts/production -p test_json_master_change.py -v
      - name: Keep exact runner assessment and native environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sash-authority-successor-${{ env.EXPECTED_HEAD }}
          path: artifacts/authority/*.json
          if-no-files-found: error
