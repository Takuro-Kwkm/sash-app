name: Uchirimo Stage1 Bath Existing Partition Recovery

on:
  push:
    branches:
      - feat/new-construction-runtime-ui-v16-20260910
    paths:
      - .github/workflows/uchirimo-stage1-bath-recovery.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: uchirimo-stage1-bath-${{ github.sha }}
  cancel-in-progress: true

jobs:
  authorize:
    if: ${{ github.ref_name == 'feat/new-construction-runtime-ui-v16-20260910' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      authorized: ${{ steps.bind.outputs.authorized }}
      matrix: ${{ steps.bind.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
      SOURCE_HEAD: d38062cbac649f70ee9ce848d92185bd5181b52f
      SOURCE_RUN_ID: '36138682468'
      SOURCE_ARTIFACT: uchirimo-heavy-recovery-analysis-d38062cbac649f70ee9ce848d92185bd5181b52f
      SOURCE_DIGEST: sha256:a2cc2b3cc1f7e6cf0b57f8336d2ec96a70b2b6268af940c0531bd1f1a176ccd5
      WORKFLOW_PATH: .github/workflows/uchirimo-stage1-bath-recovery.yml
      AUTH_OUT: artifacts/uchirimo-stage1-bath-authorization
      RUNNER_BLOB: 65a57854ab7adf45fa0486b465530686d76cb09f
      FULL_PROOF_BLOB: 94a86542cace253dc45e7b1f8589f98b837a4cce
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --ignore-scripts

      - name: Verify authorization scope and source artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor "$SOURCE_HEAD" "$HEAD_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_HEAD..$HEAD_SHA" | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WORKFLOW_PATH"
          test "$(git rev-parse "$HEAD_SHA:scripts/governance/uchirimo-selector-batch-runner.mjs")" = "$RUNNER_BLOB"
          test "$(git rev-parse "$HEAD_SHA:scripts/uchirimo-full-selector-proof.mjs")" = "$FULL_PROOF_BLOB"
          test "$(git rev-parse "$HEAD_SHA:scripts/governance/uchirimo-heavy-partition-analysis.mjs")" = "$(git rev-parse "$SOURCE_HEAD:scripts/governance/uchirimo-heavy-partition-analysis.mjs")"
          actual_digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"${SOURCE_ARTIFACT}\") | .digest")"
          test "$actual_digest" = "$SOURCE_DIGEST"
          mkdir -p "$AUTH_OUT/source"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir "$AUTH_OUT/source"

      - name: Bind INPUT_READY evidence to current HEAD and authorize Stage1
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { loadRegisteredRuntime } from './src/catalog/runtime-master/runtime-master-registry.mjs';

          const env=process.env;
          const read=(name)=>JSON.parse(readFileSync(`${env.AUTH_OUT}/source/${name}`,'utf8'));
          const input=read('explicit-constraint-stage1-bath-depth1-existing-partition-runner-input.json');
          const decision=read('explicit-constraint-stage1-bath-depth1-existing-partition-runner-input-decision.json');

          if(input.exact_head!==env.SOURCE_HEAD||input.status!=='INPUT_READY'||input.execution_authorized!==false||input.execution_performed!==false)throw new Error('STAGE1_SOURCE_INPUT_STATE_INVALID');
          if(input.root_count!==38||input.expected_shards!==76||input.item_count!==76||input.batch_count!==38||input.batch_item_limit!==2)throw new Error('STAGE1_SOURCE_INPUT_COUNT_INVALID');
          if(input.runner_blob_sha!==env.RUNNER_BLOB||input.full_selector_proof_blob_sha!==env.FULL_PROOF_BLOB)throw new Error('STAGE1_SOURCE_RUNNER_IDENTITY_INVALID');
          if(decision.exact_head!==env.SOURCE_HEAD||decision.stage1_runner_input_ready!==true||decision.stage1_execution_authorized!==false||decision.status!=='INPUT_READY')throw new Error('STAGE1_SOURCE_DECISION_INVALID');
          if(decision.next_recovery_action!=='AUTHORIZE_STAGE1_BATH_DEPTH1_EXISTING_PARTITION_EXECUTION_AFTER_CURRENT_HEAD_INPUT_PROOF')throw new Error('STAGE1_SOURCE_NEXT_ACTION_INVALID');
          if(!Array.isArray(input.runner_batches)||input.runner_batches.length!==38||input.runner_batches.some((batch)=>!Array.isArray(batch.items)||batch.items.length!==2))throw new Error('STAGE1_SOURCE_BATCH_SHAPE_INVALID');
          const items=input.runner_batches.flatMap((batch)=>batch.items);
          if(items.length!==76||new Set(items.map((row)=>row.partition_key)).size!==76)throw new Error('STAGE1_SOURCE_PARTITION_IDENTITY_INVALID');
          if(items.some((row,index)=>row.shard!==index))throw new Error('STAGE1_SOURCE_SHARD_ORDER_INVALID');

          const runtime=await loadRegisteredRuntime('YKK AP','ウチリモ 内窓');
          if(!runtime?.sourcePackageIntegrity?.match||runtime.sourcePackageIntegrity.actual!==input.current_runtime_manifest_sha256)throw new Error('STAGE1_CURRENT_RUNTIME_IDENTITY_INVALID');

          const binding={
            source_exact_head:env.SOURCE_HEAD,
            source_run_id:Number(env.SOURCE_RUN_ID),
            source_artifact_identity:env.SOURCE_ARTIFACT,
            source_artifact_sha256:env.SOURCE_DIGEST,
            current_exact_head:env.HEAD_SHA,
            changed_paths:[env.WORKFLOW_PATH],
            runner_blob_sha:env.RUNNER_BLOB,
            full_selector_proof_blob_sha:env.FULL_PROOF_BLOB,
            runtime_manifest_sha256:runtime.sourcePackageIntegrity.actual,
            impact_decision:'STAGE1_AUTOMATION_WIRING_ONLY_INPUT_DEPENDENCIES_UNCHANGED',
            source_input_reused_as_current_head:true,
            status:'PASS'
          };
          const bound={
            ...input,
            exact_head:env.HEAD_SHA,
            source_bound_exact_head:env.SOURCE_HEAD,
            current_head_evidence_binding:binding,
            execution_authorized:true,
            execution_performed:false,
            status:'AUTHORIZED'
          };
          const currentDecision={
            schema_version:'1.0.0',
            artifact_type:'UCHIRIMO_STAGE1_BATH_DEPTH1_EXISTING_PARTITION_EXECUTION_AUTHORIZATION',
            exact_head:env.HEAD_SHA,
            source_bound_exact_head:env.SOURCE_HEAD,
            current_head_evidence_binding:binding,
            stage1_runner_input_ready:true,
            stage1_execution_authorized:true,
            stage1_bath_root_count:38,
            stage1_existing_depth1_partition_count:76,
            stage1_logical_batch_count:38,
            stage1_expected_shards:76,
            stage2_execution_authorized:false,
            new_partition_authorized:false,
            deeper_split_authorized:false,
            full_constraint_execution_authorized:false,
            full_coverage_authorized:false,
            next_recovery_action:'EXECUTE_STAGE1_BATH_DEPTH1_EXISTING_PARTITIONS',
            REQUESTED_CHANGE_SCOPE:'UCHIRIMO_HEAVY_RECOVERY_STAGE1_BATH_EXECUTION_AUTHORIZATION_AND_AUTOMATION',
            REQUESTED_DIFF_COVERAGE:'PASS',
            UNREQUESTED_DIFF_COUNT:0,
            UCHIRIMO_FULL_COVERAGE_QA_GATE:'BLOCKED',
            UCHIRIMO_QA_STATUS:'UNVERIFIED',
            APP_INTEGRATION_READY:false,
            RELEASE_INPUT_GATE:'BLOCKED',
            status:'AUTHORIZED'
          };
          mkdirSync(env.AUTH_OUT,{recursive:true});
          writeFileSync(`${env.AUTH_OUT}/stage1-runner-input-current.json`,JSON.stringify(bound,null,2)+'\n');
          writeFileSync(`${env.AUTH_OUT}/stage1-execution-authorization.json`,JSON.stringify(currentDecision,null,2)+'\n');
          const matrix={include:bound.runner_batches.map((batch)=>({batch_index:batch.batch_index}))};
          appendFileSync(env.GITHUB_OUTPUT,`authorized=true\nmatrix=${JSON.stringify(matrix)}\n`);
          console.log('STAGE1_INPUT_CURRENT_HEAD_BINDING=PASS');
          console.log('STAGE1_EXECUTION_AUTHORIZED=TRUE');
          console.log('STAGE1_LOGICAL_BATCH_COUNT=38');
          console.log('STAGE2_EXECUTION_AUTHORIZED=FALSE');
          NODE

      - name: Upload Stage1 authorization evidence
        uses: actions/upload-artifact@v4
        with:
          name: uchirimo-stage1-bath-authorization-${{ env.HEAD_SHA }}
          path: ${{ env.AUTH_OUT }}/
          if-no-files-found: error

  execute:
    needs: [authorize]
    if: ${{ needs.authorize.outputs.authorized == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.authorize.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HEAD_SHA: ${{ github.sha }}
      BATCH_INDEX: ${{ matrix.batch_index }}
      AUTH_DIR: artifacts/uchirimo-stage1-bath-authorization
      OUT: artifacts/uchirimo-stage1-bath-execution
      UCHIRIMO_SELECTOR_EXPECTED_SHARDS: '76'
      UCHIRIMO_SELECTOR_CHILD_TIMEOUT_MS: '1080000'
      UCHIRIMO_SELECTOR_MAX_STATES: '1000000'
      UCHIRIMO_SELECTOR_MAX_TERMINALS: '1000000'
      UCHIRIMO_RESOLVER_CACHE_MAX: '512'
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --ignore-scripts

      - name: Download current-head Stage1 authorization
        uses: actions/download-artifact@v4
        with:
          name: uchirimo-stage1-bath-authorization-${{ env.HEAD_SHA }}
          path: ${{ env.AUTH_DIR }}

      - name: Materialize batch input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const input=JSON.parse(readFileSync(`${process.env.AUTH_DIR}/stage1-runner-input-current.json`,'utf8'));
          if(input.exact_head!==process.env.HEAD_SHA||input.status!=='AUTHORIZED'||input.execution_authorized!==true)throw new Error('STAGE1_CURRENT_INPUT_NOT_AUTHORIZED');
          const index=Number(process.env.BATCH_INDEX);
          const batch=input.runner_batches.find((row)=>row.batch_index===index);
          if(!batch||!Array.isArray(batch.items)||batch.items.length!==2)throw new Error('STAGE1_BATCH_NOT_FOUND:'+index);
          appendFileSync(process.env.GITHUB_ENV,`UCHIRIMO_SELECTOR_BATCH_ID=${batch.batch_id}\n`);
          appendFileSync(process.env.GITHUB_ENV,`UCHIRIMO_SELECTOR_BATCH_JSON=${JSON.stringify(batch.items)}\n`);
          appendFileSync(process.env.GITHUB_ENV,`UCHIRIMO_FULL_SELECTOR_OUT=${process.env.OUT}\n`);
          console.log(`STAGE1_BATCH_READY index=${index} id=${batch.batch_id} items=${batch.items.length}`);
          NODE

      - name: Execute existing Depth1 batch
        id: run
        shell: bash
        run: |
          set +e
          node scripts/governance/uchirimo-selector-batch-runner.mjs
          code=$?
          set -e
          echo "runner_exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "STAGE1_BATCH_RUNNER_EXIT_CODE=$code"

      - name: Verify and record batch evidence
        if: always()
        shell: bash
        env:
          RUNNER_EXIT_CODE: ${{ steps.run.outputs.runner_exit_code }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { existsSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const out=process.env.OUT;
          const index=Number(process.env.BATCH_INDEX);
          const batchId=process.env.UCHIRIMO_SELECTOR_BATCH_ID;
          const expected=JSON.parse(process.env.UCHIRIMO_SELECTOR_BATCH_JSON);
          mkdirSync(out,{recursive:true});
          const reportPath=join(out,`batch-${batchId}-report.json`);
          let report=null;
          const integrityFailures=[];
          let results=[];
          if(existsSync(reportPath)){
            report=JSON.parse(readFileSync(reportPath,'utf8'));
            if(report.exact_head!==process.env.HEAD_SHA)integrityFailures.push('BATCH_EXACT_HEAD_MISMATCH');
            if(report.batch_id!==batchId||report.item_count!==2)integrityFailures.push('BATCH_IDENTITY_MISMATCH');
            results=Array.isArray(report.results)?report.results:[];
            if(results.length!==2)integrityFailures.push('BATCH_RESULT_COUNT_INVALID');
            for(const row of results){
              if(row.status!=='PASS')continue;
              const shardPath=join(out,`shard-${row.shard}-report.json`);
              if(!existsSync(shardPath)){integrityFailures.push(`SHARD_REPORT_MISSING:${row.shard}`);continue;}
              const shard=JSON.parse(readFileSync(shardPath,'utf8'));
              const shardHead=shard.exact_head??shard.exact_head_sha??shard.exactHead??null;
              if(shardHead!==process.env.HEAD_SHA)integrityFailures.push(`SHARD_HEAD_MISMATCH:${row.shard}`);
              if(shard.status!=='PASS'||shard.runtime_integrity_match!==true||shard.unverified_discrete_selector_case_count!==0)integrityFailures.push(`SHARD_REPORT_INVALID:${row.shard}`);
              const casePath=join(out,String(shard.case_artifact??''));
              if(!shard.case_artifact||!existsSync(casePath)){integrityFailures.push(`CASE_ARTIFACT_MISSING:${row.shard}`);continue;}
              const actual=createHash('sha256').update(readFileSync(casePath)).digest('hex');
              if(actual!==shard.case_artifact_sha256)integrityFailures.push(`CASE_SHA_MISMATCH:${row.shard}`);
            }
          }else{
            results=expected.map((row)=>({shard:row.shard,partition_key:row.partition_key,status:'FAIL',timed_out:false,error:'BATCH_REPORT_MISSING'}));
            integrityFailures.push('BATCH_REPORT_MISSING');
          }
          const expectedKeys=new Set(expected.map((row)=>String(row.partition_key)));
          const observedKeys=new Set(results.map((row)=>String(row.partition_key)));
          if(expectedKeys.size!==2||observedKeys.size!==2||[...expectedKeys].some((key)=>!observedKeys.has(key)))integrityFailures.push('BATCH_PARTITION_SET_MISMATCH');
          const passCount=results.filter((row)=>row.status==='PASS').length;
          const failCount=2-passCount;
          const status=passCount===2&&integrityFailures.length===0?'PASS':'FAIL';
          const verification={
            schema_version:'1.0.0',
            artifact_type:'UCHIRIMO_STAGE1_BATH_DEPTH1_BATCH_VERIFICATION',
            exact_head:process.env.HEAD_SHA,
            batch_index:index,
            batch_id:batchId,
            runner_exit_code:Number(process.env.RUNNER_EXIT_CODE??-1),
            expected_item_count:2,
            observed_item_count:results.length,
            pass_count:passCount,
            fail_count:failCount,
            integrity_failures:integrityFailures,
            results,
            new_partition_authorized:false,
            deeper_split_authorized:false,
            status
          };
          writeFileSync(join(out,`stage1-batch-${String(index).padStart(2,'0')}-verification.json`),JSON.stringify(verification,null,2)+'\n');
          console.log(`STAGE1_BATCH_VERIFICATION index=${index} status=${status} pass=${passCount} fail=${failCount}`);
          NODE

      - name: Remove large terminal digests after integrity verification
        if: always()
        shell: bash
        run: rm -f "$OUT"/shard-*-terminal-digests.jsonl

      - name: Upload Stage1 batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uchirimo-stage1-bath-batch-${{ matrix.batch_index }}-${{ env.HEAD_SHA }}
          path: ${{ env.OUT }}/
          if-no-files-found: error

  aggregate:
    needs: [authorize, execute]
    if: ${{ always() && needs.authorize.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.sha }}
      AUTH_DIR: artifacts/uchirimo-stage1-bath-aggregate/auth
      BATCH_DIR: artifacts/uchirimo-stage1-bath-aggregate/batches
      AGG_OUT: artifacts/uchirimo-stage1-bath-aggregate/result
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Download current-head Stage1 authorization
        uses: actions/download-artifact@v4
        with:
          name: uchirimo-stage1-bath-authorization-${{ env.HEAD_SHA }}
          path: ${{ env.AUTH_DIR }}

      - name: Download all Stage1 batch evidence
        uses: actions/download-artifact@v4
        with:
          pattern: uchirimo-stage1-bath-batch-*-${{ env.HEAD_SHA }}
          path: ${{ env.BATCH_DIR }}
          merge-multiple: true

      - name: Aggregate Stage1 Bath closure evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdirSync, readdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const read=(path)=>JSON.parse(readFileSync(path,'utf8'));
          const input=read(`${process.env.AUTH_DIR}/stage1-runner-input-current.json`);
          const authorization=read(`${process.env.AUTH_DIR}/stage1-execution-authorization.json`);
          if(input.exact_head!==process.env.HEAD_SHA||input.status!=='AUTHORIZED'||input.execution_authorized!==true)throw new Error('STAGE1_AGGREGATE_INPUT_INVALID');
          if(authorization.exact_head!==process.env.HEAD_SHA||authorization.stage1_execution_authorized!==true||authorization.status!=='AUTHORIZED')throw new Error('STAGE1_AGGREGATE_AUTHORIZATION_INVALID');

          const files=readdirSync(process.env.BATCH_DIR).filter((name)=>/^stage1-batch-\d{2}-verification\.json$/.test(name)).sort();
          if(files.length!==38)throw new Error('STAGE1_BATCH_VERIFICATION_COUNT_INVALID:'+files.length);
          const verifications=files.map((name)=>read(join(process.env.BATCH_DIR,name)));
          const indexes=verifications.map((row)=>row.batch_index).sort((a,b)=>a-b);
          if(indexes.some((value,index)=>value!==index))throw new Error('STAGE1_BATCH_INDEX_COVERAGE_INVALID');
          if(verifications.some((row)=>row.exact_head!==process.env.HEAD_SHA||row.expected_item_count!==2))throw new Error('STAGE1_BATCH_VERIFICATION_IDENTITY_INVALID');

          const resultByPartition=new Map();
          for(const row of verifications){
            for(const result of row.results??[]){
              const key=String(result.partition_key);
              if(resultByPartition.has(key))throw new Error('STAGE1_DUPLICATE_PARTITION_RESULT:'+key);
              resultByPartition.set(key,result);
            }
          }
          const expectedKeys=input.runner_items.map((row)=>String(row.partition_key));
          if(expectedKeys.length!==76||new Set(expectedKeys).size!==76||resultByPartition.size!==76||expectedKeys.some((key)=>!resultByPartition.has(key)))throw new Error('STAGE1_PARTITION_RESULT_COVERAGE_INVALID');

          const roots=new Map();
          for(const item of input.runner_items){
            const root=String(item.original_parent_partition_id);
            const result=resultByPartition.get(String(item.partition_key));
            const list=roots.get(root)??[];
            list.push({partition_key:String(item.partition_key),shard:item.shard,status:result.status,timed_out:result.timed_out===true,error:result.error??null});
            roots.set(root,list);
          }
          if(roots.size!==38||[...roots.values()].some((rows)=>rows.length!==2))throw new Error('STAGE1_ROOT_RESULT_COVERAGE_INVALID');
          const rootRows=[...roots.entries()].map(([root,rows])=>({original_parent_partition_id:root,partition_results:rows,root_closure_status:rows.every((row)=>row.status==='PASS')?'PASS':'UNVERIFIED'})).sort((a,b)=>a.original_parent_partition_id.localeCompare(b.original_parent_partition_id));
          const closedRoots=rootRows.filter((row)=>row.root_closure_status==='PASS').length;
          const unverifiedRoots=38-closedRoots;
          const allResults=[...resultByPartition.values()];
          const passCount=allResults.filter((row)=>row.status==='PASS').length;
          const failed=allResults.filter((row)=>row.status!=='PASS');
          const timedOut=failed.filter((row)=>row.timed_out===true);
          const batchPassCount=verifications.filter((row)=>row.status==='PASS').length;
          const batchFailCount=38-batchPassCount;
          const allPass=passCount===76&&failed.length===0&&closedRoots===38&&verifications.every((row)=>row.integrity_failures?.length===0);
          const next=allPass?'BUILD_STAGE2_NONBATH_DEPTH2_EXISTING_PARTITION_RUNNER_INPUT':'CLASSIFY_STAGE1_FAILED_OR_TIMED_OUT_EXISTING_PARTITIONS';
          const status=allPass?'PASS':'BLOCKED';
          const aggregate={
            schema_version:'1.0.0',
            artifact_type:'UCHIRIMO_STAGE1_BATH_DEPTH1_EXISTING_PARTITION_EXECUTION_AGGREGATE',
            exact_head:process.env.HEAD_SHA,
            source_bound_exact_head:input.source_bound_exact_head,
            stage1_execution_authorized:true,
            stage1_execution_performed:true,
            stage1_bath_root_count:38,
            stage1_existing_depth1_partition_count:76,
            stage1_logical_batch_count:38,
            batch_pass_count:batchPassCount,
            batch_fail_count:batchFailCount,
            partition_pass_count:passCount,
            partition_fail_count:failed.length,
            timed_out_partition_count:timedOut.length,
            closed_bath_root_count:closedRoots,
            unverified_bath_root_count:unverifiedRoots,
            original_514_proven_closed_root_count:closedRoots,
            original_514_unverified_root_count:514-closedRoots,
            failed_partition_ids:failed.map((row)=>String(row.partition_key)).sort(),
            timed_out_partition_ids:timedOut.map((row)=>String(row.partition_key)).sort(),
            roots:rootRows,
            stage2_execution_authorized:false,
            new_partition_authorized:false,
            deeper_split_authorized:false,
            UCHIRIMO_FULL_COVERAGE_QA_GATE:'BLOCKED',
            UCHIRIMO_QA_STATUS:'UNVERIFIED',
            APP_INTEGRATION_READY:false,
            RELEASE_INPUT_GATE:'BLOCKED',
            next_recovery_action:next,
            status
          };
          const decision={
            schema_version:'1.0.0',
            artifact_type:'UCHIRIMO_STAGE1_BATH_DEPTH1_EXISTING_PARTITION_EXECUTION_DECISION',
            exact_head:process.env.HEAD_SHA,
            stage1_execution_status:status,
            stage1_closed_bath_root_count:closedRoots,
            stage1_unverified_bath_root_count:unverifiedRoots,
            stage1_failed_partition_count:failed.length,
            stage1_timed_out_partition_count:timedOut.length,
            stage2_execution_authorized:false,
            new_partition_authorized:false,
            deeper_split_authorized:false,
            full_constraint_execution_authorized:false,
            full_coverage_authorized:false,
            next_recovery_action:next,
            REQUESTED_CHANGE_SCOPE:'UCHIRIMO_HEAVY_RECOVERY_STAGE1_BATH_EXISTING_PARTITION_EXECUTION',
            REQUESTED_DIFF_COVERAGE:'PASS',
            UNREQUESTED_DIFF_COUNT:0,
            UCHIRIMO_FULL_COVERAGE_QA_GATE:'BLOCKED',
            UCHIRIMO_QA_STATUS:'UNVERIFIED',
            APP_INTEGRATION_READY:false,
            RELEASE_INPUT_GATE:'BLOCKED',
            status
          };
          mkdirSync(process.env.AGG_OUT,{recursive:true});
          writeFileSync(`${process.env.AGG_OUT}/explicit-constraint-stage1-bath-depth1-execution-aggregate.json`,JSON.stringify(aggregate,null,2)+'\n');
          writeFileSync(`${process.env.AGG_OUT}/explicit-constraint-stage1-bath-depth1-execution-decision.json`,JSON.stringify(decision,null,2)+'\n');
          console.log(`STAGE1_BATH_EXECUTION_STATUS=${status}`);
          console.log(`STAGE1_PARTITION_PASS_COUNT=${passCount}`);
          console.log(`STAGE1_PARTITION_FAIL_COUNT=${failed.length}`);
          console.log(`STAGE1_CLOSED_BATH_ROOT_COUNT=${closedRoots}`);
          console.log(`STAGE1_UNVERIFIED_BATH_ROOT_COUNT=${unverifiedRoots}`);
          console.log(`NEXT_RECOVERY_ACTION=${next}`);
          console.log('STAGE2_EXECUTION_AUTHORIZED=FALSE');
          console.log('UCHIRIMO_FULL_COVERAGE_QA_GATE=BLOCKED');
          NODE

      - name: Upload Stage1 aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uchirimo-stage1-bath-execution-aggregate-${{ env.HEAD_SHA }}
          path: ${{ env.AGG_OUT }}/
          if-no-files-found: error
