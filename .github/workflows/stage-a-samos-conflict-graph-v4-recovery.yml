name: Stage A Samos Conflict Graph V4 Recovery

on:
  workflow_call:
    inputs:
      controller_head:
        required: true
        type: string

permissions:
  issues: read
  contents: read

jobs:
  governance-authority:
    uses: ./.github/workflows/governance-authorization.yml
    with:
      controller_head: ${{ inputs.controller_head }}
      release: false

  closed-evidence-gate:
    needs: ["governance-authority"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && (true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve V4 recovery evidence and close same-condition retry
        shell: bash
        run: |
          set -euo pipefail
          echo 'V4_RECOVERY_EVIDENCE_RUN=34927175551'
          echo 'SAMOSL_RECOVERY=8/8_PASS'
          echo 'SAMOS2H_RECOVERY=0/5_REPORTS timeout_after_terminal_option_audit'
          echo 'S2H_SHUTTER_AUDIT=candidates15+17 pair_audit_complete_by_11s job_timeout_at_4m'
          echo 'AGGREGATE_REPORT_COUNT=8'
          echo 'AGGREGATE_EVIDENCE_DIGEST=ed28b5fd4e71453807b3a39926f377c5e4301c980cc51f45ff3777ecb2b0b8e7'
          echo 'RETRY_AUTHORIZED=false'
          echo 'REOPEN_CONDITION=DEPENDENCY_AWARE_FIELD_ORDER_MODEL'
          echo 'APP_INTEGRATION_READY=false'
          echo 'RELEASE_INPUT_GATE=BLOCKED'
