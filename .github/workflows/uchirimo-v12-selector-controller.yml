  advance:
    needs: [governance-authority, prepare, plan-0, plan-1, plan-2, plan-3, plan-4, plan-5, plan-6, plan-7, plan-8, plan-9, plan-10, plan-11, plan-12, plan-13, plan-14, plan-15, execute-0, execute-1, execute-2, execute-3, execute-4, execute-5, execute-6, execute-7, execute-8, execute-9, execute-10, execute-11, execute-12, execute-13, execute-14, execute-15]
    if: ${{ always() && needs.governance-authority.outputs.authorized == 'true' && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      next_action: ${{ steps.state.outputs.next_action }}
    env:
      HEAD_SHA: ${{ inputs.controller_head }}
      GEN: ${{ inputs.generation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: uchirimo-v12-parent-plan-${{ env.HEAD_SHA }}-g${{ env.GEN }}
          path: artifacts/uchirimo-v12-parent-plan
      - uses: actions/download-artifact@v4
        with:
          name: uchirimo-v12-controller-input-${{ env.HEAD_SHA }}-g${{ env.GEN }}
          path: artifacts/uchirimo-v12-controller-input
      - uses: actions/download-artifact@v4
        with:
          pattern: uchirimo-v12-plan-${{ env.HEAD_SHA }}-g${{ env.GEN }}-lane-*
          path: artifacts/uchirimo-v12-plans
          merge-multiple: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: uchirimo-v12-batch-*
          path: artifacts/uchirimo-v12-execution
          merge-multiple: false
      - name: Advance deterministic state
        env:
          UCHIRIMO_V12_CONTROLLER_MODE: advance
          UCHIRIMO_V12_GENERATION: ${{ inputs.generation }}
          UCHIRIMO_V12_PARENT_PLAN: artifacts/uchirimo-v12-parent-plan/all-partitions.json
          UCHIRIMO_V12_STATE: artifacts/uchirimo-v12-controller-input/controller-state.json
          UCHIRIMO_V12_UNITS: artifacts/uchirimo-v12-controller-input/recovery-units.json
          UCHIRIMO_V12_CERTIFICATES: artifacts/uchirimo-v12-controller-input/split-certificates.json
          UCHIRIMO_V12_PARENT_STATUS: artifacts/uchirimo-v12-controller-input/parent-status.json
          UCHIRIMO_V12_EXECUTION_INPUT: artifacts/uchirimo-v12-execution
          UCHIRIMO_V12_PLAN_SUMMARY_INPUT: artifacts/uchirimo-v12-plans
          UCHIRIMO_V12_CONTROLLER_OUT: artifacts/uchirimo-v12-controller-state
        run: node scripts/governance/uchirimo-v11-recovery-controller-runner.mjs
      - name: Read next action
        id: state
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync,readFileSync} from 'node:fs';
          const state=JSON.parse(readFileSync('artifacts/uchirimo-v12-controller-state/controller-state.json','utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT,'next_action='+state.next_action+'\n');
          console.log('UCHIRIMO_V12_NEXT_ACTION='+state.next_action);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: uchirimo-v12-controller-state-${{ env.HEAD_SHA }}-g${{ env.GEN }}
          path: artifacts/uchirimo-v12-controller-state/
          if-no-files-found: error
      - name: Stage controller state for secondary durable cache
        shell: bash
        run: |
          rm -rf artifacts/uchirimo-v12-prior
          cp -R artifacts/uchirimo-v12-controller-state artifacts/uchirimo-v12-prior
      - name: Save controller state to secondary durable cache
        uses: actions/cache/save@v4
        with:
          path: artifacts/uchirimo-v12-prior
          key: uchirimo-v12-controller-state-${{ env.HEAD_SHA }}-g${{ env.GEN }}

  dispatch-next:
    needs: ["governance-authority", "advance"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && needs.advance.outputs.next_action == 'DISPATCH_NEXT_GENERATION' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      CURRENT_GEN: ${{ inputs.generation }}
      SOURCE_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Dispatch exactly one next Project Governance generation
        shell: bash
        run: |
          set -euo pipefail
          NEXT_GEN="$(node -e "const n=Number(process.env.CURRENT_GEN); if(!Number.isInteger(n)||n<0)process.exit(2); process.stdout.write(String(n+1));")"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/project-governance-gate.yml/dispatches" \
            -f ref="$HEAD_BRANCH" \
            -f "inputs[uchirimo_v12_generation]=$NEXT_GEN" \
            -f "inputs[uchirimo_v12_source_run_id]=$SOURCE_RUN_ID"
          echo "UCHIRIMO_V12_NEXT_GENERATION_DISPATCHED=$NEXT_GEN source_run=$SOURCE_RUN_ID"

  blocked:
    needs: ["governance-authority", "advance"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && needs.advance.outputs.next_action == 'BLOCKED' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "UCHIRIMO_V12_CONTROLLER=BLOCKED"
          exit 1

  finalize:
    needs: ["governance-authority", "advance"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && needs.advance.outputs.next_action == 'FINAL_AGGREGATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      complete: ${{ steps.done.outputs.complete }}
      next_action: ${{ steps.done.outputs.next_action }}
    env:
      HEAD_SHA: ${{ inputs.controller_head }}
      GEN: ${{ inputs.generation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: uchirimo-v12-parent-plan-${{ env.HEAD_SHA }}-g${{ env.GEN }}
          path: artifacts/uchirimo-v12-parent-plan
      - uses: actions/download-artifact@v4
        with:
          name: uchirimo-v12-controller-state-${{ env.HEAD_SHA }}-g${{ env.GEN }}
          path: artifacts/uchirimo-v12-controller-state
      - name: Resolve generation-zero carry source
        id: carry-source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync,readFileSync} from 'node:fs';
          const parents=JSON.parse(readFileSync('artifacts/uchirimo-v12-controller-state/parent-status.json','utf8')).parents;
          const row=Object.values(parents).find((item)=>item.status==='ROOT_PASS_CARRY_FORWARD');
          if(!row){
            appendFileSync(process.env.GITHUB_OUTPUT,'has_carry=false\n');
            process.exit(0);
          }
          if(!row.current_carry_forward_run_id||!row.current_carry_forward_artifact_identity)throw new Error('UCHIRIMO_V12_CARRY_SOURCE_IDENTITY_MISSING');
          appendFileSync(process.env.GITHUB_OUTPUT,'has_carry=true\n');
          appendFileSync(process.env.GITHUB_OUTPUT,'run_id='+String(row.current_carry_forward_run_id)+'\n');
          appendFileSync(process.env.GITHUB_OUTPUT,'artifact_identity='+String(row.current_carry_forward_artifact_identity)+'\n');
          appendFileSync(process.env.GITHUB_OUTPUT,'artifact_id='+String(row.current_carry_forward_artifact_id??'')+'\n');
          appendFileSync(process.env.GITHUB_OUTPUT,'artifact_digest='+String(row.current_carry_forward_artifact_digest??'')+'\n');
          NODE
      - name: Download generation-zero carry payload once
        if: ${{ steps.carry-source.outputs.has_carry == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.carry-source.outputs.artifact_identity }}
          path: artifacts/uchirimo-v12-carry-forward
          run-id: ${{ steps.carry-source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify carry artifact metadata
        if: ${{ steps.carry-source.outputs.has_carry == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ steps.carry-source.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ steps.carry-source.outputs.artifact_digest }}
          SOURCE_RUN_ID: ${{ steps.carry-source.outputs.run_id }}
          SOURCE_NAME: ${{ steps.carry-source.outputs.artifact_identity }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const base=(process.env.GITHUB_API_URL||'https://api.github.com')+'/repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.SOURCE_RUN_ID+'/artifacts';
          const all=[];
          for(let page=1;;page+=1){
            const response=await fetch(base+'?per_page=100&page='+page,{headers});
            if(!response.ok)throw new Error('UCHIRIMO_V12_CARRY_METADATA_HTTP_'+response.status);
            const payload=await response.json();
            const batch=payload.artifacts??[];
            all.push(...batch);
            if(batch.length<100||all.length>=Number(payload.total_count??all.length))break;
          }
          const rows=all.filter((row)=>String(row.name)===process.env.SOURCE_NAME&&!row.expired);
          if(rows.length!==1)throw new Error('UCHIRIMO_V12_CARRY_METADATA_COUNT:'+rows.length);
          const row=rows[0];
          if(process.env.EXPECTED_ID&&String(row.id)!==process.env.EXPECTED_ID)throw new Error('UCHIRIMO_V12_CARRY_ARTIFACT_ID_MISMATCH');
          if(process.env.EXPECTED_DIGEST&&row.digest&&String(row.digest)!==process.env.EXPECTED_DIGEST)throw new Error('UCHIRIMO_V12_CARRY_ARTIFACT_DIGEST_MISMATCH');
          console.log('UCHIRIMO_V12_CARRY_ARTIFACT_METADATA=PASS id='+row.id);
          NODE
      - name: Materialize canonical parent evidence
        env:
          UCHIRIMO_V12_PARENT_PLAN: artifacts/uchirimo-v12-parent-plan/all-partitions.json
          UCHIRIMO_V12_STATE: artifacts/uchirimo-v12-controller-state/controller-state.json
          UCHIRIMO_V12_UNITS: artifacts/uchirimo-v12-controller-state/recovery-units.json
          UCHIRIMO_V12_PARENT_STATUS: artifacts/uchirimo-v12-controller-state/parent-status.json
          UCHIRIMO_V12_CARRY_FORWARD_DIR: artifacts/uchirimo-v12-carry-forward
          UCHIRIMO_V12_FINALIZED_OUT: artifacts/uchirimo-v12-finalized
        run: node scripts/governance/uchirimo-v11-recovery-finalizer.mjs
      - name: Aggregate canonical 3956 parents
        env:
          UCHIRIMO_SELECTOR_MODE: aggregate
          UCHIRIMO_SELECTOR_SHARD_INPUT: artifacts/uchirimo-v12-finalized
          UCHIRIMO_SELECTOR_EXPECTED_SHARDS: 3956
          UCHIRIMO_FULL_SELECTOR_OUT: artifacts/uchirimo-full-selector-proof
        run: node scripts/uchirimo-full-selector-proof.mjs
      - name: Stamp proof dependency metadata
        id: fingerprint
        run: |
          node scripts/governance/proof-dependency-fingerprint.mjs --mode fingerprint --family UCHIRIMO_SELECTOR --fingerprint-out artifacts/governance/uchirimo-selector-proof-fingerprint.json
          node scripts/governance/proof-dependency-fingerprint.mjs --mode stamp --family UCHIRIMO_SELECTOR --artifact artifacts/uchirimo-full-selector-proof/report.json --metadata artifacts/uchirimo-full-selector-proof/source-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: uchirimo-selector-proof-aggregate-${{ env.HEAD_SHA }}
          path: artifacts/uchirimo-full-selector-proof/
          if-no-files-found: error
      - name: Mark canonical selector complete
        id: done
        run: |
          echo "complete=true" >> "$GITHUB_OUTPUT"
          echo "next_action=COMPLETE" >> "$GITHUB_OUTPUT"
          echo "UCHIRIMO_V12_SELECTOR=COMPLETE"
