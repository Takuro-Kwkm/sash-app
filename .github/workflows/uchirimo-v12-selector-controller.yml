name: Uchirimo V12 Deterministic Selector Controller

on:
  workflow_call:
    inputs:
      controller_head:
        required: true
        type: string
      generation:
        required: false
        type: number
        default: 0
      source_controller_run_id:
        required: false
        type: string
        default: ''
    outputs:
      complete:
        description: Whether canonical Uchirimo selector aggregate was completed in this generation
        value: ${{ jobs.finalize.outputs.complete || 'false' }}
      next_action:
        description: Controller next action
        value: ${{ jobs.advance.outputs.next_action || jobs.finalize.outputs.next_action || 'BLOCKED' }}

permissions:
  contents: read
  actions: write
  pull-requests: read
  issues: read

jobs:
  governance-authority:
    uses: ./.github/workflows/governance-authorization.yml
    with:
      controller_head: ${{ inputs.controller_head }}
      release: false

  prepare:
    needs: ["governance-authority"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ inputs.controller_head }}
      GEN: ${{ inputs.generation }}
      SOURCE_RUN_ID: ${{ inputs.source_controller_run_id }}
      CARRY_ARTIFACT: uchirimo-selector-proof-carry-forward-${{ inputs.controller_head }}
      BOOTSTRAP_CARRY_RUN_ID: 36254578442
      BOOTSTRAP_CARRY_ARTIFACT: uchirimo-selector-proof-carry-forward-5bcc185405c478dab3c53c47992c0b06d114cfcd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Compute generation identities
        id: generation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const current=Number(process.env.GEN);
          if(!Number.isInteger(current)||current<0)throw new Error('UCHIRIMO_V12_GENERATION_INVALID:'+process.env.GEN);
          appendFileSync(process.env.GITHUB_OUTPUT,'previous_generation='+String(Math.max(0,current-1))+'\n');
          NODE
      - name: Build frozen canonical parent plan
        env:
          UCHIRIMO_SELECTOR_MODE: plan-all
          UCHIRIMO_FULL_SELECTOR_OUT: artifacts/uchirimo-v12-parent-plan
        run: node scripts/uchirimo-full-selector-proof.mjs
      - name: Enforce frozen parent denominator
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const plan=JSON.parse(readFileSync('artifacts/uchirimo-v12-parent-plan/all-partitions.json','utf8'));
          if(plan.status!=='PASS'||plan.shard_count!==3956||new Set(plan.partitions.map((r)=>r.partition_key)).size!==3956)throw new Error('UCHIRIMO_V12_PARENT_DENOMINATOR_INVALID:'+String(plan.shard_count));
          NODE
      - name: Download preferred bootstrap carry-forward bundle
        id: bootstrap-download
        if: ${{ inputs.generation == 0 }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BOOTSTRAP_CARRY_ARTIFACT }}
          path: artifacts/uchirimo-v12-bootstrap-carry
          run-id: ${{ env.BOOTSTRAP_CARRY_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Revalidate compatible parent evidence cumulatively
        if: ${{ inputs.generation == 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
          UCHIRIMO_SELECTOR_CURRENT_PLAN: artifacts/uchirimo-v12-parent-plan/all-partitions.json
          UCHIRIMO_SELECTOR_CARRY_FORWARD_OUT: artifacts/uchirimo-selector-proof-carry-forward
          UCHIRIMO_CARRY_FORWARD_BOOTSTRAP_DIR: ${{ steps.bootstrap-download.outcome == 'success' && 'artifacts/uchirimo-v12-bootstrap-carry' || '' }}
          UCHIRIMO_CARRY_FORWARD_BOOTSTRAP_ONLY: 'false'
          UCHIRIMO_CARRY_FORWARD_BOOTSTRAP_RUN_ID: ${{ env.BOOTSTRAP_CARRY_RUN_ID }}
          UCHIRIMO_CARRY_FORWARD_BOOTSTRAP_ARTIFACT_IDENTITY: ${{ env.BOOTSTRAP_CARRY_ARTIFACT }}
        run: |
          if [ "${{ steps.bootstrap-download.outcome }}" != "success" ]; then
            echo "UCHIRIMO_BOOTSTRAP_BUNDLE=UNAVAILABLE_FALLBACK_TO_COMPATIBLE_HISTORY"
          fi
          node scripts/governance/uchirimo-partition-carry-forward.mjs
      - name: Upload generation-zero carry-forward evidence
        id: carry-upload
        if: ${{ inputs.generation == 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CARRY_ARTIFACT }}
          path: artifacts/uchirimo-selector-proof-carry-forward/
          if-no-files-found: error
      - name: Initialize controller generation zero
        if: ${{ inputs.generation == 0 }}
        env:
          UCHIRIMO_V12_CONTROLLER_MODE: init
          UCHIRIMO_V12_GENERATION: 0
          UCHIRIMO_V12_PARENT_PLAN: artifacts/uchirimo-v12-parent-plan/all-partitions.json
          UCHIRIMO_V12_CARRY_MANIFEST: artifacts/uchirimo-selector-proof-carry-forward/manifest.json
          UCHIRIMO_V12_CARRY_ARTIFACT_IDENTITY: ${{ env.CARRY_ARTIFACT }}
          UCHIRIMO_V12_CARRY_ARTIFACT_ID: ${{ steps.carry-upload.outputs.artifact-id }}
          UCHIRIMO_V12_CARRY_ARTIFACT_DIGEST: ${{ steps.carry-upload.outputs.artifact-digest }}
          UCHIRIMO_V12_CONTROLLER_OUT: artifacts/uchirimo-v12-controller
        run: node scripts/governance/uchirimo-v11-recovery-controller-runner.mjs
      - name: Download prior controller state
        id: prior-controller-artifact
        if: ${{ inputs.generation > 0 }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: uchirimo-v12-controller-state-${{ env.HEAD_SHA }}-g${{ steps.generation.outputs.previous_generation }}
          path: artifacts/uchirimo-v12-prior
          run-id: ${{ inputs.source_controller_run_id }}
          github-token: ${{ github.token }}
      - name: Restore prior controller state from durable cache
        id: prior-controller-cache
        if: ${{ inputs.generation > 0 && steps.prior-controller-artifact.outcome != 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: artifacts/uchirimo-v12-prior
          key: uchirimo-v12-controller-state-${{ env.HEAD_SHA }}-g${{ steps.generation.outputs.previous_generation }}
      - name: Require one durable controller-state copy
        if: ${{ inputs.generation > 0 }}
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/uchirimo-v12-prior/controller-state.json
          test -f artifacts/uchirimo-v12-prior/recovery-units.json
          test -f artifacts/uchirimo-v12-prior/split-certificates.json
          test -f artifacts/uchirimo-v12-prior/parent-status.json
          echo "UCHIRIMO_V12_PRIOR_STATE=AVAILABLE artifact_outcome=${{ steps.prior-controller-artifact.outcome }} cache_hit=${{ steps.prior-controller-cache.outputs.cache-hit }}"
      - name: Resume authorized next generation
        if: ${{ inputs.generation > 0 }}
        env:
          UCHIRIMO_V12_CONTROLLER_MODE: resume-generation
          UCHIRIMO_V12_GENERATION: ${{ inputs.generation }}
          UCHIRIMO_V12_SOURCE_CONTROLLER_RUN_ID: ${{ inputs.source_controller_run_id }}
          UCHIRIMO_V12_STATE: artifacts/uchirimo-v12-prior/controller-state.json
          UCHIRIMO_V12_UNITS: artifacts/uchirimo-v12-prior/recovery-units.json
          UCHIRIMO_V12_CERTIFICATES: artifacts/uchirimo-v12-prior/split-certificates.json
          UCHIRIMO_V12_PARENT_STATUS: artifacts/uchirimo-v12-prior/parent-status.json
          UCHIRIMO_V12_CONTROLLER_OUT: artifacts/uchirimo-v12-controller
        run: node scripts/governance/uchirimo-v11-recovery-controller-runner.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: uchirimo-v12-parent-plan-${{ env.HEAD_SHA }}-g${{ env.GEN }}
          path: artifacts/uchirimo-v12-parent-plan/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: uchirimo-v12-controller-input-${{ env.HEAD_SHA }}-g${{ env.GEN }}
          path: artifacts/uchirimo-v12-controller/
