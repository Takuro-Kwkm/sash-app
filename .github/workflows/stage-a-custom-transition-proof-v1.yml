name: Stage A CUSTOM Transition Proof V1

on:
  workflow_call:
    inputs:
      controller_head:
        required: true
        type: string

permissions:
  issues: read
  contents: read
  actions: read

concurrency:
  group: stage-a-custom-transition-proof-v1
  cancel-in-progress: true

jobs:
  governance-authority:
    uses: ./.github/workflows/governance-authorization.yml
    with:
      controller_head: ${{ inputs.controller_head }}
      release: false

  prove:
    needs: ["governance-authority"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && (true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEAD_SHA: ${{ github.sha }}
      CUSTOM_GEOMETRY_EVIDENCE_HEAD: a2558005d3fe32299cce021bb6af6c9c09976b96
      CUSTOM_GEOMETRY_EVIDENCE_RUN: '34968389109'
      STAGE_A_CUSTOM_REACHABILITY_INPUT: artifacts/evidence/custom-v5/stage-a-custom-selector-reachability/report.json
      STAGE_A_CUSTOM_GEOMETRY_EQ_INPUT: artifacts/evidence/custom-v5/stage-a-custom-runtime-geometry-equivalence/report.json
      STAGE_A_CUSTOM_TRANSITION_OUT: artifacts/stage-a-custom-transition-proof
    steps:
      - name: Checkout exact push HEAD with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Exact HEAD and prerequisite source-invariance gate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA"
          git merge-base --is-ancestor "$CUSTOM_GEOMETRY_EVIDENCE_HEAD" "$HEAD_SHA"
          git diff --quiet "$CUSTOM_GEOMETRY_EVIDENCE_HEAD" "$HEAD_SHA" -- \
            src/ \
            scripts/stage-a-custom-dimension-source-shape-diagnostic.mjs \
            scripts/stage-a-formal-split-custom-guard-shape-diagnostic.mjs \
            scripts/stage-a-custom-dimension-boundary-partition-proof-v2.mjs \
            scripts/stage-a-custom-selector-reachability-v4.mjs \
            scripts/stage-a-custom-runtime-geometry-equivalence-v4.mjs
          node --check scripts/stage-a-custom-transition-proof-v1.mjs
          echo "EXACT_HEAD_GATE=PASS sha=$actual"
          echo "CUSTOM_GEOMETRY_EVIDENCE_INVARIANCE_GATE=PASS source_head=$CUSTOM_GEOMETRY_EVIDENCE_HEAD"

      - name: Download exact CUSTOM geometry V5 evidence
        uses: actions/download-artifact@v4
        with:
          name: stage-a-custom-selector-geometry-v5
          path: artifacts/evidence/custom-v5
          repository: Takuro-Kwkm/sash-app
          run-id: 34968389109
          github-token: ${{ github.token }}

      - name: Validate prerequisite evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const reach=JSON.parse(readFileSync(process.env.STAGE_A_CUSTOM_REACHABILITY_INPUT,'utf8'));
          const geo=JSON.parse(readFileSync(process.env.STAGE_A_CUSTOM_GEOMETRY_EQ_INPUT,'utf8'));
          if(reach.exact_head_sha!==process.env.CUSTOM_GEOMETRY_EVIDENCE_HEAD||geo.exact_head_sha!==process.env.CUSTOM_GEOMETRY_EVIDENCE_HEAD)throw new Error('CUSTOM_TRANSITION_PREREQ_HEAD_MISMATCH');
          if(reach.model_version!=='CUSTOM_SELECTOR_UI_REACHABILITY_DIRECTED_V4_VISIBLE_VALUE_NORMALIZATION'||reach.status!=='PASS'||reach.unique_context_count!==137||reach.unreachable_context_count!==0)throw new Error('CUSTOM_TRANSITION_REACHABILITY_PREREQ_INVALID');
          if(geo.model_version!=='CUSTOM_RUNTIME_GEOMETRY_EQUIVALENCE_FULL_ARRANGEMENT_V4_NULL_SAFE_FORMAL_WRAPPER'||geo.status!=='PASS'||geo.mismatch_count!==0||geo.arrangement_proof_class_count!==3456||geo.boundary_triplet_count!==1682)throw new Error('CUSTOM_TRANSITION_GEOMETRY_PREREQ_INVALID');
          console.log(`CUSTOM_TRANSITION_PREREQ_GATE=PASS contexts=${reach.unique_context_count} classes=${geo.arrangement_proof_class_count} triplets=${geo.boundary_triplet_count}`);
          NODE

      - name: Prove all CUSTOM state transitions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-a-custom-transition-proof-v1.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const r=JSON.parse(readFileSync(`${process.env.STAGE_A_CUSTOM_TRANSITION_OUT}/report.json`,'utf8'));
          if(r.exact_head_sha!==process.env.HEAD_SHA||r.evidence_head_sha!==process.env.CUSTOM_GEOMETRY_EVIDENCE_HEAD)throw new Error('CUSTOM_TRANSITION_REPORT_HEAD_MISMATCH');
          if(r.model_version!=='CUSTOM_TRANSITION_FULL_SELECTOR_CONTEXT_V1'||r.status!=='PASS')throw new Error(`CUSTOM_TRANSITION_MODEL_OR_STATUS ${r.model_version}/${r.status}`);
          if(r.selector_context_count!==137||r.source_rule_count!==152)throw new Error('CUSTOM_TRANSITION_CARDINALITY_DRIFT');
          if(r.evaluation_count!==1071||r.negative_evaluation_count!==112||r.unbounded_negative_not_applicable_count!==25)throw new Error(`CUSTOM_TRANSITION_EVALUATION_DRIFT eval=${r.evaluation_count} negative=${r.negative_evaluation_count} unbounded=${r.unbounded_negative_not_applicable_count}`);
          if(r.positive_status_counts?.PASS!==26||r.positive_status_counts?.REVIEW_REQUIRED!==111)throw new Error(`CUSTOM_TRANSITION_POSITIVE_STATUS_DRIFT ${JSON.stringify(r.positive_status_counts)}`);
          if((r.contexts??[]).some((row)=>row.status!=='PASS'))throw new Error('CUSTOM_TRANSITION_CONTEXT_FAILURE');
          console.log(`CUSTOM_TRANSITION_GATE=PASS contexts=${r.selector_context_count} evaluations=${r.evaluation_count} negative=${r.negative_evaluation_count} unbounded_negative_na=${r.unbounded_negative_not_applicable_count}`);
          console.log(`CUSTOM_TRANSITION_EVIDENCE_DIGEST=${r.evidence_digest}`);
          console.log('CUSTOM_SIZE_COVERAGE_GATE=PASS');
          console.log('AUTOMATED_TEST_GATE=PASS_CUSTOM_SYMBOLIC_PENDING_BROWSER');
          console.log('FULL_BROWSER_QA_GATE=NOT_STARTED');
          console.log('APP_INTEGRATION_READY=false');
          console.log('RELEASE_INPUT_GATE=BLOCKED');
          NODE

      - name: Upload transition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-custom-transition-proof-v1
          path: artifacts/stage-a-custom-transition-proof/
          if-no-files-found: error
