name: Antigravity LaunchAgent GUI Session Diagnostic

on:
  push:
    branches: [diag/antigravity-launchctl-asuser-20260905]
    paths:
      - .github/workflows/antigravity-launchctl-asuser-diagnostic.yml

concurrency:
  group: antigravity-launchctl-asuser-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Verify Antigravity through launchctl asuser
    runs-on: [self-hosted, macOS, ARM64, gemini-worker]
    timeout-minutes: 5
    env:
      PATH: /Users/takuro/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      HOME: /Users/takuro
    steps:
      - name: Verify service runner context
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_user=$(id -un)"
          echo "home=${HOME}"
          echo "uid=$(id -u)"
          command -v agy
          agy --version

      - name: Verify Antigravity in GUI login bootstrap
        shell: bash
        run: |
          set -euo pipefail
          UID_VALUE="$(id -u)"
          /bin/launchctl asuser "$UID_VALUE" /usr/bin/env \
            HOME="$HOME" \
            PATH="$PATH" \
            /Users/takuro/.local/bin/agy \
            -p "Return exactly: ANTIGRAVITY_ASUSER_OK" \
            --output-format json \
            | tee antigravity-asuser-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('antigravity-asuser-smoke.json').read_text())
          assert payload.get('status') == 'SUCCESS', payload
          assert payload.get('response', '').strip() == 'ANTIGRAVITY_ASUSER_OK', payload
          print('ANTIGRAVITY_ASUSER_GATE=PASS')
          PY
