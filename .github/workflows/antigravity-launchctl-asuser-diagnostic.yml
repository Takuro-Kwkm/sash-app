name: Antigravity LaunchAgent Security Session Diagnostic

on:
  push:
    branches: [diag/antigravity-launchctl-asuser-20260905]
    paths:
      - .github/workflows/antigravity-launchctl-asuser-diagnostic.yml

concurrency:
  group: antigravity-launchctl-asuser-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Inspect runner launchd security session
    runs-on: [self-hosted, macOS, ARM64, gemini-worker]
    timeout-minutes: 5
    env:
      PATH: /Users/takuro/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      HOME: /Users/takuro
    steps:
      - name: Inspect launchd plist security-session keys
        shell: bash
        run: |
          set -euo pipefail
          PLIST="$HOME/Library/LaunchAgents/actions.runner.Takuro-Kwkm-sash-app.sash-gemini-worker-mac.plist"
          test -f "$PLIST"
          echo "plist_present=PASS"
          for KEY in SessionCreate ProcessType LimitLoadToSessionType RunAtLoad; do
            if VALUE="$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST" 2>/dev/null)"; then
              echo "$KEY=$VALUE"
            else
              echo "$KEY=ABSENT"
            fi
          done
