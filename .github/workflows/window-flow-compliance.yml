name: Window Flow Compliance Closure
on:
  push:
    branches: [integration/window-flow-compliance-20260929]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify runtime maintenance scope and retain predecessor
        if: hashFiles('contracts/production/authority-successors/node-security.20261021.json') != ''
        working-directory: ${{ github.workspace }}
        run: python3 -B scripts/production/node-security.py prepare --github-env "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: npm run lint && npm run typecheck && npm test
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - run: npm install --package-lock=false --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Eight series browser and regression
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          npm run start:qa > /tmp/window-flow.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 1
          done
          node test/browser/global-window-selection-flow-browser-qa.mjs
          node test/browser/inner-window-canonical-frame-qa.mjs
          node test/browser/inplus-bathroom-v1-browser-qa.mjs
          node test/browser/bathroom-estimate-workflow-browser-qa.mjs
          node test/browser/inplus-accessory-request-browser-qa.mjs
          node test/browser/inplus-reverse-handing-browser-qa.mjs
          node test/browser/window-flow-downstream-qa.mjs
          node test/browser/eight-series-business-flow-qa.mjs
          node test/browser/release-regression-browser-qa.mjs
          node test/browser/work-management-browser-qa.mjs
          node test/browser/estimate-output-browser-qa.mjs
          node scripts/build-eight-series-review.mjs
          node test/browser/eight-series-preview-qa.mjs
          node scripts/build-eight-series-review.mjs artifacts/bathroom-estimate-review/index.html bathroom
          node scripts/build-eight-series-review.mjs artifacts/inplus-reverse-handing-review/index.html handing
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-flow-compliance-${{ github.sha }}
          path: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}/artifacts/
