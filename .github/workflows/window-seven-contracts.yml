name: Window Seven Selection Contracts
on:
  pull_request:
    paths: ['contracts/window-seven/**', 'scripts/contracts/**', '.github/workflows/window-seven-contracts.yml']
  push:
    branches: [main, 'contracts/window-seven-formalization-20261006']
    paths: ['contracts/window-seven/**', 'scripts/contracts/**', '.github/workflows/window-seven-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adoption-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Verify runtime maintenance scope and retain predecessor
        if: hashFiles('contracts/production/authority-successors/node-security.20261021.json') != ''
        working-directory: ${{ github.workspace }}
        run: python3 -B scripts/production/node-security.py prepare --github-env "$GITHUB_ENV" --workflow .github/workflows/window-seven-contracts.yml
      - uses: actions/setup-node@v4
        with: {node-version: 24.22.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14'}
      - run: python -m pip install -r contracts/window-seven/requirements.txt
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Replay current Runtime against fixed branch observations
        run: node scripts/contracts/verify-window-runtime.mjs
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Central validators, evidence, inventory and Runtime invariants
        run: python scripts/contracts/verify-window-seven.py
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Evidence binding and isolated promotion adversarial checks
        run: python scripts/contracts/test-window-governance.py
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Existing QA invariants
        run: npm test
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-seven-integrity-${{ github.sha }}
          path: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}/contracts/window-seven/evidence/*verification.json
  formal-completion:
    needs: adoption-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Verify runtime maintenance scope and retain predecessor
        if: hashFiles('contracts/production/authority-successors/node-security.20261021.json') != ''
        working-directory: ${{ github.workspace }}
        run: python3 -B scripts/production/node-security.py prepare --github-env "$GITHUB_ENV" --workflow .github/workflows/window-seven-contracts.yml
      - uses: actions/setup-node@v4
        with: {node-version: 24.22.1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14'}
      - run: python -m pip install -r contracts/window-seven/requirements.txt
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - run: node scripts/contracts/verify-window-runtime.mjs
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Do not certify missing Human Decisions or unresolved Field parity
        run: python scripts/contracts/verify-window-seven.py --require-complete
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
