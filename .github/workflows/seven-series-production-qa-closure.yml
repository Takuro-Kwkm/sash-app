name: Seven Series Production QA Closure

on:
  push:
    branches: [qa/seven-series-production-closure-20260929]

permissions:
  contents: read

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_BASE_URL: https://sash-app-wave3-preview.vercel.app
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Production Runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$QA_BASE_URL/api/health" > /tmp/health.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const h=JSON.parse(readFileSync('/tmp/health.json','utf8'));
          const expected=['SER-LIXIL-TW','SER-LIX-EW','SER-LIX-SAMOS2H','SER-LIX-SAMOSL','SER-YKK-APW430','SER-YKK-APW431','SER-YKKAP-UCHIRIMO'];
          if(!h.ok)process.exit(1);
          const byId=new Map((h.runtimeMasterIntegrations??[]).map(x=>[x.id,x]));
          if(expected.some(id=>!byId.has(id)||byId.get(id).status!=='READY'||byId.get(id).selectable!==true))process.exit(1);
          console.log('SEVEN_SERIES_RUNTIME_SMOKE=PASS');
          NODE
      - name: Install browser QA dependencies
        run: |
          npm install --ignore-scripts
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate fixed Uchirimo flow on branch Runtime
        shell: bash
        run: |
          npm run start:qa > /tmp/uchirimo-fixed.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 1
          done
          QA_BASE_URL=http://127.0.0.1:4173 HEAD_SHA=$GITHUB_SHA node test/browser/uchirimo-runtime-browser-qa.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-series-production-qa-closure-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
