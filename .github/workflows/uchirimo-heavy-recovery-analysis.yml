name: Uchirimo Heavy Recovery Analysis

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/uchirimo-heavy-recovery-analysis.yml'
      - 'scripts/governance/uchirimo-heavy-partition-analysis.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: uchirimo-heavy-recovery-analysis-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  heavy-evidence-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      UCHIRIMO_HEAVY_SOURCE_RUN_ID: '35670279840'
      UCHIRIMO_HEAVY_SOURCE_HEAD: '508021c64897039b2fa6e0391058ad88394536af'
      UCHIRIMO_HEAVY_ANALYSIS_OUT: artifacts/uchirimo-heavy-recovery
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --ignore-scripts

      - name: Verify exact HEAD and analysis syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          node --check scripts/governance/uchirimo-heavy-partition-analysis.mjs

      - name: Reconstruct heavy partition evidence from source run
        shell: bash
        run: |
          set -euo pipefail
          node scripts/governance/uchirimo-heavy-partition-analysis.mjs

      - name: Verify analysis-only gate state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const analysis=JSON.parse(readFileSync('artifacts/uchirimo-heavy-recovery/heavy-partition-analysis.json','utf8'));
          const plan=JSON.parse(readFileSync('artifacts/uchirimo-heavy-recovery/recursive-partition-plan.json','utf8'));
          if(analysis.task_classification!=='NON-PRODUCT-MASTER'||analysis.product_master_mutation!==0)throw new Error('RECOVERY_ANALYSIS_CLASSIFICATION_INVALID');
          if(analysis.deferred_scope_status!=='DEFERRED_UNVERIFIED')throw new Error('UCHIRIMO_DEFERRED_STATUS_INVALID');
          if(!Number.isInteger(analysis.heavy_partition_count)||analysis.heavy_partition_count<1)throw new Error('HEAVY_PARTITION_INVENTORY_EMPTY');
          if(plan.status!=='PLAN_READY')throw new Error('RECOVERY_PLAN_NOT_READY');
          if(plan.PARTITION_OVERLAP_COUNT!==0||plan.PARTITION_GAP_COUNT!==0)throw new Error('RECOVERY_PLAN_COVERAGE_SHAPE_INVALID');
          console.log('UCHIRIMO_HEAVY_ANALYSIS_ONLY=PASS');
          console.log('UCHIRIMO_FULL_COVERAGE_QA_GATE=BLOCKED');
          console.log('APP_INTEGRATION_READY=FALSE');
          console.log('RELEASE_INPUT_GATE=BLOCKED');
          NODE

      - name: Upload heavy recovery analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uchirimo-heavy-recovery-analysis-${{ env.HEAD_SHA }}
          path: artifacts/uchirimo-heavy-recovery/
          if-no-files-found: warn
