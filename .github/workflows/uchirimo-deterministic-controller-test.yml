name: Uchirimo Deterministic Controller Prep Test

on:
  push:
    branches:
      - tmp/uchirimo-deterministic-controller-v1-20260927

permissions:
  contents: read

concurrency:
  group: uchirimo-deterministic-controller-prep
  cancel-in-progress: true

jobs:
  controller-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEAD_SHA: ${{ github.sha }}
      UCHIRIMO_SELECTOR_MODE: plan-all
      UCHIRIMO_FULL_SELECTOR_OUT: artifacts/uchirimo-v12-parent-plan
    steps:
      - name: Checkout exact prep HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --ignore-scripts

      - name: Controller syntax and unit tests
        run: |
          set -euo pipefail
          node --check scripts/governance/uchirimo-v11-recovery-controller.mjs
          node --check scripts/governance/uchirimo-v11-recovery-controller.test.mjs
          node --check scripts/governance/uchirimo-selector-batch-runner.mjs
          node --check scripts/governance/uchirimo-v11-recovery-controller-runner.mjs
          node --check scripts/governance/uchirimo-v11-recovery-finalizer.mjs
          node scripts/governance/uchirimo-v11-recovery-controller.test.mjs

      - name: Validate V12 workflow structure
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/uchirimo-v12-selector-controller.yml', aliases: true); puts 'UCHIRIMO_V12_WORKFLOW_YAML=PASS'"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const src=readFileSync('.github/workflows/uchirimo-v12-selector-controller.yml','utf8');
          const plan=[...src.matchAll(/^  plan-(\\d+):/gm)].map((m)=>Number(m[1])).sort((a,b)=>a-b);
          const exec=[...src.matchAll(/^  execute-(\\d+):/gm)].map((m)=>Number(m[1])).sort((a,b)=>a-b);
          const expected=Array.from({length:16},(_,i)=>i);
          if(JSON.stringify(plan)!==JSON.stringify(expected))throw new Error('UCHIRIMO_V12_PLAN_LANES_INVALID:'+JSON.stringify(plan));
          if(JSON.stringify(exec)!==JSON.stringify(expected))throw new Error('UCHIRIMO_V12_EXEC_LANES_INVALID:'+JSON.stringify(exec));
          for(const token of [
            'UCHIRIMO_V12_EVIDENCE_ARTIFACT_IDENTITY: ${{ matrix.artifact_identity }}',
            'uchirimo-v12-controller-state-${{ env.HEAD_SHA }}-g${{ env.GEN }}',
            "needs.advance.outputs.next_action == 'DISPATCH_NEXT_GENERATION'",
            "needs.advance.outputs.next_action == 'FINAL_AGGREGATE'",
            'uchirimo-v11-recovery-finalizer.mjs',
            'UCHIRIMO_SELECTOR_EXPECTED_SHARDS: 3956'
          ]) if(!src.includes(token))throw new Error('UCHIRIMO_V12_WORKFLOW_TOKEN_MISSING:'+token);
          if(src.includes('GITHUB_OUTPUT: ${{ steps.plan.outputs }}'))throw new Error('UCHIRIMO_V12_INVALID_OUTPUT_ENV');
          console.log('UCHIRIMO_V12_WORKFLOW_STRUCTURE=PASS lanes=16');
          NODE
      - name: Build frozen canonical parent plan
        run: node scripts/uchirimo-full-selector-proof.mjs

      - name: Enforce frozen parent denominator
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const plan=JSON.parse(readFileSync('artifacts/uchirimo-v12-parent-plan/all-partitions.json','utf8'));
          const stable=(v)=>Array.isArray(v)?v.map(stable):(!v||typeof v!=='object'?v:Object.fromEntries(Object.entries(v).sort(([a],[b])=>a.localeCompare(b)).map(([k,x])=>[k,stable(x)])));
          const hash=createHash('sha256').update(JSON.stringify(stable(plan.partitions))).digest('hex');
          console.log('UCHIRIMO_V12_PARENT_COUNT='+plan.shard_count);
          console.log('UCHIRIMO_V12_PARENT_POPULATION_SHA256='+hash);
          if(plan.status!=='PASS')throw new Error('UCHIRIMO_V12_PARENT_PLAN_NOT_PASS');
          if(plan.shard_count!==3956)throw new Error('UCHIRIMO_V12_PARENT_DENOMINATOR_DRIFT:'+plan.shard_count);
          if(new Set(plan.partitions.map((row)=>row.partition_key)).size!==3956)throw new Error('UCHIRIMO_V12_PARENT_KEY_DUPLICATE');
          NODE

      - name: Exercise deterministic controller init and lane planning
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/uchirimo-v12-fixture artifacts/uchirimo-v12-controller
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const plan=JSON.parse(readFileSync('artifacts/uchirimo-v12-parent-plan/all-partitions.json','utf8'));
          const reused=plan.partitions.slice(0,3950);
          const open=plan.partitions.slice(3950);
          const carry={
            schema_version:'1.0.0',
            status:'PASS',
            current_exact_head:process.env.HEAD_SHA,
            current_shard_count:3956,
            runtime_manifest_sha256:plan.runtime_manifest_sha256,
            execution_dependency_fingerprint:'fixture-execution',
            reused_partition_count:reused.length,
            rerun_partition_count:open.length,
            heavy_partition_count:1,
            reused_partition_keys:reused.map((row)=>row.partition_key),
            reused_partitions:reused.map((row)=>({shard:row.shard,partition_key:row.partition_key,source_run_id:1,source_exact_head:process.env.HEAD_SHA,source_shard_index:row.shard,source_artifact_identity:'fixture'})),
            heavy_partition_keys:[open[0].partition_key],
            heavy_partition_observations:[{partition_key:open[0].partition_key,timed_out:true,duration_ms:3000000,classification:'OBSERVED_TIMEOUT'}]
          };
          writeFileSync('artifacts/uchirimo-v12-fixture/carry.json',JSON.stringify(carry,null,2)+'\n');
          NODE
          UCHIRIMO_V12_CONTROLLER_MODE=init \
          UCHIRIMO_V12_PARENT_PLAN=artifacts/uchirimo-v12-parent-plan/all-partitions.json \
          UCHIRIMO_V12_CARRY_MANIFEST=artifacts/uchirimo-v12-fixture/carry.json \
          UCHIRIMO_V12_CONTROLLER_OUT=artifacts/uchirimo-v12-controller \
          node scripts/governance/uchirimo-v11-recovery-controller-runner.mjs
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const state=JSON.parse(readFileSync('artifacts/uchirimo-v12-controller/controller-state.json','utf8'));
          if(state.closed_parent_count!==3950||state.open_parent_count!==6)throw new Error('UCHIRIMO_V12_INIT_PARENT_COUNTS_INVALID');
          if(state.pending_heavy_count!==1||state.pending_normal_count!==5)throw new Error('UCHIRIMO_V12_INIT_CLASS_COUNTS_INVALID');
          if(state.next_action!=='EXECUTE')throw new Error('UCHIRIMO_V12_INIT_NEXT_ACTION_INVALID:'+state.next_action);
          NODE
          total=0
          deferred=0
          for lane in $(seq 0 15); do
            GITHUB_OUTPUT='' \
            UCHIRIMO_V12_CONTROLLER_MODE=plan-lane \
            UCHIRIMO_V12_PARENT_PLAN=artifacts/uchirimo-v12-parent-plan/all-partitions.json \
            UCHIRIMO_V12_STATE=artifacts/uchirimo-v12-controller/controller-state.json \
            UCHIRIMO_V12_UNITS=artifacts/uchirimo-v12-controller/recovery-units.json \
            UCHIRIMO_V12_CONTROLLER_OUT=artifacts/uchirimo-v12-controller \
            UCHIRIMO_SELECTOR_PLAN_LANE_INDEX=$lane \
            node scripts/governance/uchirimo-v11-recovery-controller-runner.mjs
          done
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          let scheduled=0,deferred=0;
          for(let lane=0;lane<16;lane+=1){
            const row=JSON.parse(readFileSync('artifacts/uchirimo-v12-controller/lane-'+lane+'-plan.json','utf8'));
            scheduled+=row.scheduled_unit_count;
            deferred+=row.deferred_unit_count;
          }
          if(scheduled!==6||deferred!==0)throw new Error('UCHIRIMO_V12_LANE_SCHEDULE_TOTAL_INVALID:'+scheduled+':'+deferred);
          console.log('UCHIRIMO_V12_CONTROLLER_FIXTURE=PASS scheduled='+scheduled+' deferred='+deferred);
          NODE

      - name: Exercise Runtime-derived heavy timeout split
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/uchirimo-v12-split-fixture artifacts/uchirimo-v12-split-controller artifacts/uchirimo-v12-split-execution artifacts/uchirimo-v12-split-advance
          mkdir -p artifacts/uchirimo-v12-split-fixture artifacts/uchirimo-v12-split-controller artifacts/uchirimo-v12-split-execution artifacts/uchirimo-v12-split-advance
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {resolveRuntimeAppProduct} from './src/catalog/runtime-master/runtime-app-bridge.mjs';
          import {chooseNextSplitAxis} from './scripts/governance/uchirimo-v11-recovery-controller.mjs';
          const plan=JSON.parse(readFileSync('artifacts/uchirimo-v12-parent-plan/all-partitions.json','utf8'));
          let candidate=null,axis=null;
          for(const row of plan.partitions){
            const seed={room_specification:row.room_specification,window_type:row.window_type,glass_family:row.glass_family};
            if(row.sash_configuration!=='__UNSET__')seed.sash_configuration=row.sash_configuration;
            if(row.size_class!=='__UNSET__')seed.size_class=row.size_class;
            Object.assign(seed,JSON.parse(row.partition_seed_json??'{}'));
            const resolved=await resolveRuntimeAppProduct('SER-YKKAP-UCHIRIMO',seed);
            const found=chooseNextSplitAxis(resolved.fields??[],Object.keys(seed));
            if(found){candidate=row;axis=found;break;}
          }
          if(!candidate||!axis)throw new Error('UCHIRIMO_V12_SPLIT_FIXTURE_CANDIDATE_MISSING');
          const reused=plan.partitions.filter((row)=>row.partition_key!==candidate.partition_key);
          const carry={
            schema_version:'1.0.0',
            status:'PASS',
            current_exact_head:process.env.HEAD_SHA,
            current_shard_count:3956,
            runtime_manifest_sha256:plan.runtime_manifest_sha256,
            execution_dependency_fingerprint:'fixture-execution',
            reused_partition_count:reused.length,
            rerun_partition_count:1,
            heavy_partition_count:1,
            reused_partition_keys:reused.map((row)=>row.partition_key),
            reused_partitions:reused.map((row)=>({shard:row.shard,partition_key:row.partition_key,source_run_id:1,source_exact_head:process.env.HEAD_SHA,source_shard_index:row.shard,source_artifact_identity:'fixture'})),
            heavy_partition_keys:[candidate.partition_key],
            heavy_partition_observations:[{partition_key:candidate.partition_key,timed_out:true,duration_ms:3000000,classification:'OBSERVED_TIMEOUT'}]
          };
          writeFileSync('artifacts/uchirimo-v12-split-fixture/carry.json',JSON.stringify(carry,null,2)+'\n');
          writeFileSync('artifacts/uchirimo-v12-split-fixture/candidate.json',JSON.stringify({candidate,expected_split_field:axis.field_key,expected_domain_count:axis.values.length},null,2)+'\n');
          console.log('UCHIRIMO_V12_SPLIT_FIXTURE parent='+candidate.partition_key+' field='+axis.field_key+' values='+axis.values.length);
          NODE

          UCHIRIMO_V12_CONTROLLER_MODE=init \
          UCHIRIMO_V12_PARENT_PLAN=artifacts/uchirimo-v12-parent-plan/all-partitions.json \
          UCHIRIMO_V12_CARRY_MANIFEST=artifacts/uchirimo-v12-split-fixture/carry.json \
          UCHIRIMO_V12_CONTROLLER_OUT=artifacts/uchirimo-v12-split-controller \
          node scripts/governance/uchirimo-v11-recovery-controller-runner.mjs

          for lane in $(seq 0 15); do
            GITHUB_OUTPUT='' \
            UCHIRIMO_V12_CONTROLLER_MODE=plan-lane \
            UCHIRIMO_V12_PARENT_PLAN=artifacts/uchirimo-v12-parent-plan/all-partitions.json \
            UCHIRIMO_V12_STATE=artifacts/uchirimo-v12-split-controller/controller-state.json \
            UCHIRIMO_V12_UNITS=artifacts/uchirimo-v12-split-controller/recovery-units.json \
            UCHIRIMO_V12_CONTROLLER_OUT=artifacts/uchirimo-v12-split-controller \
            UCHIRIMO_SELECTOR_PLAN_LANE_INDEX=$lane \
            node scripts/governance/uchirimo-v11-recovery-controller-runner.mjs
          done

          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const units=JSON.parse(readFileSync('artifacts/uchirimo-v12-split-controller/recovery-units.json','utf8')).units;
          const unit=Object.values(units)[0];
          if(!unit||unit.execution_class!=='HEAVY')throw new Error('UCHIRIMO_V12_SPLIT_FIXTURE_ROOT_NOT_HEAVY');
          const report={
            schema_version:'2.0.0',
            exact_head:process.env.HEAD_SHA,
            batch_id:'fixture-heavy-timeout',
            evidence_artifact_identity:'fixture-heavy-artifact',
            item_count:1,
            pass_count:0,
            fail_count:1,
            child_timeout_ms:3000000,
            results:[{
              shard:unit.parent_shard_index,
              partition_key:unit.parent_partition_key,
              parent_shard_index:unit.parent_shard_index,
              parent_partition_key:unit.parent_partition_key,
              recovery_unit_id:unit.recovery_unit_id,
              recovery_depth:0,
              parent_recovery_unit_id:null,
              decision_constraints_sha256:unit.decision_constraints_sha256,
              status:'FAIL',
              timed_out:true,
              exit_code:null,
              signal:'SIGTERM',
              runner:'fixture',
              constraint_count:0,
              started_at:'2026-09-27T00:00:00.000Z',
              completed_at:'2026-09-27T00:50:00.000Z'
            }],
            status:'FAIL'
          };
          writeFileSync('artifacts/uchirimo-v12-split-execution/batch-fixture-heavy-timeout-report.json',JSON.stringify(report,null,2)+'\n');
          NODE

          UCHIRIMO_V12_CONTROLLER_MODE=advance \
          UCHIRIMO_V12_PARENT_PLAN=artifacts/uchirimo-v12-parent-plan/all-partitions.json \
          UCHIRIMO_V12_STATE=artifacts/uchirimo-v12-split-controller/controller-state.json \
          UCHIRIMO_V12_UNITS=artifacts/uchirimo-v12-split-controller/recovery-units.json \
          UCHIRIMO_V12_CERTIFICATES=artifacts/uchirimo-v12-split-controller/split-certificates.json \
          UCHIRIMO_V12_PARENT_STATUS=artifacts/uchirimo-v12-split-controller/parent-status.json \
          UCHIRIMO_V12_EXECUTION_INPUT=artifacts/uchirimo-v12-split-execution \
          UCHIRIMO_V12_PLAN_SUMMARY_INPUT=artifacts/uchirimo-v12-split-controller \
          UCHIRIMO_V12_CONTROLLER_OUT=artifacts/uchirimo-v12-split-advance \
          node scripts/governance/uchirimo-v11-recovery-controller-runner.mjs

          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const candidate=JSON.parse(readFileSync('artifacts/uchirimo-v12-split-fixture/candidate.json','utf8'));
          const state=JSON.parse(readFileSync('artifacts/uchirimo-v12-split-advance/controller-state.json','utf8'));
          const units=JSON.parse(readFileSync('artifacts/uchirimo-v12-split-advance/recovery-units.json','utf8')).units;
          const certs=JSON.parse(readFileSync('artifacts/uchirimo-v12-split-advance/split-certificates.json','utf8')).certificates;
          const root=Object.values(units).find((unit)=>unit.recovery_depth===0);
          if(!root||root.state!=='PENDING_CHILDREN')throw new Error('UCHIRIMO_V12_SPLIT_ROOT_STATE_INVALID:'+String(root?.state));
          const cert=certs[root.recovery_unit_id];
          if(!cert)throw new Error('UCHIRIMO_V12_SPLIT_CERTIFICATE_MISSING');
          if(cert.split_field_key!==candidate.expected_split_field)throw new Error('UCHIRIMO_V12_SPLIT_FIELD_DRIFT:'+cert.split_field_key+':'+candidate.expected_split_field);
          if(cert.children.length!==candidate.expected_domain_count)throw new Error('UCHIRIMO_V12_SPLIT_DOMAIN_COUNT_DRIFT:'+cert.children.length+':'+candidate.expected_domain_count);
          const children=cert.children.map((child)=>units[child.recovery_unit_id]);
          if(children.some((child)=>!child||child.state!=='PENDING_NORMAL'||child.execution_class!=='NORMAL'))throw new Error('UCHIRIMO_V12_SPLIT_CHILD_STATE_INVALID');
          if(state.next_action!=='DISPATCH_NEXT_GENERATION')throw new Error('UCHIRIMO_V12_SPLIT_NEXT_ACTION_INVALID:'+state.next_action);
          if(state.closed_parent_count!==3955||state.open_parent_count!==1)throw new Error('UCHIRIMO_V12_SPLIT_PARENT_COUNT_INVALID');
          console.log('UCHIRIMO_V12_RUNTIME_SPLIT=PASS field='+cert.split_field_key+' children='+cert.children.length+' next='+state.next_action);
          NODE

      - name: Exercise next generation and recovery-tree parent closure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/uchirimo-v12-gen1 artifacts/uchirimo-v12-gen1-execution artifacts/uchirimo-v12-gen1-advance
          mkdir -p artifacts/uchirimo-v12-gen1 artifacts/uchirimo-v12-gen1-execution artifacts/uchirimo-v12-gen1-advance

          UCHIRIMO_V12_CONTROLLER_MODE=resume-generation \
          UCHIRIMO_V12_GENERATION=1 \
          UCHIRIMO_V12_SOURCE_CONTROLLER_RUN_ID=999 \
          UCHIRIMO_V12_STATE=artifacts/uchirimo-v12-split-advance/controller-state.json \
          UCHIRIMO_V12_UNITS=artifacts/uchirimo-v12-split-advance/recovery-units.json \
          UCHIRIMO_V12_CERTIFICATES=artifacts/uchirimo-v12-split-advance/split-certificates.json \
          UCHIRIMO_V12_PARENT_STATUS=artifacts/uchirimo-v12-split-advance/parent-status.json \
          UCHIRIMO_V12_CONTROLLER_OUT=artifacts/uchirimo-v12-gen1 \
          node scripts/governance/uchirimo-v11-recovery-controller-runner.mjs

          for lane in $(seq 0 15); do
            GITHUB_OUTPUT='' \
            UCHIRIMO_V12_CONTROLLER_MODE=plan-lane \
            UCHIRIMO_V12_GENERATION=1 \
            UCHIRIMO_V12_PARENT_PLAN=artifacts/uchirimo-v12-parent-plan/all-partitions.json \
            UCHIRIMO_V12_STATE=artifacts/uchirimo-v12-gen1/controller-state.json \
            UCHIRIMO_V12_UNITS=artifacts/uchirimo-v12-gen1/recovery-units.json \
            UCHIRIMO_V12_CONTROLLER_OUT=artifacts/uchirimo-v12-gen1 \
            UCHIRIMO_SELECTOR_PLAN_LANE_INDEX=$lane \
            node scripts/governance/uchirimo-v11-recovery-controller-runner.mjs
          done

          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {recoveryEvidenceNames} from './scripts/governance/uchirimo-v11-recovery-controller.mjs';
          const state=JSON.parse(readFileSync('artifacts/uchirimo-v12-gen1/controller-state.json','utf8'));
          const units=JSON.parse(readFileSync('artifacts/uchirimo-v12-gen1/recovery-units.json','utf8')).units;
          const pending=Object.values(units).filter((unit)=>['PENDING_NORMAL','PENDING_HEAVY'].includes(unit.state));
          if(!pending.length)throw new Error('UCHIRIMO_V12_FULL_CYCLE_CHILDREN_MISSING');
          let scheduled=[];
          let deferred=0;
          for(let lane=0;lane<16;lane+=1){
            const summary=JSON.parse(readFileSync('artifacts/uchirimo-v12-gen1/lane-'+lane+'-plan.json','utf8'));
            scheduled.push(...summary.scheduled_recovery_unit_ids);
            deferred+=summary.deferred_unit_count;
          }
          scheduled=[...new Set(scheduled)];
          if(deferred!==0)throw new Error('UCHIRIMO_V12_FULL_CYCLE_UNEXPECTED_DEFERRED:'+deferred);
          if(scheduled.length!==pending.length)throw new Error('UCHIRIMO_V12_FULL_CYCLE_SCHEDULE_GAP:'+scheduled.length+':'+pending.length);
          const results=[];
          for(const unitId of scheduled.sort()){
            const unit=units[unitId];
            const names=recoveryEvidenceNames(unit);
            const caseLine=JSON.stringify({case_id:'fixture-'+unitId.slice(0,12),terminal_sha256:createHash('sha256').update(unitId).digest('hex')})+'\n';
            const casePath='artifacts/uchirimo-v12-gen1-execution/'+names.terminal_digests;
            writeFileSync(casePath,caseLine);
            const caseSha=createHash('sha256').update(Buffer.from(caseLine)).digest('hex');
            const proof={
              schema_version:'2.0.0',
              exact_head:process.env.HEAD_SHA,
              task_classification:'NON-PRODUCT-MASTER',
              product_master_mutation:0,
              proof_model:'UCHIRIMO_REACHABLE_DISCRETE_SELECTOR_EXPLICIT_CONSTRAINT_SHARD_V2',
              shard_index:unit.parent_shard_index,
              parent_shard_index:unit.parent_shard_index,
              node_id:'FIXTURE',
              partition_key:unit.parent_partition_key,
              parent_partition_key:unit.parent_partition_key,
              recovery_unit_id:unit.recovery_unit_id,
              recovery_depth:unit.recovery_depth,
              parent_recovery_unit_id:unit.parent_recovery_unit_id,
              decision_constraints:unit.decision_constraints,
              decision_constraints_sha256:unit.decision_constraints_sha256,
              glass_family:'fixture',
              seed:{fixture:true},
              shard_count:3956,
              run_attempt:1,
              window_type:'fixture',
              runtime_manifest_sha256:state.runtime_manifest_sha256,
              runtime_integrity_match:true,
              terminal_context_count:1,
              visited_state_count:1,
              transition_check_count:1,
              dependency_rejection_count:0,
              constraint_rejection_count:0,
              downstream_clear_event_count:0,
              flow_signature_count:1,
              flow_signature_sha256s:[createHash('sha256').update('flow-'+unitId).digest('hex')],
              continuous_dimension_coverage_delegated_to:'CUSTOM_SIZE_COVERAGE_GATE',
              unverified_discrete_selector_case_count:0,
              case_artifact:names.terminal_digests,
              case_artifact_format:'UCHIRIMO_TERMINAL_DIGEST_JSONL_V1',
              case_artifact_sha256:caseSha,
              max_stack_depth:1,
              observed_peak_heap_mb:1,
              resolver_cache_size:1,
              resolver_cache_limit:4096,
              resolver_cache_hits:0,
              resolver_cache_misses:1,
              status:'PASS'
            };
            writeFileSync('artifacts/uchirimo-v12-gen1-execution/'+names.report,JSON.stringify(proof,null,2)+'\n');
            results.push({
              shard:unit.parent_shard_index,
              partition_key:unit.parent_partition_key,
              parent_shard_index:unit.parent_shard_index,
              parent_partition_key:unit.parent_partition_key,
              recovery_unit_id:unit.recovery_unit_id,
              recovery_depth:unit.recovery_depth,
              parent_recovery_unit_id:unit.parent_recovery_unit_id,
              decision_constraints_sha256:unit.decision_constraints_sha256,
              status:'PASS',
              timed_out:false,
              exit_code:0,
              signal:null,
              runner:'fixture',
              constraint_count:unit.decision_constraints.length,
              started_at:'2026-09-27T01:00:00.000Z',
              completed_at:'2026-09-27T01:00:01.000Z'
            });
          }
          const batch={
            schema_version:'2.0.0',
            exact_head:process.env.HEAD_SHA,
            batch_id:'fixture-child-pass',
            evidence_artifact_identity:'fixture-child-artifact',
            item_count:results.length,
            pass_count:results.length,
            fail_count:0,
            child_timeout_ms:1080000,
            results,
            status:'PASS'
          };
