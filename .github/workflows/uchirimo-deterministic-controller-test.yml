            const caseBytes=Buffer.from(JSON.stringify({case_id:'carry-'+row.shard,terminal_sha256:sha(Buffer.from(row.partition_key))})+'\n');
            const caseSha=sha(caseBytes);
            writeFileSync('artifacts/uchirimo-v12-finalizer-carry/'+caseName,caseBytes);
            const flowSha=sha(Buffer.from('flow-'+row.partition_key));
            const report={
              schema_version:'2.0.0',
              exact_head:process.env.HEAD_SHA,
              task_classification:'NON-PRODUCT-MASTER',
              product_master_mutation:0,
              proof_model:'UCHIRIMO_REACHABLE_DISCRETE_SELECTOR_EXHAUSTIVE_SYMBOLIC_SHARD_V11',
              shard_index:row.shard,
              node_id:row.node_id,
              partition_key:row.partition_key,
              partition_seed:stable(JSON.parse(row.partition_seed_json??'{}')),
              glass_family:row.glass_family,
              seed:seedFor(row),
              shard_count:3956,
              run_attempt:1,
              window_type:row.window_type,
              runtime_manifest_sha256:state.runtime_manifest_sha256,
              runtime_integrity_match:true,
              terminal_context_count:1,
              terminal_equivalence_class_count:1,
              visited_state_count:1,
              transition_check_count:1,
              dependency_rejection_count:0,
              downstream_clear_event_count:0,
              flow_signature_count:1,
              flow_signature_sha256s:[flowSha],
              continuous_dimension_coverage_delegated_to:'CUSTOM_SIZE_COVERAGE_GATE',
              unverified_discrete_selector_case_count:0,
              case_artifact:caseName,
              case_artifact_format:'UCHIRIMO_TERMINAL_DIGEST_JSONL_V1',
              case_artifact_sha256:caseSha,
              max_stack_depth:1,
              observed_peak_heap_mb:1,
              resolver_cache_limit:4096,
              resolver_cache_hits:0,
              resolver_cache_misses:1,
              evidence_origin:'CURRENT_HEAD_CARRY_FORWARD',
              source_exact_head:process.env.HEAD_SHA,
              source_run_id:1,
              source_artifact_identity:'fixture-carry',
              current_head_binding:{status:'PASS',current_exact_head:process.env.HEAD_SHA,source_exact_head:process.env.HEAD_SHA,partition_key:row.partition_key},
              status:'PASS'
            };
            writeFileSync('artifacts/uchirimo-v12-finalizer-carry/shard-'+row.shard+'-report.json',JSON.stringify(report,null,2)+'\n');
          }
          for(const name of readdirSync('artifacts/uchirimo-v12-gen1-execution')){
            if(/^unit-.+-(?:report\.json|terminal-digests\.jsonl)$/.test(name)){
              copyFileSync('artifacts/uchirimo-v12-gen1-execution/'+name,'artifacts/uchirimo-v12-finalizer-local/fixture-child-artifact/'+name);
            }
          }
