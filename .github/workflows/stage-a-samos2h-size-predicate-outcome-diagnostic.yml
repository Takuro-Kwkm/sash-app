name: Stage A Samos2H Size Predicate Outcome Diagnostic V6.2

on:
  workflow_call:
    inputs:
      controller_head:
        required: true
        type: string

permissions:
  issues: read
  contents: read

jobs:
  governance-authority:
    uses: ./.github/workflows/governance-authorization.yml
    with:
      controller_head: ${{ inputs.controller_head }}
      release: false

  diagnose:
    needs: ["governance-authority"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && (true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      STAGE_A_TARGET_WINDOWS: WT-S2H-MENKOSHI-HIKI,WT-S2H-SHUTTER-HIKI,WT-S2H-HIKICHIGAI
      STAGE_A_SAMOS_PREDICATE_OUT: artifacts/stage-a-samos2h-size-predicate-outcome
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact SHA gate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA"
          echo "EXACT_HEAD_GATE=PASS sha=$actual"
      - name: Derive predicate-outcome size partitions
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stage-a-samos2h-size-predicate-outcome-diagnostic.mjs
          node scripts/stage-a-samos2h-size-predicate-outcome-diagnostic.mjs
      - name: Validate V6.2 diagnostic invariants
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report=JSON.parse(readFileSync('artifacts/stage-a-samos2h-size-predicate-outcome/report.json','utf8'));
          if(report.exact_head_sha!==process.env.HEAD_SHA)throw new Error('exact head mismatch');
          if(report.proof_role!=='SAMOS2H_SIZE_PREDICATE_OUTCOME_DIAGNOSTIC_V6_2')throw new Error(`unexpected proof role ${report.proof_role}`);
          if(JSON.stringify(report.metadata_keys)!==JSON.stringify(['actualH','actualW','windowClass']))throw new Error(`unexpected metadata keys ${JSON.stringify(report.metadata_keys)}`);
          if(!Number.isInteger(report.atomic_predicate_count)||report.atomic_predicate_count<=0)throw new Error('atomic predicate set missing');
          if(!report.atomic_predicate_digest)throw new Error('atomic predicate digest missing');
          if(report.windows?.length!==3)throw new Error('expected three target windows');
          for(const row of report.windows){
            if(row.logical_size_count<=0)throw new Error(`no logical sizes ${row.window_type}`);
            if(row.predicate_outcome_class_count<=0)throw new Error(`no predicate classes ${row.window_type}`);
            if(row.partition_weight_total!==row.logical_size_count)throw new Error(`weight mismatch ${row.window_type}`);
            if(row.predicate_outcome_class_count>row.logical_size_count)throw new Error(`class cardinality invalid ${row.window_type}`);
            console.log(`V6_2_PREDICATE_PARTITION_GATE=PASS window=${row.window_type} logical=${row.logical_size_count} classes=${row.predicate_outcome_class_count} compression=${row.compression_ratio}`);
          }
          console.log(`ATOMIC_PREDICATE_COUNT=${report.atomic_predicate_count}`);
          console.log(`ATOMIC_PREDICATE_DIGEST=${report.atomic_predicate_digest}`);
          console.log('DIAGNOSTIC_ONLY=true');
          console.log('APP_INTEGRATION_READY=false');
          console.log('RELEASE_INPUT_GATE=BLOCKED');
          NODE
      - name: Upload V6.2 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-samos2h-size-predicate-outcome-v6-2
          path: artifacts/stage-a-samos2h-size-predicate-outcome/report.json
          if-no-files-found: error
