name: Stage A Samos2H V6.2 17-Window Exact Expansion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage-a-samos2h-v6-2-17-window-expansion.yml'
      - 'scripts/stage-a-samos2h-size-predicate-outcome-projection-v6-2.mjs'
      - 'scripts/stage-a-samos-conflict-graph-v4.mjs'
      - 'src/catalog/selector.mjs'
      - 'src/catalog/selector-ops.mjs'
      - 'src/catalog/runtime-master/product-module-runtime-adapter.mjs'
      - 'src/catalog/runtime-master/runtime-app-bridge.mjs'
      - 'src/catalog/runtime-master/**'
      - 'src/catalog/runtime-master-packages/lixil-samos2h-*/**'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      windows: ${{ steps.inventory.outputs.windows }}
      inventory_digest: ${{ steps.inventory.outputs.inventory_digest }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact SHA gate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA"
          echo "EXACT_HEAD_GATE=PASS sha=$actual"
      - id: inventory
        name: Resolve canonical Samos2H 17-window inventory
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync,mkdirSync,writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { resolveRuntimeAppProduct } from './src/catalog/runtime-master/runtime-app-bridge.mjs';
          const root=await resolveRuntimeAppProduct('SER-LIX-SAMOS2H',{});
          if(root.runtimeMaster?.sourcePackageIntegrity?.match!==true)throw new Error('canonical Runtime integrity mismatch');
          const field=(root.fields??[]).find((f)=>f.key==='window_type');
          if(!field)throw new Error('window_type field missing');
          const windows=(field.values??[]).filter((c)=>c.disabled!==true).map((c)=>String(c.value));
          if(windows.length!==17)throw new Error(`Samos2H BASE_WINDOW_COUNT mismatch: ${windows.length} != 17`);
          if(new Set(windows).size!==17)throw new Error('duplicate Samos2H window ids');
          const digest=createHash('sha256').update(JSON.stringify(windows)).digest('hex');
          mkdirSync('artifacts/stage-a-samos2h-v6-2-inventory',{recursive:true});
          writeFileSync('artifacts/stage-a-samos2h-v6-2-inventory/report.json',JSON.stringify({exact_head_sha:process.env.HEAD_SHA,product_id:'SER-LIX-SAMOS2H',series:'サーモスⅡ-H',base_window_count:windows.length,windows,inventory_digest:digest},null,2)+'\n');
          appendFileSync(process.env.GITHUB_OUTPUT,`windows=${JSON.stringify(windows)}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT,`inventory_digest=${digest}\n`);
          console.log(`SAMOS2H_BASE_WINDOW_COUNT=${windows.length}`);
          console.log(`SAMOS2H_WINDOW_INVENTORY=${JSON.stringify(windows)}`);
          console.log(`SAMOS2H_WINDOW_INVENTORY_DIGEST=${digest}`);
          NODE
      - name: Upload canonical window inventory
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-samos2h-v6-2-window-inventory
          path: artifacts/stage-a-samos2h-v6-2-inventory/report.json
          if-no-files-found: error

  count:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        window_type: ${{ fromJSON(needs.inventory.outputs.windows) }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      STAGE_A_TARGET_WINDOWS: ${{ matrix.window_type }}
      STAGE_A_MAX_MEMO_STATES_PER_WINDOW: 12000
      STAGE_A_MAX_RESOLVER_CALLS_PER_WINDOW: 80000
      STAGE_A_MAX_EXPLICIT_MULTI_ENUM_VALUES: 18
      STAGE_A_SAMOS_V62_OUT: artifacts/stage-a-samos2h-v6-2-expansion/${{ matrix.window_type }}
      EXPECTED_PREDICATE_DIGEST: d0be2ffb5d9c028f3751e8627fd6f07f108f27b08a9b0ff41ff4e39a7d4d1cf2
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact SHA gate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA"
          echo "EXACT_HEAD_GATE=PASS sha=$actual window=$STAGE_A_TARGET_WINDOWS"
      - name: Run V6.2 exact count
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stage-a-samos2h-size-predicate-outcome-projection-v6-2.mjs
          node scripts/stage-a-samos2h-size-predicate-outcome-projection-v6-2.mjs
      - name: Validate per-window exact evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const path=`artifacts/stage-a-samos2h-v6-2-expansion/${process.env.STAGE_A_TARGET_WINDOWS}/report.json`;
          const report=JSON.parse(readFileSync(path,'utf8'));
          if(report.exact_head_sha!==process.env.HEAD_SHA)throw new Error('exact head mismatch');
          if(report.windows?.length!==1)throw new Error('expected one window row');
          const row=report.windows[0];
          if(row.window_type!==process.env.STAGE_A_TARGET_WINDOWS)throw new Error('window identity mismatch');
          if(row.proof_model_version!=='RUNTIME_UI_SYMBOLIC_FULL_COVERAGE_V1')throw new Error(`unexpected proof model ${row.proof_model_version}`);
          if(row.count_model_version!=='SAMOS2H_RESOLVER_CONTRACT_SIZE_PREDICATE_OUTCOME_PROJECTION_V6_2')throw new Error(`unexpected count model ${row.count_model_version}`);
          if(row.status!=='COUNTED_CANDIDATE'||row.blocker)throw new Error(`V6.2 blocked: ${JSON.stringify(row.blocker)}`);
          const audit=row.size_projection_audit??{};
          if(audit.direct_downstream_refs?.length||audit.nested_rule_set_refs?.length)throw new Error(`unsupported direct size refs: ${JSON.stringify(audit)}`);
          if(audit.predicate_digest!==process.env.EXPECTED_PREDICATE_DIGEST)throw new Error(`predicate digest changed ${audit.predicate_digest}`);
          if((audit.predicates??[]).length!==4)throw new Error(`unexpected predicate count ${(audit.predicates??[]).length}`);
          if(!row.exact_discrete_terminal_context_count)throw new Error('terminal exact count missing');
          if(row.custom_pending_context_count===null||row.custom_pending_context_count===undefined)throw new Error('custom pending count missing');
          if(!row.size_projection_digest)throw new Error('projection digest missing');
          if(row.window_type==='WT-S2H-MENKOSHI-HIKI'){
            if(row.exact_discrete_terminal_context_count!=='96043843584'||row.custom_pending_context_count!=='1276674048')throw new Error('known control equivalence mismatch');
          }
          if(row.window_type==='WT-S2H-SHUTTER-HIKI'){
            if(row.exact_discrete_terminal_context_count!=='2648489066496'||row.custom_pending_context_count!=='13617856512')throw new Error('pilot heavy equivalence mismatch');
          }
          console.log(`SAMOS2H_V6_2_WINDOW_GATE=PASS window=${row.window_type} terminal=${row.exact_discrete_terminal_context_count} custom=${row.custom_pending_context_count} memo=${row.memo_state_count} calls=${row.resolver_call_count} classes=${row.size_projection_class_count}`);
          console.log('APP_INTEGRATION_READY=false');
          console.log('RELEASE_INPUT_GATE=BLOCKED');
          NODE
      - name: Upload per-window exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-samos2h-v6-2-window-${{ matrix.window_type }}
          path: artifacts/stage-a-samos2h-v6-2-expansion/${{ matrix.window_type }}/report.json
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: [inventory,count]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_INVENTORY_DIGEST: ${{ needs.inventory.outputs.inventory_digest }}
      EXPECTED_PREDICATE_DIGEST: d0be2ffb5d9c028f3751e8627fd6f07f108f27b08a9b0ff41ff4e39a7d4d1cf2
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage-a-samos2h-v6-2-window-*
          path: artifacts/collected
      - name: Aggregate all 17 exact counts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readdirSync,readFileSync,statSync,mkdirSync,writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const files=[];const walk=(dir)=>{for(const name of readdirSync(dir)){const p=join(dir,name);if(statSync(p).isDirectory())walk(p);else if(name==='report.json')files.push(p);}};walk('artifacts/collected');
          const rows=[];
          for(const p of files){
            const report=JSON.parse(readFileSync(p,'utf8'));
            if(report.exact_head_sha!==process.env.HEAD_SHA)throw new Error(`head mismatch ${p}`);
            if(report.windows?.length===1)rows.push(report.windows[0]);
          }
          rows.sort((a,b)=>String(a.window_type).localeCompare(String(b.window_type)));
          const ids=rows.map((r)=>r.window_type);
          if(rows.length!==17)throw new Error(`report count ${rows.length} != 17`);
          if(new Set(ids).size!==17)throw new Error('duplicate window reports');
          for(const row of rows){
            if(row.status!=='COUNTED_CANDIDATE'||row.blocker)throw new Error(`blocked window ${row.window_type}`);
            if(row.proof_model_version!=='RUNTIME_UI_SYMBOLIC_FULL_COVERAGE_V1')throw new Error(`proof model mismatch ${row.window_type}`);
            if(row.count_model_version!=='SAMOS2H_RESOLVER_CONTRACT_SIZE_PREDICATE_OUTCOME_PROJECTION_V6_2')throw new Error(`count model mismatch ${row.window_type}`);
            if(row.size_projection_audit?.predicate_digest!==process.env.EXPECTED_PREDICATE_DIGEST)throw new Error(`predicate digest mismatch ${row.window_type}`);
          }
          const terminal=rows.reduce((sum,row)=>sum+BigInt(row.exact_discrete_terminal_context_count),0n);
          const custom=rows.reduce((sum,row)=>sum+BigInt(row.custom_pending_context_count),0n);
          const resolverCalls=rows.reduce((sum,row)=>sum+Number(row.resolver_call_count??0),0);
          const memoStates=rows.reduce((sum,row)=>sum+Number(row.memo_state_count??0),0);
          const evidenceDigest=createHash('sha256').update(JSON.stringify(rows.map((r)=>({window:r.window_type,terminal:r.exact_discrete_terminal_context_count,custom:r.custom_pending_context_count,runtime:r.runtime_manifest_sha256,contract:r.contract_digest,shape:r.source_shape_digest,projection:r.size_projection_digest,terminal_proof:r.terminal_proof_digest,status:r.status})))).digest('hex');
          const out={exact_head_sha:process.env.HEAD_SHA,task_classification:'NON-PRODUCT-MASTER',product_master_mutation:0,manufacturer:'LIXIL',series:'サーモスⅡ-H',product_id:'SER-LIX-SAMOS2H',base_window_count:17,verified_window_count:17,unverified_window_count:0,proof_model_version:'RUNTIME_UI_SYMBOLIC_FULL_COVERAGE_V1',count_model_version:'SAMOS2H_RESOLVER_CONTRACT_SIZE_PREDICATE_OUTCOME_PROJECTION_V6_2',predicate_digest:process.env.EXPECTED_PREDICATE_DIGEST,window_inventory_digest:process.env.EXPECTED_INVENTORY_DIGEST,total_exact_discrete_terminal_context_count:terminal.toString(),total_custom_pending_context_count:custom.toString(),total_resolver_call_count:resolverCalls,total_memo_state_count:memoStates,evidence_digest:evidenceDigest,status:'SAMOS2H_V6_2_17_WINDOW_PASS',windows:rows,gate_status:{samos2h_discrete_population_gate:'PASS_CANDIDATE_EXACT_17_OF_17',nontw_discrete_population_gate:'BLOCKED_PENDING_REMAINING_SERIES',custom_size_coverage_gate:'BLOCKED_CONTINUOUS_PARTITION_NOT_PROVEN',full_browser_qa_gate:'NOT_STARTED',app_integration_ready:false,release_input_gate:'BLOCKED'}};
          mkdirSync('artifacts/stage-a-samos2h-v6-2-17-window-summary',{recursive:true});
          writeFileSync('artifacts/stage-a-samos2h-v6-2-17-window-summary/report.json',JSON.stringify(out,null,2)+'\n');
          console.log(`SAMOS2H_V6_2_17_WINDOW_STATUS=${out.status}`);
          console.log(`VERIFIED_WINDOW_COUNT=${out.verified_window_count}`);
          console.log(`UNVERIFIED_WINDOW_COUNT=${out.unverified_window_count}`);
          console.log(`TOTAL_EXACT_DISCRETE_TERMINAL_CONTEXT_COUNT=${out.total_exact_discrete_terminal_context_count}`);
          console.log(`TOTAL_CUSTOM_PENDING_CONTEXT_COUNT=${out.total_custom_pending_context_count}`);
          console.log(`TOTAL_RESOLVER_CALL_COUNT=${out.total_resolver_call_count}`);
          console.log(`EVIDENCE_DIGEST=${out.evidence_digest}`);
          console.log('APP_INTEGRATION_READY=false');
          console.log('RELEASE_INPUT_GATE=BLOCKED');
          NODE
      - name: Upload 17-window aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-samos2h-v6-2-17-window-summary
          path: artifacts/stage-a-samos2h-v6-2-17-window-summary/report.json
          if-no-files-found: error
