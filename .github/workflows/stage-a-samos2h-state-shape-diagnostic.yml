name: Stage A Samos2H State Shape Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage-a-samos2h-state-shape-diagnostic.yml'
      - 'scripts/stage-a-samos2h-state-shape-diagnostic.mjs'
      - 'scripts/stage-a-samos-conflict-graph-v4.mjs'
      - 'src/catalog/runtime-master/**'
      - 'src/catalog/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        window_type:
          - WT-S2H-SHUTTER-HIKI
          - WT-S2H-HIKICHIGAI
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      STAGE_A_TARGET_WINDOWS: ${{ matrix.window_type }}
      STAGE_A_MAX_MEMO_STATES_PER_WINDOW: 3000
      STAGE_A_MAX_RESOLVER_CALLS_PER_WINDOW: 40000
      STAGE_A_MAX_EXPLICIT_MULTI_ENUM_VALUES: 18
      STAGE_A_SAMOS_STATE_SHAPE_OUT: artifacts/stage-a-samos2h-state-shape/${{ matrix.window_type }}
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact SHA gate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA"
          echo "EXACT_HEAD_GATE=PASS sha=$actual window=$STAGE_A_TARGET_WINDOWS"
      - name: Run bounded state-shape diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stage-a-samos2h-state-shape-diagnostic.mjs
          node scripts/stage-a-samos2h-state-shape-diagnostic.mjs
      - name: Summarize state-shape evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const path=`artifacts/stage-a-samos2h-state-shape/${process.env.STAGE_A_TARGET_WINDOWS}/report.json`;
          const report=JSON.parse(readFileSync(path,'utf8'));
          if(report.exact_head_sha!==process.env.HEAD_SHA)throw new Error('exact head mismatch');
          if(report.windows?.length!==1)throw new Error('expected one diagnostic row');
          const row=report.windows[0];
          const fields=Object.entries(row.field_diagnostics??{}).map(([key,v])=>({key,...v,growth_score:Number(v.visits??0)*Math.max(0,Number(v.branch_avg??0)-1)})).sort((a,b)=>b.growth_score-a.growth_score||b.visits-a.visits);
          console.log(`STATE_SHAPE_STATUS=${row.status}`);
          console.log(`BLOCKER=${JSON.stringify(row.blocker)}`);
          console.log(`MEMO_STATE_COUNT=${row.memo_state_count}`);
          console.log(`MEMO_HIT_COUNT=${row.memo_hit_count}`);
          console.log(`RESOLVER_CALL_COUNT=${row.resolver_call_count}`);
          console.log(`MAX_DEPTH=${row.max_depth}`);
          console.log(`TOP_FIELD_DIAGNOSTICS=${JSON.stringify(fields.slice(0,12))}`);
          console.log('DIAGNOSTIC_ONLY=true');
          console.log('APP_INTEGRATION_READY=false');
          console.log('RELEASE_INPUT_GATE=BLOCKED');
          NODE
      - name: Upload state-shape evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-samos2h-state-shape-${{ matrix.window_type }}
          path: artifacts/stage-a-samos2h-state-shape/${{ matrix.window_type }}/report.json
          if-no-files-found: warn
