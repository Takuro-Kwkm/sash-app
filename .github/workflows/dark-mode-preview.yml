name: Dark Mode Preview Verification

on:
  push:
    branches: [feat/dark-mode-ui-20260930]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_AkuHacuJlCl8LuvaFpCzFmbv
      VERCEL_PROJECT_ID: prj_4z0zqW6yKyPuFINODfGX8LPBuJRP
      VERCEL_PROJECT_NAME: sash-app-wave3-preview
      VERCEL_DEPLOY_SOURCE: files
      RELEASE_SERIES: APP_DARK_MODE_UI
      RELEASE_PACKAGE_VERSION: dark-mode-preview-20260930
      QA_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local app
        shell: bash
        run: |
          set -euo pipefail
          npm run start:qa > /tmp/sash-theme-server.log 2>&1 &
          echo $! > /tmp/sash-theme-server.pid
          for i in {1..60}; do
            if curl -fsS "$QA_BASE_URL/api/health" >/dev/null; then
              echo 'LOCAL_APP_GATE=PASS'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sash-theme-server.log
          exit 1

      - name: Dark theme browser QA
        run: node test/browser/theme-browser-qa.mjs

      - name: Prepare Vercel credential
        env:
          VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          if [[ -z "$token" ]]; then echo 'VERCEL_CREDENTIAL_GATE=BLOCKED'; exit 42; fi
          echo "VERCEL_TOKEN_EFFECTIVE=$token" >> "$GITHUB_ENV"

      - name: Deploy exact HEAD to Preview
        run: node scripts/vercel-rest-deploy.mjs preview artifacts/theme-browser-qa/deployment.json

      - name: Verify Preview identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('artifacts/theme-browser-qa/deployment.json','utf8'));
          if(d.readyState!=='READY'||d.githubSha!==process.env.GITHUB_SHA||d.releaseCommitSha!==process.env.GITHUB_SHA||d.mode!=='preview')throw new Error('DARK_MODE_PREVIEW_IDENTITY_INVALID');
          console.log('DARK_MODE_PREVIEW_GATE=PASS '+d.deploymentUrl);
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-mode-preview-${{ github.sha }}
          path: |
            artifacts/theme-browser-qa/
            /tmp/sash-theme-server.log
          if-no-files-found: warn
