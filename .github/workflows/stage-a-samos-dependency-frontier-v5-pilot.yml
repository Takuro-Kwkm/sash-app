name: Stage A Samos Dependency Frontier V5 Pilot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage-a-samos-dependency-frontier-v5-pilot.yml'

permissions:
  contents: read

jobs:
  closed-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve V5 evidence and close same-condition retry
        shell: bash
        run: |
          set -euo pipefail
          echo 'V5_PILOT_EVIDENCE_RUN=34927763485'
          echo 'CONTROL_WT-S2H-MENKOSHI-HIKI=TIMEOUT report_not_generated'
          echo 'HEAVY_WT-S2H-SHUTTER-HIKI=TIMEOUT report_not_generated'
          echo 'FIELD_ORDER_MODEL=DEPENDENCY_FRONTIER_MIN_DESCENDANTS_MRV_V1'
          echo 'CONTROL_EQUIVALENCE_GATE=NOT_REACHED'
          echo 'RETRY_AUTHORIZED=false'
          echo 'REOPEN_CONDITION=NEW_SOURCE_DERIVED_BEHAVIOR_PROJECTION_MODEL'
          echo 'APP_INTEGRATION_READY=false'
          echo 'RELEASE_INPUT_GATE=BLOCKED'
