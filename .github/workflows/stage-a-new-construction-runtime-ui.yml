name: Stage A New Construction Runtime UI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/stage-a-exhaustive-selector-state-graph.mjs'
      - '.github/workflows/stage-a-new-construction-runtime-ui.yml'

permissions:
  contents: read

concurrency:
  group: stage-a-exhaustive-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exhaustive_state_graph:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Exact SHA gate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA"
          echo "EXACT_HEAD_GATE=PASS sha=$actual"

      - name: Exhaustive selector-state graph and QA population
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/stage-a-exhaustive-selector-state
          node scripts/stage-a-exhaustive-selector-state-graph.mjs | tee artifacts/stage-a-exhaustive-selector-state/run.log
          node - <<'NODE'
          const s=require('./artifacts/stage-a-exhaustive-selector-state/summary.json');
          if(s.base_window_count!==105) throw new Error(`BASE_WINDOW_COUNT=${s.base_window_count}`);
          if(s.required_state_count!==s.generated_state_count) throw new Error('Required State != Generated State');
          if(s.required_qa_case_count!==s.generated_qa_case_count || s.generated_qa_case_count!==s.qa_case_count) throw new Error('QA population mismatch');
          if(s.unexpanded_branch_count!==0) throw new Error(`unexpanded branches=${s.unexpanded_branch_count}`);
          if(s.dead_end_state_count!==0) throw new Error(`dead ends=${s.dead_end_state_count}`);
          if(s.technical_leak_count!==0) throw new Error(`technical leaks=${s.technical_leak_count}`);
          if(s.exhaustive_state_graph_gate!=='PASS'||s.qa_population_gate!=='PASS') throw new Error(`gates=${s.exhaustive_state_graph_gate}/${s.qa_population_gate}`);
          console.log(`EXHAUSTIVE_STATE_GRAPH_GATE=PASS states=${s.total_state_count} terminal=${s.terminal_state_count} pruned=${s.invalid_pruned_state_count}`);
          console.log(`QA_POPULATION_GATE=PASS cases=${s.qa_case_count}`);
          NODE

      - name: Determinism replay
        shell: bash
        run: |
          set -euo pipefail
          STAGE_A_EXHAUSTIVE_OUT=/tmp/stage-a-exhaustive-repeat node scripts/stage-a-exhaustive-selector-state-graph.mjs > /tmp/stage-a-exhaustive-repeat.log
          node - <<'NODE'
          const a=require('./artifacts/stage-a-exhaustive-selector-state/summary.json');
          const b=require('/tmp/stage-a-exhaustive-repeat/summary.json');
          const keys=['base_window_count','total_state_count','valid_state_count','invalid_pruned_state_count','terminal_state_count','duplicate_state_count','dead_end_state_count','required_qa_case_count','generated_qa_case_count','qa_case_count','expected_branch_count','attempted_branch_count','determinism_digest'];
          for(const key of keys){ if(JSON.stringify(a[key])!==JSON.stringify(b[key])) throw new Error(`determinism mismatch ${key}: ${a[key]} != ${b[key]}`); }
          console.log(`STATE_GRAPH_DETERMINISM_GATE=PASS digest=${a.determinism_digest}`);
          NODE
          rm -rf /tmp/stage-a-exhaustive-repeat

      - name: Upload exhaustive population evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-exhaustive-selector-state-graph
          path: artifacts/stage-a-exhaustive-selector-state/
          if-no-files-found: warn
