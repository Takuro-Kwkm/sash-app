name: Size Capability Audit v1

on:
  push:
    branches: [main, feat/catalog-recovery-v2]
  pull_request:
    branches: [main]

jobs:
  size_capability_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generic Size Capability Audit core tests
        run: node --test test/24-sash-size-capability-audit.test.mjs test/25-thermosl-cr-sl-036-formal-regeneration.test.mjs test/26-samos2h-custom-formal-regeneration.test.mjs

      - name: Run managed Size Capability Audit
        run: npm run audit:size-capability

      - name: Enforce audit integrity and applied S2H / Thermos L Change Control
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const required=[
            'summary.json','standard-size-audit.json','custom-capability-audit.json','pending.json',
            'dimension-rule-audit-thermosl.json','dimension-rule-audit-apw431.json',
            'dimension-rule-extraction-apw430.json','dimension-rule-extraction-samos2h.json',
            'evidence-samos2h-custom.json','source-manifest.json','gate-report.json'
          ];
          for(const name of required)if(!fs.existsSync(`artifacts/size-capability-audit/${name}`))process.exit(1);
          const gate=JSON.parse(fs.readFileSync('artifacts/size-capability-audit/gate-report.json','utf8'));
          const summary=JSON.parse(fs.readFileSync('artifacts/size-capability-audit/summary.json','utf8'));
          const extraction=JSON.parse(fs.readFileSync('artifacts/size-capability-audit/dimension-rule-extraction-samos2h.json','utf8'));
          const proposal=JSON.parse(fs.readFileSync('data/master-change-control/proposals/PMCP-LIX-SAMOS2H-CUSTOM-DIMENSION-RULESET-20260903-001.manifest.json','utf8'));
          const id='PMCP-LIX-SAMOS2H-CUSTOM-DIMENSION-RULESET-20260903-001';
          const approval=JSON.parse(fs.readFileSync(`data/master-change-control/approvals/${id}.approval.json`,'utf8'));
          const staging=JSON.parse(fs.readFileSync(`data/master-change-control/applied/${id}.staging.json`,'utf8'));
          const prodApproval=JSON.parse(fs.readFileSync(`data/master-change-control/production-approvals/${id}.production-approval.json`,'utf8'));
          const production=JSON.parse(fs.readFileSync(`data/master-change-control/production/${id}.applied.json`,'utf8'));
          const runtime=JSON.parse(fs.readFileSync('data/master-change-control/runtime/SAMOS2H_CUSTOM_RUNTIME_REGENERATION_V10.json','utf8'));
          if(gate.integrityGate!=='PASS'||gate.status!=='PARTIAL_PASS'||gate.blockingPending!==8)process.exit(1);
          if(gate.proposalCount!==0||gate.proposalApprovalGate!=='NO_PROPOSAL_PENDING')process.exit(1);
          if(summary.productMasterChangeProposals.length!==0)process.exit(1);
          if(!summary.appliedProductMasterChangeProposals.includes(id))process.exit(1);
          if(extraction.records.length!==17||extraction.summary.EXACT_RULE_EXTRACTED!==7||extraction.summary.SOURCE_GRAPH_REVIEW_REQUIRED!==10||extraction.summary.PENDING!==0)process.exit(1);
          if(proposal.proposalFingerprint!=='sha256:bd5900002f8d54d322fb7c50bb0b4b121f54a81ece7ec0e60baaffe6914df08e'||proposal.status!=='PROPOSED'||proposal.approvalStatus!=='PENDING')process.exit(1);
          if(approval.approverType!=='HUMAN'||staging.proposalStatus!=='APPLIED'||prodApproval.productionApproval!==true)process.exit(1);
          if(production.status!=='PRODUCTION_APPLY_COMPLETE'||production.postWriteReadback.dimensionRuleCount!==17||production.postWriteReadback.unexpectedChangedExistingSheets!==0)process.exit(1);
          if(production.formalTarget.postWriteSha256!=='7ca8f5cca19187bfb841bc3f3393fb29de591dc554714627faf3a652130cd8a7')process.exit(1);
          if(runtime.status!=='RUNTIME_REGENERATION_COMMITTED'||runtime.runtimeVersion!=='v1.0'||runtime.runtimeProjection.dimensionRuleCount!==17)process.exit(1);
          if(runtime.runtimeProjection.directManufacturerValueEditToGenericCore)process.exit(1);
          NODE

      - name: Enforce Runtime inventory unchanged
        run: |
          npm run start:qa > /tmp/sash-size-audit-runtime.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/api/health > /tmp/size-audit-health.json; then break; fi
            sleep 0.5
          done
          cat /tmp/size-audit-health.json
          node - <<'NODE'
          const h=require('/tmp/size-audit-health.json');
          const expected={
            'SER-LIX-SAMOS2H':2131,
            'SER-LIX-SAMOSL':1495,
            'SER-YKK-APW430':718,
            'SER-YKK-APW431':538
          };
          for(const [id,count] of Object.entries(expected)){
            const row=h.inventory.find((item)=>item.productId===id);
            if(!row||row.selectableSizeRows!==count||row.missingSizeRows!==0||row.extraSizeRows!==0||row.sizeCoverage!==1)process.exit(1);
          }
          NODE

      - name: Ensure audit runner output is committed and deterministic
        run: git diff --exit-code -- artifacts/size-capability-audit/gate-report.json

      - name: Upload Size Capability Audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-capability-audit-v1
          path: |
            artifacts/size-capability-audit
            data/master-change-control/proposals/PMCP-LIX-SAMOS2H-CUSTOM-DIMENSION-RULESET-20260903-001.manifest.json
            data/master-change-control/approvals/PMCP-LIX-SAMOS2H-CUSTOM-DIMENSION-RULESET-20260903-001.approval.json
            data/master-change-control/applied/PMCP-LIX-SAMOS2H-CUSTOM-DIMENSION-RULESET-20260903-001.staging.json
            data/master-change-control/production-approvals/PMCP-LIX-SAMOS2H-CUSTOM-DIMENSION-RULESET-20260903-001.production-approval.json
            data/master-change-control/production-previews/PMCP-LIX-SAMOS2H-CUSTOM-DIMENSION-RULESET-20260903-001.production-preview.json
            data/master-change-control/production/PMCP-LIX-SAMOS2H-CUSTOM-DIMENSION-RULESET-20260903-001.applied.json
            data/master-change-control/runtime/SAMOS2H_CUSTOM_RUNTIME_REGENERATION_V10.json
            data/master-change-control/proposals/PMCP-LIX-SAMOSL-INNER-TILT-RANGE-20260903-001.manifest.json
            data/master-change-control/approvals/PMCP-LIX-SAMOSL-INNER-TILT-RANGE-20260903-001.approval.json
            data/master-change-control/applied/PMCP-LIX-SAMOSL-INNER-TILT-RANGE-20260903-001.staging.json
            data/master-change-control/production-approvals/PMCP-LIX-SAMOSL-INNER-TILT-RANGE-20260903-001.production-approval.json
            data/master-change-control/production-previews/PMCP-LIX-SAMOSL-INNER-TILT-RANGE-20260903-001.production-preview.json
            data/master-change-control/production/PMCP-LIX-SAMOSL-INNER-TILT-RANGE-20260903-001.applied.json
            data/master-change-control/runtime/THERMOSL_CR_SL_036_RUNTIME_REGENERATION_V19.json
            docs/SASH_SIZE_CAPABILITY_AUDIT_V1.md
