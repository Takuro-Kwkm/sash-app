name: Size Capability Audit

on:
  push:
    branches: [main, feat/catalog-recovery-v2]
  pull_request:
    branches: [main]

jobs:
  size_capability_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generic Size Capability Audit tests
        run: node --test test/24-sash-size-capability-audit.test.mjs
      - name: Run Size Capability Audit
        run: npm run audit:size-capability
      - name: Enforce audit integrity and non-mutation boundary
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const required=[
            'summary.json','standard-size-audit.json','custom-capability-audit.json','pending.json',
            'dimension-rule-audit-thermosl.json','dimension-rule-audit-apw431.json',
            'dimension-rule-extraction-apw430.json','dimension-rule-extraction-samos2h.json',
            'source-manifest.json','gate-report.json'
          ];
          for(const name of required)if(!fs.existsSync(`artifacts/size-capability-audit/${name}`))process.exit(1);
          const gate=require('./artifacts/size-capability-audit/gate-report.json');
          if(gate.integrityGate!=='PASS'||gate.status!=='PARTIAL_PASS'||gate.blockingPending!==10||gate.formalMasterWritePerformed||gate.runtimeManufacturerDataWritePerformed||gate.autoMutationPerformed)process.exit(1);
          const proposal=require('./data/master-change-control/proposals/PMCP-LIX-SAMOSL-INNER-TILT-GLASS-GATE-20260903-002.manifest.json');
          if(proposal.status!=='PROPOSED'||proposal.approvalPolicy!=='HUMAN_REQUIRED'||proposal.approvalStatus!=='PENDING'||proposal.formalWorkbookWritePerformed||proposal.runtimeWritePerformed||proposal.autoApprovalPerformed)process.exit(1);
          NODE
      - name: Upload Size Capability Audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-capability-audit-v1
          path: |
            artifacts/size-capability-audit
            data/master-change-control/proposals/PMCP-LIX-SAMOSL-INNER-TILT-GLASS-GATE-20260903-002.manifest.json
            docs/SASH_SIZE_CAPABILITY_AUDIT_V1.md
