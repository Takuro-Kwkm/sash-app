name: Public SaaS Preview

on:
  push:
    branches: [feat/public-saas-foundation-a1]
    paths:
      - 'src/public-saas/**'
      - 'supabase/**'
      - 'api/index.mjs'
      - 'scripts/start-step8-ui.mjs'
      - 'scripts/vercel-rest-deploy.mjs'
      - 'test/75-public-saas-foundation.test.mjs'
      - 'test/76-public-saas-supabase-adapter.test.mjs'
      - 'test/77-public-saas-supabase-work-repositories.test.mjs'
      - 'test/78-public-saas-http-handler.test.mjs'
      - 'test/79-public-saas-ui-safari-event-lifecycle.test.mjs'
      - 'test/80-public-saas-tenant-isolation-e2e-ui.test.mjs'
      - 'test/81-public-saas-security-baseline-migration.test.mjs'
      - 'test/82-public-saas-monitoring-boundary.test.mjs'
      - 'docs/PUBLIC_SAAS_**'
      - '.github/workflows/public-saas-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/public-saas/**'
      - 'supabase/**'
      - 'api/index.mjs'
      - 'scripts/start-step8-ui.mjs'
      - 'scripts/vercel-rest-deploy.mjs'
      - 'test/75-public-saas-foundation.test.mjs'
      - 'test/76-public-saas-supabase-adapter.test.mjs'
      - 'test/77-public-saas-supabase-work-repositories.test.mjs'
      - 'test/78-public-saas-http-handler.test.mjs'
      - 'test/79-public-saas-ui-safari-event-lifecycle.test.mjs'
      - 'test/80-public-saas-tenant-isolation-e2e-ui.test.mjs'
      - 'test/81-public-saas-security-baseline-migration.test.mjs'
      - 'test/82-public-saas-monitoring-boundary.test.mjs'
      - 'docs/PUBLIC_SAAS_**'
      - '.github/workflows/public-saas-preview.yml'

jobs:
  preview:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'feat/public-saas-foundation-a1'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_AkuHacuJlCl8LuvaFpCzFmbv
      VERCEL_PROJECT_ID: prj_4z0zqW6yKyPuFINODfGX8LPBuJRP
      VERCEL_PROJECT_NAME: sash-app-wave3-preview
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      RELEASE_SERIES: PUBLIC_SAAS
      RELEASE_PACKAGE_VERSION: STAGE_A2
      PUBLIC_SAAS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PUBLIC_SAAS_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLIC_SAAS_HEAD_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --ignore-scripts

      - name: Exact HEAD and focused Public SaaS tests
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$PUBLIC_SAAS_HEAD_SHA"
          node --test \
            test/75-public-saas-foundation.test.mjs \
            test/76-public-saas-adapter.test.mjs
