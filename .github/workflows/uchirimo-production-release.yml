name: YKK AP Uchirimo v1.0-P7R1-R2 Staging Browser Smoke

on:
  push:
    branches:
      - release/ykkap-uchirimo-v1.0-p7r1-r2-production-20260909

permissions:
  contents: read

env:
  RELEASE_CANDIDATE_SHA: 92ee5c5c92e8cb6a5227047fa670e220e25fec6c
  EXPECTED_UCHIRIMO_RUNTIME_SHA: be4f1f77727424dc06ddf9de947201f33d4aee5219b182e37d0f178e1fb7147d
  VERCEL_ORG_ID: team_AkuHacuJlCl8LuvaFpCzFmbv
  VERCEL_PROJECT_ID: prj_4z0zqW6yKyPuFINODfGX8LPBuJRP
  PREVIEW_DEPLOYMENT_ID: dpl_F34bGLpRkQZqKt9BJ9nurau7aM3d
  PREVIEW_HOST: sash-app-wave3-preview-7rc62jowp-tk-4bb0.vercel.app
  PREVIEW_URL: https://sash-app-wave3-preview-7rc62jowp-tk-4bb0.vercel.app

jobs:
  staging_smoke:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: 92ee5c5c92e8cb6a5227047fa670e220e25fec6c
          path: rc
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fixed SHA and Preview identity gate
        shell: bash
        working-directory: rc
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_CANDIDATE_SHA"
          token="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          test -n "$token"
          echo "VERCEL_TOKEN_EFFECTIVE=$token" >> "$GITHUB_ENV"
          status="$(curl -sS -o /tmp/deployment.json -w '%{http_code}' -H "Authorization: Bearer $token" "https://api.vercel.com/v13/deployments/$PREVIEW_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
          test "$status" = "200"
          node -e 'const d=require("/tmp/deployment.json"); if(d.readyState!=="READY"||d.target!==null||d.meta?.releaseCommitSha!==process.env.RELEASE_CANDIDATE_SHA||d.meta?.releaseSeries!=="YKK AP ウチリモ 内窓"||d.meta?.releasePackageVersion!=="v1.0-P7R1-R2") { console.error({readyState:d.readyState,target:d.target,releaseCommitSha:d.meta?.releaseCommitSha,series:d.meta?.releaseSeries,version:d.meta?.releasePackageVersion}); process.exit(1); }'
          echo "PREVIEW_IDENTITY_GATE=PASS"

      - name: Install real-browser QA dependencies
        working-directory: rc
        run: |
          npm install --ignore-scripts
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Create temporary protected-Preview share access
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/share.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
            -H 'Content-Type: application/json' \
            "https://api.vercel.com/aliases/$PREVIEW_HOST/protection-bypass?teamId=$VERCEL_ORG_ID" \
            --data '{"ttl":1800}')"
          if [[ "$status" != "200" ]]; then
            echo "PREVIEW_BROWSER_ACCESS_GATE=BLOCKED status=$status"
            node -e 'const r=require("/tmp/share.json"); console.error({error:r.error?.code??r.code??"unknown",message:r.error?.message??r.message??"unknown"})'
            exit 51
          fi
          share="$(node -e 'const r=require("/tmp/share.json"); process.stdout.write(String(r.value??r.protectionBypass?.value??""))')"
          test -n "$share"
          echo "::add-mask::$share"
          echo "VERCEL_SHARE_TOKEN=$share" >> "$GITHUB_ENV"
          echo "PREVIEW_BROWSER_ACCESS_GATE=PASS"

      - name: Patch Uchirimo test harness for protected preflight only
        shell: bash
        working-directory: rc
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/browser/uchirimo-runtime-browser-qa.mjs')
          s=p.read_text()
          old="""  const preflight = await browser.newContext();\n  const response = await preflight.request.get(`${BASE}/api/runtime-master/integrations`);"""
          new="""  const preflight = await browser.newContext();\n  if (SHARE_TOKEN) { const preflightPage = await preflight.newPage(); await preflightPage.goto(`${BASE}/?_vercel_share=${encodeURIComponent(SHARE_TOKEN)}`, { waitUntil:'networkidle' }); await preflightPage.close(); }\n  const response = await preflight.request.get(`${BASE}/api/runtime-master/integrations`);"""
          if old not in s: raise SystemExit('protected-preview preflight patch target not found')
          p.write_text(s.replace(old,new))
          PY

      - name: Staging Uchirimo desktop/mobile Browser Smoke
        working-directory: rc
        env:
          QA_BASE_URL: ${{ env.PREVIEW_URL }}
        run: node test/browser/uchirimo-runtime-browser-qa.mjs

      - name: Staging EW regression Browser Smoke
        working-directory: rc
        env:
          QA_BASE_URL: ${{ env.PREVIEW_URL }}
        run: node test/browser/ew-runtime-browser-qa.mjs

      - name: Staging TW regression Browser Smoke
        working-directory: rc
        env:
          QA_BASE_URL: ${{ env.PREVIEW_URL }}
        run: node test/browser/tw-runtime-browser-qa.mjs

      - name: Staging existing catalog regression Browser Smoke
        working-directory: rc
        env:
          QA_BASE_URL: ${{ env.PREVIEW_URL }}
        run: node test/browser/release-regression-browser-qa.mjs

      - name: Consolidate Staging Smoke evidence
        shell: bash
        working-directory: rc
        run: |
          set -euo pipefail
          mkdir -p artifacts/uchirimo-release-staging
          node - <<'NODE'
          const fs=require('fs');
          const paths={uchirimo:'artifacts/uchirimo-runtime-browser-qa/report.json',ew:'artifacts/ew-runtime-browser-qa/report.json',tw:'artifacts/tw-runtime-browser-qa/report.json',catalog:'artifacts/release-regression-browser-qa/report.json'};
          const r=Object.fromEntries(Object.entries(paths).map(([k,p])=>[k,JSON.parse(fs.readFileSync(p,'utf8'))]));
          if(Object.values(r).some(x=>x.status!=='PASS')) process.exit(1);
          const summary={releaseCandidateSha:process.env.RELEASE_CANDIDATE_SHA,previewDeploymentId:process.env.PREVIEW_DEPLOYMENT_ID,previewUrl:process.env.PREVIEW_URL,browserExecution:'GitHub Actions Playwright Chromium (browser-required fallback; target exact RC Preview)',desktop:r.uchirimo.desktop,mobile:r.uchirimo.mobile,consoleErrorCount:r.uchirimo.consoleErrors.length+r.ew.consoleErrors.length+r.tw.consoleErrors.length+r.catalog.consoleErrors.length,pageErrorCount:r.uchirimo.pageErrors.length+r.ew.pageErrors.length+r.tw.pageErrors.length+r.catalog.pageErrors.length,unexpected4xx5xxCount:r.uchirimo.failedResponses.length+r.ew.failedResponses.length+r.tw.failedResponses.length+r.catalog.failedResponses.length,uchirimo:'PASS',ewRegression:'PASS',twRegression:'PASS',existingCatalogRegression:'PASS',orderReady:false,stagingSmokeGate:'PASS'};
          fs.writeFileSync('artifacts/uchirimo-release-staging/summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          if(summary.consoleErrorCount||summary.pageErrorCount||summary.unexpected4xx5xxCount) process.exit(1);
          NODE
          echo "STAGING_SMOKE_GATE=PASS"
          echo "DEPLOYMENT_READY=TRUE"

      - name: Revoke temporary Preview share access
        if: always()
        shell: bash
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${VERCEL_TOKEN_EFFECTIVE:-}" \
            -H 'Content-Type: application/json' \
            "https://api.vercel.com/aliases/$PREVIEW_HOST/protection-bypass?teamId=$VERCEL_ORG_ID" \
            --data '{"revoke":{}}' >/dev/null || true

      - name: Upload Staging Browser Smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uchirimo-staging-browser-smoke
          path: rc/artifacts/
          if-no-files-found: warn
