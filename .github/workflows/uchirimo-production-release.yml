name: YKK AP Uchirimo v1.0-P7R1-R2 Production Deploy

on:
  push:
    branches:
      - release/ykkap-uchirimo-v1.0-p7r1-r2-production-20260909

permissions:
  contents: read

env:
  RELEASE_CANDIDATE_SHA: 92ee5c5c92e8cb6a5227047fa670e220e25fec6c
  EXPECTED_UCHIRIMO_RUNTIME_SHA: be4f1f77727424dc06ddf9de947201f33d4aee5219b182e37d0f178e1fb7147d
  EXPECTED_MANIFEST_FILE_ID: 1119yamXn21wLZd3C8LvamNWsTAx_1dt2
  VERCEL_ORG_ID: team_AkuHacuJlCl8LuvaFpCzFmbv
  VERCEL_PROJECT_ID: prj_4z0zqW6yKyPuFINODfGX8LPBuJRP
  VERCEL_PROJECT_NAME: sash-app-wave3-preview
  PRODUCTION_URL: https://sash-app-wave3-preview.vercel.app
  RELEASE_SERIES: YKK AP ウチリモ 内窓
  RELEASE_PACKAGE_VERSION: v1.0-P7R1-R2
  ROLLBACK_DEPLOYMENT_ID: dpl_3rJDZtmuhRdnafYj1rrPF7oPaaXd
  ROLLBACK_COMMIT_SHA: 1d4438783f07c0affb681954498a0c3e67752c81

jobs:
  production_deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: 92ee5c5c92e8cb6a5227047fa670e220e25fec6c
          path: rc
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Release input and rollback readiness preflight
        shell: bash
        working-directory: rc
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_CANDIDATE_SHA"
          token="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          test -n "$token"
          echo "VERCEL_TOKEN_EFFECTIVE=$token" >> "$GITHUB_ENV"

          status="$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          test "$status" = "200"
          node -e 'const p=require("/tmp/project.json"); if(p.id!==process.env.VERCEL_PROJECT_ID||p.accountId!==process.env.VERCEL_ORG_ID) process.exit(1)'

          status="$(curl -sS -o /tmp/rollback.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "https://api.vercel.com/v13/deployments/$ROLLBACK_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
          test "$status" = "200"
          node -e 'const d=require("/tmp/rollback.json"); if(d.readyState!=="READY"||d.target!=="production"||d.meta?.releaseCommitSha!==process.env.ROLLBACK_COMMIT_SHA) process.exit(1)'
          echo "RELEASE_INPUT_GATE=PASS"
          echo "ROLLBACK_TARGET_PREFLIGHT=PASS"

      - name: Revalidate exact RC build before production
        working-directory: rc
        run: |
          npm install --ignore-scripts
          npm run lint
          npm run typecheck
          npm test
          npm run build:uchirimo-review
          echo "BUILD_GATE=PASS"

      - name: Deploy exact RC to Production
        id: deploy
        shell: bash
        working-directory: rc
        run: |
          set -euo pipefail
          mkdir -p artifacts/uchirimo-release-production
          env -u GITHUB_SHA node scripts/vercel-rest-deploy.mjs production artifacts/uchirimo-release-production/production-deployment.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('artifacts/uchirimo-release-production/production-deployment.json','utf8'));
          if(d.readyState!=='READY'||d.githubSha!==process.env.RELEASE_CANDIDATE_SHA||d.mode!=='production'||d.projectId!==process.env.VERCEL_PROJECT_ID||d.teamId!==process.env.VERCEL_ORG_ID) process.exit(1);
          fs.appendFileSync(process.env.GITHUB_ENV,`PRODUCTION_DEPLOYMENT_ID=${d.deploymentId}\nPRODUCTION_DEPLOYMENT_URL=${d.deploymentUrl}\n`);
          console.log(JSON.stringify({deploymentId:d.deploymentId,deploymentUrl:d.deploymentUrl,readyState:d.readyState,githubSha:d.githubSha,mode:d.mode,fileCount:d.fileCount,totalBytes:d.totalBytes},null,2));
          NODE

      - name: Verify Production deployment identity via Vercel API
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/prod.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
            "https://api.vercel.com/v13/deployments/$PRODUCTION_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
          test "$status" = "200"
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/prod.json','utf8'));
          const ok=d.readyState==='READY' && d.target==='production' && d.meta?.releaseCommitSha===process.env.RELEASE_CANDIDATE_SHA && d.meta?.releaseSeries===process.env.RELEASE_SERIES && d.meta?.releasePackageVersion===process.env.RELEASE_PACKAGE_VERSION && d.meta?.releaseMode==='production';
          if(!ok){console.error({readyState:d.readyState,target:d.target,releaseCommitSha:d.meta?.releaseCommitSha,releaseSeries:d.meta?.releaseSeries,releasePackageVersion:d.meta?.releasePackageVersion,releaseMode:d.meta?.releaseMode});process.exit(1)}
          console.log(JSON.stringify({id:d.id,url:d.url,readyState:d.readyState,target:d.target,releaseCommitSha:d.meta.releaseCommitSha,releaseSeries:d.meta.releaseSeries,releasePackageVersion:d.meta.releasePackageVersion},null,2));
          NODE

      - name: Verify canonical Production URL and Runtime identity
        shell: bash
        working-directory: rc
        run: |
          set -euo pipefail
          ok=0
          for i in {1..30}; do
            if curl -fsS "$PRODUCTION_URL/api/health" -o artifacts/uchirimo-release-production/production-health.json; then
              if node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('artifacts/uchirimo-release-production/production-health.json','utf8'));
          const u=h.runtimeMasterIntegrations?.find(x=>x.id==='SER-YKKAP-UCHIRIMO');
          const ew=h.runtimeMasterIntegrations?.find(x=>x.id==='SER-LIX-EW');
          const tw=h.runtimeMasterIntegrations?.find(x=>x.id==='SER-LIXIL-TW');
          if(!h.ok||!u||u.status!=='READY'||!u.selectable||u.packageVersion!==process.env.RELEASE_PACKAGE_VERSION||u.sourceHash!==process.env.EXPECTED_UCHIRIMO_RUNTIME_SHA||u.canonicalRuntimeReference?.runtimeManifestDriveFileId!==process.env.EXPECTED_MANIFEST_FILE_ID||!ew||!tw) process.exit(1);
          console.log(JSON.stringify({buildId:h.buildId,packageVersion:u.packageVersion,sourceHash:u.sourceHash,runtimeManifestDriveFileId:u.canonicalRuntimeReference.runtimeManifestDriveFileId,ew:ew.status,tw:tw.status},null,2));
          NODE
              then ok=1; break; fi
            fi
            sleep 2
          done
          test "$ok" = "1"
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('artifacts/uchirimo-release-production/production-health.json','utf8'));
          fs.writeFileSync('artifacts/uchirimo-release-production/deploy-gate-summary.json',JSON.stringify({releaseCandidateSha:process.env.RELEASE_CANDIDATE_SHA,productionDeploymentId:process.env.PRODUCTION_DEPLOYMENT_ID,productionDeploymentUrl:process.env.PRODUCTION_DEPLOYMENT_URL,productionUrl:process.env.PRODUCTION_URL,buildId:h.buildId,rollbackDeploymentId:process.env.ROLLBACK_DEPLOYMENT_ID,rollbackCommitSha:process.env.ROLLBACK_COMMIT_SHA,productionDeployGate:'PASS',deployed:true},null,2));
          NODE
          echo "PRODUCTION_DEPLOY_GATE=PASS"
          echo "DEPLOYED=TRUE"

      - name: Upload Production deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uchirimo-production-deploy-evidence
          path: rc/artifacts/uchirimo-release-production/
          if-no-files-found: warn
