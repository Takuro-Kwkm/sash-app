name: APW430 Gemini One-Secret LIVE

on:
  push:
    branches: [feat/catalog-recovery-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apw430_gemini_one_secret:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL_OVERRIDE: ${{ vars.GEMINI_MODEL }}
      APW430_SOURCE_URL: https://webcatalog.ykkap.co.jp/iportal/CatalogDownload.do?method=downloadPdfCatalog&type=downloadPdfCatalog&volumeID=YKKAPDC1&catalogID=13215550000&applicationPdf=true
      APW430_DETAIL_URL: https://webcatalog.ykkap.co.jp/iportal/CatalogDetail.do?catalogID=13215550000&categoryID=1610000&designID=pro&method=initial_screen&type=mc&volumeID=YKKAPDC1
      APW430_EXPECTED_SHA256: a3b130d2227af07808c36d74528592ab76f52b122057d831d5fef5aa34b246be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve safe Gemini defaults
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/gemini-live-v23/apw430
          model="${GEMINI_MODEL_OVERRIDE:-gemini-3.8-flash}"
          api_key_present=0
          [[ -n "${GEMINI_API_KEY:-}" ]] && api_key_present=1
          echo "GEMINI_MODEL=$model" >> "$GITHUB_ENV"
          echo "api_key_present=$api_key_present" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          cat > artifacts/gemini-live-v23/apw430/readiness.json <<EOF
          {
            "model": "$model",
            "api_key_present": $api_key_present,
            "manual_file_uri_required": false,
            "source_strategy": "YKK_AP_OFFICIAL_DOWNLOAD_THEN_GEMINI_FILES_UPLOAD"
          }
          EOF
          echo "api_key_present=$api_key_present"
          echo "model=$model"

      - name: Probe official YKK AP APW430 PDF and verify fingerprint
        id: source
        shell: bash
        run: |
          set -u
          mkdir -p artifacts/gemini-live-v23/apw430
          source_ready=0
          sha_match=0
          curl_exit=0
          curl --fail --location --retry 2 --retry-delay 2 \
            --connect-timeout 20 --max-time 240 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36' \
            --referer "$APW430_DETAIL_URL" \
            --output /tmp/apw430.pdf "$APW430_SOURCE_URL" || curl_exit=$?

          if [[ "$curl_exit" == "0" && -s /tmp/apw430.pdf ]]; then
            size_bytes=$(wc -c < /tmp/apw430.pdf | tr -d ' ')
            mime_type=$(file -b --mime-type /tmp/apw430.pdf || true)
            magic=$(head -c 5 /tmp/apw430.pdf || true)
            actual_sha256=$(sha256sum /tmp/apw430.pdf | awk '{print $1}')
            if [[ "$mime_type" == "application/pdf" && "$magic" == "%PDF-" && "$size_bytes" -gt 5000000 && "$size_bytes" -lt 50000000 ]]; then
              source_ready=1
            fi
            if [[ "$actual_sha256" == "$APW430_EXPECTED_SHA256" ]]; then
              sha_match=1
            fi
          else
            size_bytes=0
            mime_type="UNAVAILABLE"
            magic=""
            actual_sha256=""
          fi

          echo "source_ready=$source_ready" >> "$GITHUB_OUTPUT"
          echo "sha_match=$sha_match" >> "$GITHUB_OUTPUT"
          echo "actual_sha256=$actual_sha256" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$size_bytes" >> "$GITHUB_OUTPUT"
          echo "mime_type=$mime_type" >> "$GITHUB_OUTPUT"

          cat > artifacts/gemini-live-v23/apw430/source-probe.json <<EOF
          {
            "catalog_code": "XAAAA-H26-074-1",
            "catalog_id": "13215550000",
            "volume_id": "YKKAPDC1",
            "source_ready": $source_ready,
            "mime_type": "$mime_type",
            "size_bytes": $size_bytes,
            "expected_sha256": "$APW430_EXPECTED_SHA256",
            "actual_sha256": "$actual_sha256",
            "sha256_match": $sha_match,
            "curl_exit": $curl_exit
          }
          EOF
          echo "source_ready=$source_ready"
          echo "sha_match=$sha_match"
          echo "size_bytes=$size_bytes"
          echo "mime_type=$mime_type"
          echo "actual_sha256=$actual_sha256"

      - name: Upload verified APW430 PDF to Gemini Files API
        id: gemini_file
        if: steps.readiness.outputs.api_key_present == '1' && steps.source.outputs.source_ready == '1' && steps.source.outputs.sha_match == '1'
        shell: bash
        run: |
          set -euo pipefail
          num_bytes=$(wc -c < /tmp/apw430.pdf | tr -d ' ')
          mime_type=application/pdf
          header_file=$(mktemp)
          body_file=$(mktemp)
          curl --fail --silent --show-error \
            'https://generativelanguage.googleapis.com/upload/v1beta/files' \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -D "$header_file" \
            -H 'X-Goog-Upload-Protocol: resumable' \
            -H 'X-Goog-Upload-Command: start' \
            -H "X-Goog-Upload-Header-Content-Length: $num_bytes" \
            -H "X-Goog-Upload-Header-Content-Type: $mime_type" \
            -H 'Content-Type: application/json' \
            -d '{"file":{"display_name":"YKKAP_APW430_202607_CI"}}' \
            -o "$body_file"
          upload_url=$(grep -i '^x-goog-upload-url:' "$header_file" | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '\r')
          test -n "$upload_url"
          file_info=$(mktemp)
          curl --fail --silent --show-error "$upload_url" \
            -H "Content-Length: $num_bytes" \
            -H 'X-Goog-Upload-Offset: 0' \
            -H 'X-Goog-Upload-Command: upload, finalize' \
            --data-binary '@/tmp/apw430.pdf' > "$file_info"
          file_uri=$(jq -r '.file.uri // empty' "$file_info")
          file_name=$(jq -r '.file.name // empty' "$file_info")
          test -n "$file_uri"
          test -n "$file_name"
          echo "GEMINI_FILE_URI=$file_uri" >> "$GITHUB_ENV"
          echo "file_name=$file_name" >> "$GITHUB_OUTPUT"
          jq '{file:{name:.file.name,mimeType:.file.mimeType,sizeBytes:.file.sizeBytes,state:.file.state}}' "$file_info" > artifacts/gemini-live-v23/apw430/gemini-file-upload-audit.json
          echo "Gemini file upload succeeded; URI value intentionally not printed."

      - name: Gemini credential and source preflight
        if: steps.gemini_file.outcome == 'success'
        run: npm run gemini:preflight:v22

      - name: APW430 Real Gemini LIVE_EXTERNAL
        if: steps.gemini_file.outcome == 'success'
        run: npm run gemini:live:apw430:v22 -- --artifact-dir=artifacts/gemini-live-v23/apw430

      - name: Record safe blocker
        if: steps.gemini_file.outcome != 'success'
        shell: bash
        run: |
          reason="UNKNOWN"
          if [[ "${{ steps.source.outputs.source_ready }}" != "1" ]]; then
            reason="OFFICIAL_SOURCE_DOWNLOAD_NOT_VERIFIED"
          elif [[ "${{ steps.source.outputs.sha_match }}" != "1" ]]; then
            reason="OFFICIAL_SOURCE_SHA256_MISMATCH"
          elif [[ "${{ steps.readiness.outputs.api_key_present }}" != "1" ]]; then
            reason="GEMINI_API_KEY_MISSING"
          fi
          cat > artifacts/gemini-live-v23/apw430/live-gate.json <<EOF
          {
            "gate": "BLOCKED",
            "reason": "$reason",
            "live_request_executed": false,
            "canonical_write_performed": false,
            "runtime_write_performed": false,
            "production_write_performed": false
          }
          EOF
          echo "GEMINI_LIVE_EXECUTION_GATE=BLOCKED"
          echo "reason=$reason"

      - name: Upload non-secret audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apw430-gemini-one-secret-v23-audit
          path: artifacts/gemini-live-v23/apw430
          if-no-files-found: error
          retention-days: 7
