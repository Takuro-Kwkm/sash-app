name: Stage A Samos2H Size Metadata Projection V6.1 Pilot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stage-a-samos2h-size-metadata-projection-v6-1-pilot.yml'
      - 'scripts/stage-a-samos2h-size-metadata-projection-v6-1.mjs'
      - 'scripts/stage-a-samos-conflict-graph-v4.mjs'
      - 'src/catalog/selector.mjs'
      - 'src/catalog/runtime-master/product-module-runtime-adapter.mjs'
      - 'src/catalog/runtime-master/**'
      - 'src/catalog/runtime-master-packages/lixil-samos2h-*/**'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - window_type: WT-S2H-MENKOSHI-HIKI
            role: control
            expected_terminal: '96043843584'
            expected_custom: '1276674048'
          - window_type: WT-S2H-SHUTTER-HIKI
            role: heavy
            expected_terminal: ''
            expected_custom: ''
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      STAGE_A_TARGET_WINDOWS: ${{ matrix.window_type }}
      STAGE_A_MAX_MEMO_STATES_PER_WINDOW: 12000
      STAGE_A_MAX_RESOLVER_CALLS_PER_WINDOW: 80000
      STAGE_A_MAX_EXPLICIT_MULTI_ENUM_VALUES: 18
      STAGE_A_SAMOS_V61_OUT: artifacts/stage-a-samos2h-v6-1/${{ matrix.window_type }}
      EXPECTED_TERMINAL: ${{ matrix.expected_terminal }}
      EXPECTED_CUSTOM: ${{ matrix.expected_custom }}
      PILOT_ROLE: ${{ matrix.role }}
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact SHA gate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA"
          echo "EXACT_HEAD_GATE=PASS sha=$actual window=$STAGE_A_TARGET_WINDOWS role=$PILOT_ROLE"
      - name: Run metadata-aware size projection V6.1
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stage-a-samos2h-size-metadata-projection-v6-1.mjs
          node scripts/stage-a-samos2h-size-metadata-projection-v6-1.mjs
      - name: Upload V6.1 per-window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-samos2h-v6-1-${{ matrix.window_type }}
          path: artifacts/stage-a-samos2h-v6-1/${{ matrix.window_type }}/report.json
          if-no-files-found: warn
      - name: Fail-closed V6.1 gate and control equivalence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const path=`artifacts/stage-a-samos2h-v6-1/${process.env.STAGE_A_TARGET_WINDOWS}/report.json`;
          const report=JSON.parse(readFileSync(path,'utf8'));
          if(report.exact_head_sha!==process.env.HEAD_SHA)throw new Error('exact head mismatch');
          if(report.windows?.length!==1)throw new Error('expected one V6.1 row');
          const row=report.windows[0];
          if(row.proof_model_version!=='RUNTIME_UI_SYMBOLIC_FULL_COVERAGE_V1')throw new Error(`unexpected proof model ${row.proof_model_version}`);
          if(row.count_model_version!=='SAMOS2H_RESOLVER_CONTRACT_SIZE_METADATA_PROJECTION_V6_1')throw new Error(`unexpected count model ${row.count_model_version}`);
          if(row.status!=='COUNTED_CANDIDATE'||row.blocker)throw new Error(`V6.1 blocked: ${JSON.stringify(row.blocker)}`);
          if(row.size_projection_audit?.direct_downstream_refs?.length||row.size_projection_audit?.nested_rule_set_refs?.length)throw new Error(`unsupported direct size source refs: ${JSON.stringify(row.size_projection_audit)}`);
          const relevant=row.size_projection_audit?.relevant_metadata_keys??[];
          if(JSON.stringify(relevant)!==JSON.stringify(['actualH','actualW','windowClass']))throw new Error(`unexpected relevant metadata keys ${JSON.stringify(relevant)}`);
          if(Number(row.size_projection_context_count)<=0)throw new Error('metadata projection did not execute');
          if(Number(row.size_projection_logical_value_count)<Number(row.size_projection_class_count))throw new Error('invalid projection cardinality');
          if(!row.size_projection_digest)throw new Error('projection digest missing');
          if(process.env.PILOT_ROLE==='control'){
            if(row.exact_discrete_terminal_context_count!==process.env.EXPECTED_TERMINAL)throw new Error(`control terminal mismatch ${row.exact_discrete_terminal_context_count} != ${process.env.EXPECTED_TERMINAL}`);
            if(row.custom_pending_context_count!==process.env.EXPECTED_CUSTOM)throw new Error(`control custom mismatch ${row.custom_pending_context_count} != ${process.env.EXPECTED_CUSTOM}`);
            console.log('V6_1_CONTROL_EQUIVALENCE_GATE=PASS');
          }
          console.log(`SAMOS2H_V6_1_GATE=PASS role=${process.env.PILOT_ROLE} window=${row.window_type} terminal=${row.exact_discrete_terminal_context_count} custom=${row.custom_pending_context_count} memo=${row.memo_state_count} calls=${row.resolver_call_count} projection_contexts=${row.size_projection_context_count} logical_sizes=${row.size_projection_logical_value_count} classes=${row.size_projection_class_count}`);
          console.log('APP_INTEGRATION_READY=false');
          console.log('RELEASE_INPUT_GATE=BLOCKED');
          NODE

  aggregate:
    if: always()
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage-a-samos2h-v6-1-*
          path: artifacts/collected
      - name: Aggregate V6.1 pilot evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readdirSync,readFileSync,statSync,mkdirSync,writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const files=[];const walk=(dir)=>{for(const name of readdirSync(dir)){const p=join(dir,name);if(statSync(p).isDirectory())walk(p);else if(name==='report.json')files.push(p);}};walk('artifacts/collected');
          const rows=[];for(const p of files){const report=JSON.parse(readFileSync(p,'utf8'));if(report.exact_head_sha!==process.env.HEAD_SHA)throw new Error(`head mismatch ${p}`);if(report.windows?.length===1)rows.push(report.windows[0]);}
          rows.sort((a,b)=>String(a.window_type).localeCompare(String(b.window_type)));
          const control=rows.find((r)=>r.window_type==='WT-S2H-MENKOSHI-HIKI');
          const heavy=rows.find((r)=>r.window_type==='WT-S2H-SHUTTER-HIKI');
          const controlMatch=control?.status==='COUNTED_CANDIDATE'&&!control.blocker&&control.exact_discrete_terminal_context_count==='96043843584'&&control.custom_pending_context_count==='1276674048';
          const heavyPass=heavy?.status==='COUNTED_CANDIDATE'&&!heavy.blocker;
          const complete=Boolean(controlMatch&&heavyPass&&rows.length===2);
          const digest=createHash('sha256').update(JSON.stringify(rows.map((r)=>({window:r.window_type,terminal:r.exact_discrete_terminal_context_count,custom:r.custom_pending_context_count,runtime:r.runtime_manifest_sha256,contract:r.contract_digest,shape:r.source_shape_digest,projection:r.size_projection_digest,terminal_proof:r.terminal_proof_digest,status:r.status})))).digest('hex');
          const out={exact_head_sha:process.env.HEAD_SHA,task_classification:'NON-PRODUCT-MASTER',product_master_mutation:0,proof_model_version:'RUNTIME_UI_SYMBOLIC_FULL_COVERAGE_V1',count_model_version:'SAMOS2H_RESOLVER_CONTRACT_SIZE_METADATA_PROJECTION_V6_1',report_count:rows.length,control_equivalence_gate:controlMatch?'PASS':'FAIL',heavy_recovery_gate:heavyPass?'PASS':'BLOCKED',status:complete?'V6_1_PILOT_PASS':'BLOCKED',evidence_digest:digest,windows:rows,gate_status:{samos2h_remaining_discrete_gate:complete?'V6_1_READY_FOR_EXPANSION':'BLOCKED',nontw_discrete_population_gate:'BLOCKED',custom_size_coverage_gate:'BLOCKED_CONTINUOUS_PARTITION_NOT_PROVEN',app_integration_ready:false,release_input_gate:'BLOCKED'}};
          mkdirSync('artifacts/stage-a-samos2h-v6-1-aggregate',{recursive:true});writeFileSync('artifacts/stage-a-samos2h-v6-1-aggregate/report.json',JSON.stringify(out,null,2)+'\n');
          console.log(`SAMOS2H_V6_1_PILOT_STATUS=${out.status}`);console.log(`CONTROL_EQUIVALENCE_GATE=${out.control_equivalence_gate}`);console.log(`HEAVY_RECOVERY_GATE=${out.heavy_recovery_gate}`);console.log(`EVIDENCE_DIGEST=${out.evidence_digest}`);console.log('APP_INTEGRATION_READY=false');console.log('RELEASE_INPUT_GATE=BLOCKED');if(!complete)process.exitCode=1;
          NODE
      - name: Upload V6.1 aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-samos2h-v6-1-aggregate
          path: artifacts/stage-a-samos2h-v6-1-aggregate/report.json
          if-no-files-found: warn
