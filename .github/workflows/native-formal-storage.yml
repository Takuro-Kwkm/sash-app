name: Native Master Formal Storage
on:
  pull_request:
    paths: ['contracts/production/**', 'scripts/production/**', '.github/workflows/native-formal-storage.yml']
  push:
    branches: [main]
    paths: ['contracts/production/**', 'scripts/production/**', '.github/workflows/native-formal-storage.yml']
jobs:
  formal-boundaries:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install jsonschema==4.25.1 openpyxl==3.1.5
      - run: python -B scripts/production/unpack-release-authority.py /tmp/native-formal-shared
      - run: python -B scripts/production/formal-connection-scope.py
      - run: python -B scripts/production/validate-sheet-package-connection.py
      - run: python -B -m unittest discover -s scripts/production -p 'test_*formal.py'
        env:
          SHARED_HARNESS_ROOT: /tmp/native-formal-shared
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: python -B scripts/production/validate-domain-runtime-connection.py
      - run: node --test test/domain-runtime-projection.test.mjs
      - run: node scripts/production/validate-domain-runtime-projection.mjs changes/doorremo-runtime-ui-r1/index.json /tmp/domain-runtime-parity.json
      - run: node --test test/apw511-runtime-ui.test.mjs
      - run: node scripts/production/validate-domain-runtime-projection.mjs changes/apw511-runtime-ui-r2/index.json /tmp/apw511-runtime-parity.json
      - run: python -B -m unittest discover -s scripts/production -p test_apw511_runtime_connection.py
        env:
          SHARED_HARNESS_ROOT: /tmp/native-formal-shared
      - run: node --test test/apw511-common-flow-r3.test.mjs test/apw511-formal-ui-adoption.test.mjs
      - run: node scripts/production/validate-domain-runtime-projection.mjs changes/apw511-runtime-ui-r3/index.json /tmp/apw511-r3-parity.json
      - run: node scripts/production/validate-domain-runtime-projection.mjs src/catalog/runtime-master-packages/apw511-ui-r3/runtime_index.json /tmp/apw511-formal-parity.json
      - run: node scripts/production/validate-runtime-ui-adoption.mjs src/catalog/runtime-master-packages/apw511-ui-r3/runtime_index.json changes/apw511-runtime-ui-r3/index.json
