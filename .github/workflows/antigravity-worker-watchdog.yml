name: Antigravity Worker Watchdog

on:
  workflow_dispatch:
  push:
    branches:
      - feat/catalog-recovery-v2
    paths:
      - '.github/workflows/antigravity-worker-watchdog.yml'
      - 'src/product-master-core/worker-liveness.mjs'
      - 'scripts/evaluate-antigravity-worker-liveness.mjs'
      - 'test/63-product-master-core-v31-worker-liveness.test.mjs'
  schedule:
    - cron: '25 * * * *'

permissions:
  contents: read
  actions: read

jobs:
  watchdog:
    name: Verify Gemini AI Pro worker liveness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify v3.1 liveness contract
        run: node --test test/63-product-master-core-v31-worker-liveness.test.mjs

      - name: Fetch recent self-hosted smoke runs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -G "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/antigravity-self-hosted-smoke.yml/runs" \
            --data-urlencode "branch=${TARGET_BRANCH}" \
            --data-urlencode 'per_page=10' \
            -o antigravity-smoke-runs.json

      - name: Evaluate worker liveness
        id: liveness
        shell: bash
        run: |
          set -euo pipefail
          node scripts/evaluate-antigravity-worker-liveness.mjs \
            --input=antigravity-smoke-runs.json \
            --output=antigravity-worker-liveness.json \
            --expected-branch="${TARGET_BRANCH}" \
            --max-age-minutes=90 \
            --queue-grace-minutes=20
          cat antigravity-worker-liveness.json

      - name: Publish liveness summary
        if: always()
        shell: bash
        run: |
          if [ -f antigravity-worker-liveness.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data=json.loads(Path('antigravity-worker-liveness.json').read_text())
          run=data.get('latestRun') or {}
          print('## Antigravity Worker Watchdog')
          print(f"- Gate: `{data.get('livenessGate')}`")
          print(f"- Status: `{data.get('status')}`")
          print(f"- Branch: `{data.get('expectedBranch')}`")
          print(f"- Latest run: `{run.get('id')}`")
          print(f"- Latest run status: `{run.get('status')}` / `{run.get('conclusion')}`")
          print(f"- Age minutes: `{run.get('ageMinutes')}`")
          print(f"- Blockers: `{', '.join(data.get('blockers') or []) or 'NONE'}`")
          PY
          fi

      - name: Upload liveness audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-worker-liveness-v31
          path: antigravity-worker-liveness.json
          if-no-files-found: warn
          retention-days: 14
