name: Stage A Dependency Weighted State Count Candidate

on:
  workflow_call:
    inputs:
      controller_head:
        required: true
        type: string

permissions:
  issues: read
  contents: read

concurrency:
  group: stage-a-dependency-weighted-count-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance-authority:
    uses: ./.github/workflows/governance-authorization.yml
    with:
      controller_head: ${{ inputs.controller_head }}
      release: false

  closed_gate:
    needs: ["governance-authority"]
    if: ${{ needs.governance-authority.outputs.authorized == 'true' && (true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Close superseded parent_fields weighted route
        shell: bash
        run: |
          set -euo pipefail
          echo 'DEPENDENCY_WEIGHTED_PARENT_FIELDS_ROUTE=CLOSED'
          echo 'FAILURE_TYPE=DECLARED_PARENT_METADATA_INCONSISTENT'
          echo 'EVIDENCE_RUN=34915689678'
          echo 'EVIDENCE_SHARD=5'
          echo 'PARENT_METADATA_INCONSISTENCY_COUNT=8'
          echo 'RETRY_AUTHORIZED=false'
          echo 'REOPEN_CONDITION=dependency contract source changes or new rule-sensitive proof model'
          echo 'NEXT_PATH=RULE_SENSITIVE_SEMANTIC_CONTINUATION_DAG'
          echo 'APP_INTEGRATION_READY=false'
          echo 'RELEASE_INPUT_GATE=BLOCKED'
