name: Public SaaS S8 Staging Provision

on:
  push:
    branches: [feat/public-saas-foundation-a1]
    paths:
      - '.github/workflows/public-saas-s8-staging-provision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_AkuHacuJlCl8LuvaFpCzFmbv
      STAGING_PROJECT_NAME: sash-app-public-saas-staging
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
    steps:
      - name: Resolve Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          if [[ -z "$token" ]]; then
            echo "S8_VERCEL_STAGING_PROVISION=BLOCKED_MISSING_VERCEL_TOKEN"
            exit 41
          fi
          echo "VERCEL_TOKEN_EFFECTIVE=$token" >> "$GITHUB_ENV"

      - name: Ensure dedicated Staging project exists
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/staging-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
            "https://api.vercel.com/v9/projects/$STAGING_PROJECT_NAME?teamId=$VERCEL_ORG_ID")"

          if [[ "$status" == "404" ]]; then
            node -e 'require("node:fs").writeFileSync("/tmp/create-project.json",JSON.stringify({name:process.env.STAGING_PROJECT_NAME}))'
            status="$(curl -sS -o /tmp/staging-project.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/create-project.json \
              "https://api.vercel.com/v11/projects?teamId=$VERCEL_ORG_ID")"
            rm -f /tmp/create-project.json
          fi

          if [[ "$status" != "200" && "$status" != "201" ]]; then
            STATUS="$status" node -e 'const fs=require("node:fs");let p={};try{p=JSON.parse(fs.readFileSync("/tmp/staging-project.json","utf8"));}catch{};const e=p?.error??p??{};console.error(`S8_VERCEL_STAGING_PROJECT_GATE=BLOCKED status=${process.env.STATUS} code=${String(e.code??"unknown")} message=${String(e.message??"unknown").slice(0,240)}`)'
            exit 43
          fi

          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("/tmp/staging-project.json","utf8"));if(!p.id||p.name!==process.env.STAGING_PROJECT_NAME||p.accountId!==process.env.VERCEL_ORG_ID)process.exit(1);fs.appendFileSync(process.env.GITHUB_ENV,`STAGING_VERCEL_PROJECT_ID=${p.id}\n`);console.log(`S8_VERCEL_STAGING_PROJECT_GATE=PASS project=${p.name} id=${p.id}`)'

      - name: Configure non-secret Staging environment role
        shell: bash
        run: |
          set -euo pipefail
          node -e 'require("node:fs").writeFileSync("/tmp/env-role.json",JSON.stringify({key:"PUBLIC_SAAS_ENVIRONMENT_ROLE",value:"staging",type:"plain",target:["preview"],comment:"Dedicated Public SaaS S8 staging project role"}))'
          status="$(curl -sS -o /tmp/env-role-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/env-role.json \
            "https://api.vercel.com/v10/projects/$STAGING_VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_ORG_ID")"
          rm -f /tmp/env-role.json /tmp/env-role-response.json
          [[ "$status" == "200" || "$status" == "201" ]]
          echo "S8_STAGING_ROLE_ENV_GATE=PASS"

      - name: Configure PostHog for Staging Preview target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${POSTHOG_PROJECT_TOKEN:-}" ]]; then
            echo "S8_STAGING_POSTHOG_GATE=BLOCKED_MISSING_GITHUB_SECRET"
            exit 42
          fi
          node -e 'require("node:fs").writeFileSync("/tmp/posthog.json",JSON.stringify({key:"POSTHOG_PROJECT_TOKEN",value:process.env.POSTHOG_PROJECT_TOKEN,type:"sensitive",target:["preview"],comment:"Public SaaS S8 staging monitoring"}))'
          status="$(curl -sS -o /tmp/posthog-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/posthog.json \
            "https://api.vercel.com/v10/projects/$STAGING_VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_ORG_ID")"
          rm -f /tmp/posthog.json /tmp/posthog-response.json
          [[ "$status" == "200" || "$status" == "201" ]]
          echo "S8_STAGING_POSTHOG_GATE=PASS"

      - name: Read back safe Staging configuration metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
            "https://api.vercel.com/v10/projects/$STAGING_VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" \
            -o /tmp/staging-envs.json
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("/tmp/staging-envs.json","utf8"));const envs=Array.isArray(p.envs)?p.envs:[];const role=envs.find(e=>e.key==="PUBLIC_SAAS_ENVIRONMENT_ROLE");const ph=envs.find(e=>e.key==="POSTHOG_PROJECT_TOKEN");if(!role||!Array.isArray(role.target)||!role.target.includes("preview"))process.exit(1);if(!ph||ph.type!=="sensitive"||!Array.isArray(ph.target)||!ph.target.includes("preview")||ph.target.includes("production"))process.exit(1);console.log("S8_VERCEL_STAGING_CONFIG_READBACK=PASS role=staging posthog=sensitive-preview")'
