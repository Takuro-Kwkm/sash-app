name: Uchirimo Stop Stale Stage1

on:
  push:
    branches:
      - feat/new-construction-runtime-ui-v16-20260910
    paths:
      - .github/workflows/uchirimo-stop-stale-stage1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cancel-stale-stage1:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete Stage1 run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STALE_RUN_ID: '36141061035'
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh api "repos/${REPO}/actions/runs/${STALE_RUN_ID}" --jq '.status')"
          echo "STALE_STAGE1_STATUS_BEFORE=${status}"
          if [ "$status" = "queued" ] || [ "$status" = "in_progress" ]; then
            gh api -X POST "repos/${REPO}/actions/runs/${STALE_RUN_ID}/cancel" >/dev/null
            echo "STALE_STAGE1_CANCEL_REQUESTED=TRUE"
          else
            echo "STALE_STAGE1_CANCEL_REQUESTED=FALSE"
          fi
