name: Uchirimo NonBath 476 Root Recursive Closure
on:
  push:
    branches: [feat/new-construction-runtime-ui-v16-20260910]
    paths: [.github/workflows/uchirimo-nonbath-root-closure.yml, scripts/governance/uchirimo-nonbath-root-closure.mjs]
  workflow_dispatch:
permissions: {contents: read, actions: read, pull-requests: read}
concurrency: {group: 'uchirimo-nonbath-root-closure-${{ github.ref }}', cancel-in-progress: true}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs: {matrix: '${{ steps.prep.outputs.matrix }}'}
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
      SOURCE_HEAD: d38062cbac649f70ee9ce848d92185bd5181b52f
      SOURCE_RUN_ID: '36138682468'
      SOURCE_ARTIFACT: uchirimo-heavy-recovery-analysis-d38062cbac649f70ee9ce848d92185bd5181b52f
      SOURCE_DIGEST: sha256:a2cc2b3cc1f7e6cf0b57f8336d2ec96a70b2b6268af940c0531bd1f1a176ccd5
      DIAG_RUN_ID: '35963229341'
      DIAG_ARTIFACT: uchirimo-heavy-recovery-analysis-2a8e007fd0a6c4eeac5aa24db45c7d4c9006e793
      DIAG_DIGEST: sha256:379c4150957ce53cf032b80e3ac0a8fc66aebd022c84b50ac4b0de66bd59e8be
      BATH_RUN_ID: '36148451323'
      BATH_HEAD: b04e70967cdbaebe1e6e052166e40cb10874814a
      BATH_ARTIFACT: uchirimo-bath-38-root-closure-b04e70967cdbaebe1e6e052166e40cb10874814a
      BATH_DIGEST: sha256:9f6fc7586c9c92e78d2f114c10094b50757fc1d5c5a3aa47020ea7c88d312ad9
      OUT: artifacts/uchirimo-nonbath-input
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.HEAD_SHA }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --ignore-scripts
      - name: Bind source evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100 --jq ".artifacts[]|select(.name==\"${SOURCE_ARTIFACT}\")|.digest")" = "$SOURCE_DIGEST"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${DIAG_RUN_ID}/artifacts?per_page=100 --jq ".artifacts[]|select(.name==\"${DIAG_ARTIFACT}\")|.digest")" = "$DIAG_DIGEST"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${BATH_RUN_ID}/artifacts?per_page=100 --jq ".artifacts[]|select(.name==\"${BATH_ARTIFACT}\")|.digest")" = "$BATH_DIGEST"
          mkdir -p "$OUT/source" "$OUT/diag" "$OUT/bath"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir "$OUT/source"
          gh run download "$DIAG_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$DIAG_ARTIFACT" --dir "$OUT/diag"
          gh run download "$BATH_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BATH_ARTIFACT" --dir "$OUT/bath"
      - name: Build NonBath input
        id: prep
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync,readFileSync,writeFileSync} from 'node:fs'; import {loadRegisteredRuntime} from './src/catalog/runtime-master/runtime-master-registry.mjs';
          const e=process.env,rd=p=>JSON.parse(readFileSync(p,'utf8')),coverage=rd(`${e.OUT}/source/explicit-constraint-original514-existing-partition-execution-coverage-plan.json`),plan=rd(`${e.OUT}/diag/depth2-recursive-partition-plan.json`),bath=rd(`${e.OUT}/bath/bath-38-root-closure-aggregate.json`);
          if(bath.exact_head!==e.BATH_HEAD||bath.status!=='PASS'||bath.closed_root_count!==38||bath.bath_38_root_closure_proven!==true)throw new Error('BATH_CLOSURE_NOT_PROVEN');
          if(coverage.exact_head!==e.SOURCE_HEAD||coverage.stage2?.root_count!==476||coverage.stage2?.existing_partition_execution_unit_count!==7364)throw new Error('STAGE2_COVERAGE_INVALID');
          if(plan.child_partition_count!==7364||plan.COVERAGE_PRESERVATION_STATUS!=='PASS')throw new Error('DEPTH2_PLAN_INVALID');
          const byId=new Map((plan.children??[]).map(x=>[String(x.PARTITION_ID),x])),roots=coverage.stage2.coverage_roots.map((r,i)=>{const items=r.required_existing_partition_ids.map(id=>byId.get(String(id)));if(items.some(x=>!x))throw new Error('DEPTH2_ID_MISSING:'+r.original_parent_partition_id);return{root_index:i,original_parent_partition_id:r.original_parent_partition_id,product_node:r.product_node,window_id:r.window_id,depth2_items:items}});
          if(roots.length!==476||roots.reduce((n,r)=>n+r.depth2_items.length,0)!==7364)throw new Error('NONBATH_COUNTS_INVALID');
          const rt=await loadRegisteredRuntime('YKK AP','ウチリモ 内窓');if(!rt?.sourcePackageIntegrity?.match||rt.sourcePackageIntegrity.actual!==coverage.current_runtime_manifest_sha256)throw new Error('RUNTIME_IDENTITY_INVALID');
          const out={schema_version:'1.0.0',artifact_type:'UCHIRIMO_NONBATH_476_ROOT_RECURSIVE_CLOSURE_INPUT',exact_head:e.HEAD_SHA,task_classification:'NON-PRODUCT-MASTER',product_master_mutation:0,runtime_manifest_sha256:rt.sourcePackageIntegrity.actual,root_count:476,source_depth2_partition_count:7364,bath_38_closure_bound:true,roots,status:'READY',APP_INTEGRATION_READY:false,RELEASE_INPUT_GATE:'BLOCKED'};writeFileSync(`${e.OUT}/nonbath-root-closure-input.json`,JSON.stringify(out,null,2)+'\n');appendFileSync(e.GITHUB_OUTPUT,`matrix=${JSON.stringify({include:roots.map(r=>({root_index:r.root_index}))})}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with: {name: 'uchirimo-nonbath-root-input-${{ env.HEAD_SHA }}', path: '${{ env.OUT }}/', if-no-files-found: error}
  close-root:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env: {HEAD_SHA: '${{ github.sha }}', ROOT_INDEX: '${{ matrix.root_index }}', IN: artifacts/uchirimo-nonbath-input, OUT: artifacts/uchirimo-nonbath-root, UCHIRIMO_NONBATH_CHILD_TIMEOUT_MS: '120000', UCHIRIMO_NONBATH_MAX_DEPTH: '12', UCHIRIMO_NONBATH_MAX_PARTITIONS_PER_ROOT: '4000'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.HEAD_SHA }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --ignore-scripts
      - uses: actions/download-artifact@v4
        with: {name: 'uchirimo-nonbath-root-input-${{ env.HEAD_SHA }}', path: '${{ env.IN }}'}
      - name: Close root recursively
        env: {UCHIRIMO_NONBATH_ROOT_INDEX: '${{ env.ROOT_INDEX }}', UCHIRIMO_NONBATH_CLOSURE_INPUT: '${{ env.IN }}/nonbath-root-closure-input.json', UCHIRIMO_NONBATH_ROOT_OUT: '${{ env.OUT }}'}
        run: node scripts/governance/uchirimo-nonbath-root-closure.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'uchirimo-nonbath-root-${{ matrix.root_index }}-${{ env.HEAD_SHA }}', path: '${{ env.OUT }}/', if-no-files-found: error}
  aggregate:
    needs: [prepare, close-root]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: {HEAD_SHA: '${{ github.sha }}', OUT: artifacts/uchirimo-nonbath-aggregate}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'uchirimo-nonbath-root-*-${{ env.HEAD_SHA }}', path: '${{ env.OUT }}/roots', merge-multiple: true}
      - name: Aggregate 476 roots
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync,readFileSync,readdirSync,writeFileSync} from 'node:fs';import {join} from 'node:path';const e=process.env,d=join(e.OUT,'roots');mkdirSync(e.OUT,{recursive:true});const rows=readdirSync(d).filter(n=>/^nonbath-root-\d+-closure\.json$/.test(n)).map(n=>JSON.parse(readFileSync(join(d,n),'utf8'))).filter(r=>r.exact_head===e.HEAD_SHA),closed=rows.filter(r=>r.status==='PASS'&&r.original_root_closure_proven===true),blocked=rows.filter(r=>r.status!=='PASS'||r.original_root_closure_proven!==true),pass=rows.length===476&&closed.length===476;const x={schema_version:'1.0.0',artifact_type:'UCHIRIMO_NONBATH_476_ROOT_RECURSIVE_CLOSURE_AGGREGATE',exact_head:e.HEAD_SHA,task_classification:'NON-PRODUCT-MASTER',product_master_mutation:0,expected_root_count:476,observed_root_report_count:rows.length,closed_root_count:closed.length,blocked_root_count:476-closed.length,executed_partition_count:rows.reduce((n,r)=>n+Number(r.executed_partition_count??0),0),timeout_event_count:rows.reduce((n,r)=>n+Number(r.timeout_event_count??0),0),split_count:rows.reduce((n,r)=>n+Number(r.split_count??0),0),blocked_roots:blocked.map(r=>({root_index:r.root_index,original_parent_partition_id:r.original_parent_partition_id,blocked:r.blocked})),nonbath_476_root_closure_proven:pass,original_514_closure_proven:pass,next_recovery_action:pass?'ORIGINAL_514_FINAL_CLOSURE_PROOF':'RECOVER_ONLY_BLOCKED_NONBATH_ROOT_LEAVES',UCHIRIMO_FULL_COVERAGE_QA_GATE:pass?'PASS':'BLOCKED',UCHIRIMO_QA_STATUS:pass?'PASS':'UNVERIFIED',APP_INTEGRATION_READY:false,RELEASE_INPUT_GATE:'BLOCKED',status:pass?'PASS':'BLOCKED'};writeFileSync(join(e.OUT,'nonbath-476-root-closure-aggregate.json'),JSON.stringify(x,null,2)+'\n');console.log(`NONBATH_476_ROOT_CLOSURE=${x.status} closed=${closed.length}/476 reports=${rows.length}/476`);
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'uchirimo-nonbath-476-root-closure-${{ env.HEAD_SHA }}', path: '${{ env.OUT }}/', if-no-files-found: error}
      - name: Enforce closure
        run: node -e "const x=require('./${{ env.OUT }}/nonbath-476-root-closure-aggregate.json');if(x.status!=='PASS')process.exit(1)"
