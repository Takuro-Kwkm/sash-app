name: Project Governance Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/new-construction-runtime-ui-v16-20260910
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: project-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    outputs:
      authorized: ${{ steps.materialize.outputs.authorized }}
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Governance source syntax
        run: |
          node --check scripts/governance/governance-lib.mjs
          node --check scripts/governance/drive-authority.mjs
          node --check scripts/governance/verify-project-state.mjs
          node --check scripts/governance/generate-human-flow-review.mjs
          node --check scripts/governance/runtime-field-coverage.mjs
          node --check scripts/governance/build-human-flow-review.mjs
          node --check scripts/governance/verify-human-flow-field-coverage.mjs
          node --check scripts/governance/collect-qa-evidence.mjs
          node --check scripts/governance/evaluate-gates.mjs
          node --check scripts/governance/generate-progress-ledger.mjs
          node --check scripts/governance/emit-global-flow-evidence.mjs
          node --check scripts/governance/collect-evidence.mjs
          node --check scripts/governance/verify-release-input.mjs
          node --check scripts/governance/materialize-current-state.mjs
          node --check scripts/governance/verify-materialized-state.mjs
          node --check scripts/governance/reconstruct-current-state.mjs

      - name: frame_angle canonical contract tests
        run: node --test test/76-frame-angle-global-flow.test.mjs

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2

      - name: Workflow authority policy
        run: python scripts/governance/verify-workflow-authority.py

      - name: Project state invariants
        run: node scripts/governance/verify-project-state.mjs

      - name: Build exact-head Human Flow Review artifact with source coverage
        run: node scripts/governance/build-human-flow-review.mjs

      - name: Verify authoritative source-to-artifact field coverage
        run: node scripts/governance/verify-human-flow-field-coverage.mjs

      - name: Collect exact-head QA evidence
        run: node scripts/governance/collect-qa-evidence.mjs

      - name: Read explicit human approval from GitHub
        run: node scripts/governance/read-human-approval.mjs

      - name: Aggregate current gates
        env:
          GOVERNANCE_EVIDENCE_MANIFEST: artifacts/governance/qa-evidence-manifest.json
        run: node scripts/governance/evaluate-gates.mjs

      - name: Generate Progress Ledger
        run: node scripts/governance/generate-progress-ledger.mjs

      - name: Prevent false release declaration
        run: node scripts/governance/verify-release-input.mjs

      - name: Governance negative tests
        shell: bash
        run: node --test scripts/governance/governance-negative.test.mjs | tee artifacts/governance/governance-negative-tests.tap

      - name: Obtain read-only Drive access through workload identity
        id: drive-auth
        if: vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GOOGLE_DRIVE_READER_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_DRIVE_READER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
          export_environment_variables: false

      - name: Materialize current repository and external observations
        id: materialize
        env:
          DRIVE_READONLY_ACCESS_TOKEN: ${{ steps.drive-auth.outputs.access_token || secrets.DRIVE_READONLY_ACCESS_TOKEN }}
        run: node scripts/governance/materialize-current-state.mjs

      - name: Verify current state and evidence hashes
        run: node scripts/governance/verify-materialized-state.mjs

      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-governance-evidence-${{ env.HEAD_SHA }}
          path: artifacts/governance/
          if-no-files-found: error

  persist:
    needs: governance
    if: github.event_name != 'pull_request' && github.repository == 'Takuro-Kwkm/sash-app'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: project-governance-evidence-${{ env.HEAD_SHA }}
          path: artifacts/governance
      - run: node scripts/governance/verify-materialized-state.mjs
      - run: node scripts/governance/persist-evidence.mjs

  reconstruct-current-state:
    needs:
      - governance
      - persist
    if: github.event_name != 'pull_request' && github.repository == 'Takuro-Kwkm/sash-app'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconstruct current state from durable evidence
        env:
          DRIVE_READONLY_ACCESS_TOKEN: ${{ secrets.DRIVE_READONLY_ACCESS_TOKEN }}
        run: node scripts/governance/reconstruct-current-state.mjs
      - name: Verify reconstructed exact HEAD
        run: |
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('artifacts/governance/reconstructed-current-state.json','utf8'));if(s.exact_head!==process.env.HEAD_SHA||s.current_state_reconstruction_gate!=='PASS')process.exit(1);console.log('ONE_SHOT_CURRENT_STATE_RECONSTRUCTION=PASS EXACT_HEAD='+s.exact_head+' DRIVE_AUTHORITY_MODE='+s.drive_authority_mode)"

  post-review-global-flow:
    needs: governance
    if: needs.governance.outputs.authorized == 'true'
    uses: ./.github/workflows/global-window-selection-flow-gate.yml
    with:
      controller_head: ${{ github.event.pull_request.head.sha || github.sha }}
