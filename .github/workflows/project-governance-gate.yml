name: Project Governance Gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: project-governance-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Core application and unchanged fact regression
        run: npm run lint && npm run typecheck && npm test
      - name: Current formal identities and fresh canonical frame scope
        run: node scripts/governance/inner-window-frame-integration-qa.mjs
      - name: Eight-series preview model
        run: node scripts/build-eight-series-review.mjs
      - name: Governance summary
        run: |
          echo 'Current scope: 8 Window series; affected INNER_WINDOW canonical frame R3.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Affected legacy PASS import: 0. TW and EW October catalog identity adoptions are verified separately; four other exterior identities and both inner-window identities retain their frozen pins.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Historical Slim factorized tests remain a frozen witness, not R3 proof.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job verifies existing inner-window identities and shared application regression. Product-specific Browser and APP_INTEGRATION_READY verdicts are evaluated by their dedicated integration workflow. Human review remains separate.' >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inner-window-frame-governance-${{ env.HEAD_SHA }}
          path: |
            artifacts/inner-window-frame-integration/
            artifacts/eight-series-review/
