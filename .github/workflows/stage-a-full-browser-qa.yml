name: Stage A Full Browser QA

on:
  push:
    branches: [feat/new-construction-runtime-ui-v16-20260910]
    paths:
      - '.github/workflows/stage-a-full-browser-qa.yml'
      - 'test/browser/stage-a-full-browser-qa.mjs'
      - 'scripts/stage-a-custom-dimension-source-shape-diagnostic.mjs'
      - 'scripts/stage-a-formal-split-custom-guard-shape-diagnostic.mjs'
      - 'scripts/stage-a-custom-dimension-boundary-partition-proof-v2.mjs'
      - 'scripts/stage-a-custom-selector-reachability-v4.mjs'
      - 'scripts/stage-a-custom-runtime-geometry-equivalence-v4.mjs'
      - 'scripts/stage-a-custom-transition-proof-v4.mjs'
      - 'src/ui/web/product-configuration-editor.mjs'
      - 'src/work-management/domain.mjs'
      - 'src/catalog/runtime-master/**'

permissions:
  contents: read
  actions: read

jobs:
  full-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ github.sha }}
      CUSTOM_GEOMETRY_EVIDENCE_HEAD: ${{ github.sha }}
      STAGE_A_CUSTOM_SHAPE_OUT: artifacts/current-head/custom-source-shape
      STAGE_A_CUSTOM_GUARD_OUT: artifacts/current-head/custom-guard-shape
      STAGE_A_CUSTOM_SHAPE_INPUT: artifacts/current-head/custom-source-shape/report.json
      STAGE_A_CUSTOM_GUARD_INPUT: artifacts/current-head/custom-guard-shape/report.json
      STAGE_A_CUSTOM_PARTITION_OUT: artifacts/current-head/custom-boundary-partition
      STAGE_A_CUSTOM_PARTITION_INPUT: artifacts/current-head/custom-boundary-partition/report.json
      STAGE_A_CUSTOM_REACHABILITY_OUT: artifacts/current-head/custom-selector-reachability
      STAGE_A_CUSTOM_REACHABILITY_INPUT: artifacts/current-head/custom-selector-reachability/report.json
      STAGE_A_CUSTOM_GEOMETRY_EQ_OUT: artifacts/current-head/custom-runtime-geometry-equivalence
      STAGE_A_CUSTOM_GEOMETRY_EQ_INPUT: artifacts/current-head/custom-runtime-geometry-equivalence/report.json
      STAGE_A_CUSTOM_TRANSITION_OUT: artifacts/current-head/custom-transition-proof
      STAGE_A_FULL_BROWSER_OUT: artifacts/stage-a-full-browser-qa
    steps:
      - name: Checkout exact push HEAD with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Exact-head source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          node --check scripts/stage-a-custom-dimension-boundary-partition-proof-v2.mjs
          node --check scripts/stage-a-custom-selector-reachability-v4.mjs
          node --check scripts/stage-a-custom-runtime-geometry-equivalence-v4.mjs
          node --check scripts/stage-a-custom-transition-proof-v4.mjs
          node --check test/browser/stage-a-full-browser-qa.mjs
          echo 'FULL_BROWSER_EXACT_HEAD_SOURCE_GATE=PASS'

      - name: Install app dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Regenerate exact-head CUSTOM proof chain
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-a-custom-dimension-source-shape-diagnostic.mjs
          node scripts/stage-a-formal-split-custom-guard-shape-diagnostic.mjs
          node scripts/stage-a-custom-dimension-boundary-partition-proof-v2.mjs
          node scripts/stage-a-custom-selector-reachability-v4.mjs
          node scripts/stage-a-custom-runtime-geometry-equivalence-v4.mjs
          node scripts/stage-a-custom-transition-proof-v4.mjs
          echo "STAGE_A_REACHABILITY_REPORT=$STAGE_A_CUSTOM_REACHABILITY_INPUT" >> "$GITHUB_ENV"
          echo "STAGE_A_GEOMETRY_REPORT=$STAGE_A_CUSTOM_GEOMETRY_EQ_INPUT" >> "$GITHUB_ENV"
          echo "STAGE_A_TRANSITION_REPORT=$STAGE_A_CUSTOM_TRANSITION_OUT/report.json" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const paths=[process.env.STAGE_A_CUSTOM_REACHABILITY_INPUT,process.env.STAGE_A_CUSTOM_GEOMETRY_EQ_INPUT,`${process.env.STAGE_A_CUSTOM_TRANSITION_OUT}/report.json`];
          const [reach,geometry,transition]=paths.map((path)=>JSON.parse(readFileSync(path,'utf8')));
          if(paths.some((_,index)=>[reach,geometry,transition][index].exact_head_sha!==process.env.HEAD_SHA))throw new Error('CURRENT_HEAD_CUSTOM_EVIDENCE_MISMATCH');
          if(reach.status!=='PASS'||geometry.status!=='PASS'||transition.status!=='PASS')throw new Error('CURRENT_HEAD_CUSTOM_PROOF_NOT_PASS');
          if(reach.unique_context_count!==137||reach.source_rule_count!==152||geometry.mismatch_count!==0||transition.selector_context_count!==137)throw new Error('CURRENT_HEAD_CUSTOM_CARDINALITY_DRIFT');
          console.log('CUSTOM_SIZE_COVERAGE_GATE=PASS_CURRENT_HEAD_FULL_PROOF_CHAIN');
          NODE

      - name: Start exact-head local Runtime UI
        shell: bash
        run: |
          set -euo pipefail
          npm run start:qa > /tmp/stage-a-full-browser-server.log 2>&1 &
          echo $! > /tmp/stage-a-full-browser-server.pid
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/tmp/stage-a-health.json; then
              cat /tmp/stage-a-health.json
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/stage-a-full-browser-server.log || true
          exit 1

      - name: Run Desktop and Smartphone Full Browser QA
        shell: bash
        run: |
          set -euo pipefail
          node test/browser/stage-a-full-browser-qa.mjs | tee /tmp/stage-a-full-browser-qa.log

      - name: Stop local Runtime UI
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/stage-a-full-browser-server.pid ]]; then
            kill "$(cat /tmp/stage-a-full-browser-server.pid)" 2>/dev/null || true
          fi

      - name: Upload full browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-full-browser-qa
          path: |
            artifacts/current-head/
            artifacts/stage-a-full-browser-qa/
            /tmp/stage-a-full-browser-qa.log
            /tmp/stage-a-full-browser-server.log
          if-no-files-found: warn
