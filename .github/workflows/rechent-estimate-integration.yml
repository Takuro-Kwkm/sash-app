name: Rechent Estimate Integration
on:
  push:
    branches: [integration/rechent-estimate-flow-20261002]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rechent-estimate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify runtime maintenance scope and retain predecessor
        if: hashFiles('contracts/production/authority-successors/node-security.20261021.json') != ''
        working-directory: ${{ github.workspace }}
        run: python3 -B scripts/production/node-security.py prepare --github-env "$GITHUB_ENV" --workflow .github/workflows/rechent-estimate-integration.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: npm run lint && npm run typecheck && npm test
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Official R8 adoption and unrelated-series protection
        run: |
          git fetch origin 7584ed0a9e37f12e448e1d17303bd149200cb6b1
          node scripts/verify-rechent-r8-adoption.mjs
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - run: npm run build:release
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - run: npm install --package-lock=false --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Browser journeys and shared workflow regression
        run: |
          npm run start:qa > /tmp/rechent-qa.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 1
          done
          node test/browser/rechent-entry-door-cover-global-flow-browser-qa.mjs
          node test/browser/rechent-estimate-integration-browser-qa.mjs
          node test/browser/eight-series-business-flow-qa.mjs
          node test/browser/bathroom-estimate-workflow-browser-qa.mjs
          node test/browser/work-management-browser-qa.mjs
          node test/browser/estimate-output-browser-qa.mjs
          node test/browser/theme-browser-qa.mjs
          node scripts/build-eight-series-review.mjs artifacts/rechent-review/index.html rechent
          node test/browser/rechent-inline-preview-qa.mjs
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rechent-local-qa-${{ github.sha }}
          path: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}/artifacts/
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: team_AkuHacuJlCl8LuvaFpCzFmbv
      VERCEL_PROJECT_ID: prj_4z0zqW6yKyPuFINODfGX8LPBuJRP
      VERCEL_PROJECT_NAME: sash-app-wave3-preview
      RELEASE_SERIES: LIXIL_RECHENT_DOOR3_NON_FIRE
      RELEASE_PACKAGE_VERSION: v0.8-R8
      VERCEL_DEPLOY_SOURCE: gitSource
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify runtime maintenance scope and retain predecessor
        if: hashFiles('contracts/production/authority-successors/node-security.20261021.json') != ''
        working-directory: ${{ github.workspace }}
        run: python3 -B scripts/production/node-security.py prepare --github-env "$GITHUB_ENV" --workflow .github/workflows/rechent-estimate-integration.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Prepare preview credential
        env:
          VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_FALLBACK: ${{ secrets.VERCEL_ACCESS_TOKEN }}
        run: |
          token="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_FALLBACK:-}}"
          if [[ -z "$token" ]]; then echo 'VERCEL_CREDENTIAL_GATE=BLOCKED'; exit 42; fi
          echo "VERCEL_TOKEN_EFFECTIVE=$token" >> "$GITHUB_ENV"
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - run: node scripts/vercel-rest-deploy.mjs preview artifacts/rechent-preview/deployment.json
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - run: node scripts/prepare-rechent-preview-access.mjs artifacts/rechent-preview/deployment.json
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - run: npm install --package-lock=false --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - name: Exact commit deployed browser gate
        env:
          QA_BASE_URL: ${{ env.DEPLOY_URL }}
        run: |
          node -e 'const d=require("./artifacts/rechent-preview/deployment.json"); if(d.readyState!=="READY"||d.githubSha!==process.env.GITHUB_SHA||d.deploymentGitSha!==process.env.GITHUB_SHA||d.mode!=="preview") process.exit(1)'
          node test/browser/rechent-entry-door-cover-global-flow-browser-qa.mjs
          node test/browser/rechent-estimate-integration-browser-qa.mjs
          echo 'DEPLOYED_BROWSER_GATE=PASS_ADAPTER_REGRESSION_SCOPE'
          echo 'PRODUCT_MASTER_MUTATION=0'
          echo 'PRODUCTION_DEPLOY=NOT_EXECUTED'
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rechent-deployed-qa-${{ github.sha }}
          path: |
            ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}/artifacts/rechent-preview/
            ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}/artifacts/rechent-estimate-integration/
            ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}/artifacts/rechent-entry-door-cover-global-flow-browser-qa/
  integration-ready:
    needs: [qa, preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify runtime maintenance scope and retain predecessor
        if: hashFiles('contracts/production/authority-successors/node-security.20261021.json') != ''
        working-directory: ${{ github.workspace }}
        run: python3 -B scripts/production/node-security.py prepare --github-env "$GITHUB_ENV" --workflow .github/workflows/rechent-estimate-integration.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v4
        with:
          name: rechent-local-qa-${{ github.sha }}
          path: artifacts/gate-input/local
      - uses: actions/download-artifact@v4
        with:
          name: rechent-deployed-qa-${{ github.sha }}
          path: artifacts/gate-input/deployed
      - name: Evaluate verified integration gates
        run: |
          # Keep only deployed browser reports to prevent local/deployed ambiguity.
          rm -rf artifacts/gate-input/local/rechent-estimate-integration artifacts/gate-input/local/rechent-entry-door-cover-global-flow-browser-qa
          node scripts/evaluate-rechent-r8-integration-ready.mjs
        working-directory: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}
      - uses: actions/upload-artifact@v4
        with:
          name: rechent-integration-ready-${{ github.sha }}
          path: ${{ env.NODE_SECURITY_PREDECESSOR || github.workspace }}/artifacts/rechent-integration-ready/
