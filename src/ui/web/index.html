<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>サッシ情報管理アプリ V2 Recovery</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div><strong>サッシ情報管理アプリ V2</strong><span class="sub">商品マスター統合 Recovery Build</span></div>
    <span id="status" class="badge">loading</span>
  </header>
  <main>
    <section class="card">
      <h1>見積商品選択</h1>
      <p class="lead">共通Catalogからメーカー・シリーズ・窓種を動的表示します。商品専用Formは使用していません。</p>
      <label>メーカー</label>
      <select id="manufacturer"><option value="">選択してください</option></select>
      <label>シリーズ</label>
      <select id="product" disabled><option value="">選択してください</option></select>
      <label>窓種</label>
      <select id="window" disabled><option value="">選択してください</option></select>
      <div id="nextFields"></div>
    </section>
    <section class="card compact">
      <h2>Runtime Catalog</h2>
      <div id="inventory"></div>
    </section>
  </main>
  <footer id="build">Build identity loading...</footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
