<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>サッシ情報管理アプリ｜案件管理</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/styles-wave3.css">
  <link rel="stylesheet" href="/work-management.css">
  <link rel="stylesheet" href="/estimate-output.css">
  <style>
    .app-home-hero{position:relative;height:394px;margin:0 0 24px;border:1px solid #e2e8f1;border-radius:8px;overflow:hidden;background:linear-gradient(90deg,#eaf6fc 0%,#edf7fc 38%,#eff5f7 62%,#dfe7e8 100%)}
    .app-home-hero-photo{position:absolute;right:0;top:0;width:71%;height:100%;object-fit:cover;object-position:center center;display:block}
    .app-home-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(238,248,253,.99) 0%,rgba(238,248,253,.97) 23%,rgba(238,248,253,.85) 33%,rgba(238,248,253,.36) 47%,rgba(238,248,253,0) 62%)}
    .app-home-hero-copy{position:relative;z-index:2;width:51%;padding:102px 0 0 34px}
    .app-home-hero-kicker{font-size:15px;color:#132167;margin-bottom:20px}
    .app-home-hero h1{font-size:29px;line-height:1.35;margin:0 0 14px;color:#102064;letter-spacing:.01em}
    .app-home-hero p{font-size:14px;line-height:1.8;margin:0;color:#263777}
    .app-home-hero-actions{display:flex;gap:14px;margin-top:21px}
    .app-home-hero-cta{height:58px;border-radius:6px;padding:0 26px;display:inline-flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;font-size:14px;white-space:nowrap}
    .app-home-hero-primary{background:#0873c8;color:#fff;border:1px solid #0873c8;min-width:246px}
    .app-home-hero-secondary{background:rgba(255,255,255,.94);color:#17246c;border:1px solid #7182b1;min-width:196px}
    .app-home-hero-plus{font-size:26px;line-height:1}.app-home-hero-docicon{font-size:22px}
    @media (min-width:821px) and (max-width:1100px){
      .app-home-hero{height:auto;min-height:0;display:flex;flex-direction:column;background:#eef8fd}
      .app-home-hero:after{display:none}
      .app-home-hero-copy{order:1;width:100%;max-width:none;padding:8px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto;column-gap:18px;align-items:start;background:#eef8fd}
      .app-home-hero-kicker{grid-column:1;grid-row:1;font-size:11px;line-height:1.25;margin:0 0 2px}
      .app-home-hero h1{grid-column:1;grid-row:2;font-size:23px;line-height:1.25;margin:0 0 2px}
      .app-home-hero p{grid-column:1;grid-row:3;font-size:11px;line-height:1.4;margin:0}.app-home-hero p br{display:none}
      .app-home-hero-actions{grid-column:2;grid-row:1/4;align-self:center;margin:0;gap:8px}
      .app-home-hero-cta{height:42px;min-width:0;padding:0 14px;gap:8px;font-size:12px}.app-home-hero-plus{font-size:22px}.app-home-hero-docicon{font-size:18px}
      .app-home-hero-photo{position:relative;order:2;left:0;right:auto;top:auto;bottom:auto;width:103%;height:auto;max-width:none;object-fit:contain;object-position:left top;opacity:1;transform:none;margin:0;display:block;flex:0 0 auto;align-self:flex-start}
    }
    @media (min-width:700px) and (max-width:820px){
      .app-home-hero{height:auto;min-height:0;display:flex;flex-direction:column;background:#eef8fd}
      .app-home-hero:after{display:none}
      .app-home-hero-copy{order:1;width:100%;max-width:none;padding:16px 22px 14px;background:#eef8fd}
      .app-home-hero-kicker{font-size:12px;margin-bottom:7px}.app-home-hero h1{font-size:25px;margin-bottom:8px}.app-home-hero p{font-size:12px;line-height:1.6}
      .app-home-hero-actions{margin-top:13px}.app-home-hero-cta{height:46px;min-width:0}
      .app-home-hero-photo{position:relative;order:2;left:0;right:auto;top:auto;bottom:auto;width:108%;height:auto;max-width:none;object-fit:contain;object-position:left top;opacity:1;transform:none;margin:0;display:block;flex:0 0 auto;align-self:flex-start}
    }
    @media(max-width:699px){
      .app-home-hero{height:auto;min-height:0;display:flex;flex-direction:column;background:#eef8fd}
      .app-home-hero:after{display:none}
      .app-home-hero-copy{order:1;width:100%;padding:18px 16px 16px;background:#eef8fd}
      .app-home-hero-kicker{font-size:12px;margin-bottom:7px}.app-home-hero h1{font-size:23px;margin-bottom:8px}.app-home-hero p{font-size:12px;line-height:1.6}.app-home-hero p br{display:none}
      .app-home-hero-actions{margin-top:13px;flex-direction:column;gap:8px}.app-home-hero-cta{width:100%;height:46px;min-width:0;padding:0 14px}
      .app-home-hero-photo{content:url("/design-preview-reference-hero-portrait.jpg");position:relative;order:2;left:0;right:auto;top:auto;width:100%;height:auto;object-fit:contain;object-position:center center;display:block}
    }
  </style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" data-nav="/"><strong>サッシ情報管理アプリ</strong><span id="headerContext" class="sub">案件一覧</span></a>
  <span id="status" class="badge">loading</span>
</header>
<main id="appMain" aria-live="polite"></main>
<footer id="build">Build identity loading...</footer>
<script type="module" src="/app.js"></script>
<script type="module" src="/estimate-output-integration.mjs"></script>
<script type="module">
  const main=document.querySelector('#appMain');
  const recentProjectPath=()=>{
    try{
      const database=window.__sashWorkApp?.readDatabase?.();
      const projects=Array.isArray(database?.projects)?database.projects:[];
      const active=projects.filter((project)=>!project.deleted_at&&project.status!=='ARCHIVED').sort((a,b)=>new Date(b.updated_at??0)-new Date(a.updated_at??0));
      return active[0]?.project_id?`/projects/${active[0].project_id}`:null;
    }catch{return null;}
  };
  const heroMarkup=()=>{
    const recentPath=recentProjectPath();
    const resumePath=recentPath??'/';
    const resumeLabel=recentPath?'前回の続き':'案件一覧を見る';
    return `<section class="app-home-hero" data-app-home-hero="1" aria-labelledby="appHomeHeroTitle">
      <img class="app-home-hero-photo" src="/design-preview-reference-hero.jpg" alt="" aria-hidden="true">
      <div class="app-home-hero-copy">
        <div class="app-home-hero-kicker">サッシ業務を、もっと分かりやすく。</div>
        <h1 id="appHomeHeroTitle">暮らしをつくる、マドとトビラで。</h1>
        <p>窓・玄関ドアの商品選定・見積・現場調査を、<br>迷いにくい流れでつなぐ。</p>
        <div class="app-home-hero-actions">
          <a class="app-home-hero-cta app-home-hero-primary" href="/projects/new" data-nav="/projects/new"><span class="app-home-hero-plus">＋</span>案件を新規作成</a>
          <a class="app-home-hero-cta app-home-hero-secondary" href="${resumePath}" data-nav="${resumePath}"><span class="app-home-hero-docicon">▧</span>${resumeLabel}</a>
        </div>
      </div>
    </section>`;
  };
  const syncHomeHero=()=>{
    if(!main||location.pathname!=='/'||main.querySelector('[data-app-home-hero]'))return;
    const anchor=main.querySelector('.page-heading');
    if(!anchor)return;
    anchor.insertAdjacentHTML('beforebegin',heroMarkup());
  };
  if(main){new MutationObserver(syncHomeHero).observe(main,{childList:true});}
  queueMicrotask(syncHomeHero);
  window.addEventListener('popstate',()=>queueMicrotask(syncHomeHero));
</script>
</body>
</html>
