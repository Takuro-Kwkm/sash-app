<!doctype html>
<html lang="ja" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>サッシ情報管理アプリ｜Design Pilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design-preview.css">
  <link rel="stylesheet" href="/design-preview-notifications.css">
  <link rel="stylesheet" href="/design-preview-estimate.css">
  <link rel="stylesheet" href="/design-preview-guide.css">
  <link rel="stylesheet" href="/design-preview-survey.css">
  <style>@media(max-width:900px){.runtime-editor-shell input,.runtime-editor-shell select{min-height:44px;font-size:16px}}@media(min-width:1181px){.home-hero h1{font-size:28px}}</style>
  <style>.hero-approved-photo{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center center;z-index:1}.hero-architecture-svg{opacity:0}.home-hero-shade,.home-hero-copy,.concept-label{z-index:2}</style>
</head>
<body>
  <div class="design-shell">
    <aside class="design-sidebar">
      <a class="design-brand" href="/design-preview" data-design-nav="/design-preview">
        <span class="design-brand-mark">S</span>
        <span><strong>SashiPro</strong><small>Design Pilot</small></span>
      </a>
      <nav class="design-nav" aria-label="メインナビゲーション">
        <a href="/design-preview" data-design-nav="/design-preview" data-section="home">⌂ <span>ホーム</span></a>
        <a href="/design-preview/notifications" data-design-nav="/design-preview/notifications" data-section="notifications">◉ <span>お知らせ</span></a>
        <a href="/design-preview/product" data-design-nav="/design-preview/product" data-section="product">▣ <span>商品選定</span></a>
        <a href="/design-preview?view=survey" data-section="survey">⌖ <span>現場調査・採寸</span></a>
        <a href="/design-preview?view=guide" data-section="guide">? <span>Context Guide</span></a>
        <a href="/design-preview?view=estimate" data-section="estimate">▦ <span>見積・提案</span></a>
        <a href="/" data-section="projects">▤ <span>案件・見積</span></a>
        <a href="/runtime-lab" data-section="runtime">⌘ <span>Runtime QA</span></a>
      </nav>
      <div class="design-sidebar-footer">
        <span>UI Pilot v0.1</span>
        <small>PRODUCT_MASTER_MUTATION=0</small>
      </div>
    </aside>

    <div class="design-workspace">
      <header class="design-topbar">
        <div class="design-search" aria-label="検索">⌕ <span>商品名・型番・キーワードで検索</span></div>
        <div class="design-toolbar">
          <label class="theme-control">外観
            <select id="themeSelect" aria-label="外観テーマ">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <span id="status" class="design-status">PILOT</span>
        </div>
      </header>

      <main id="designMain" aria-live="polite"></main>
      <footer id="build" class="design-build">UI Design Pilot</footer>
    </div>
  </div>
  <script>
    (()=>{
      const mountApprovedHero=()=>{
        document.querySelectorAll('.hero-architecture').forEach((host)=>{
          if(!host.querySelector('.hero-approved-photo')){
            const img=document.createElement('img');
            img.className='hero-approved-photo';
            img.src='/design-preview-hero.webp';
            img.alt='';
            img.setAttribute('aria-hidden','true');
            img.decoding='async';
            host.prepend(img);
          }
        });
        document.querySelectorAll('.concept-label').forEach((label)=>{label.textContent='DESIGN PILOT HERO';});
      };
      const main=document.querySelector('#designMain');
      if(main)new MutationObserver(mountApprovedHero).observe(main,{childList:true,subtree:true});
      mountApprovedHero();
    })();
  </script>
  <script type="module" src="/design-preview.mjs"></script>
  <script type="module" src="/design-preview-estimate.mjs"></script>
  <script type="module" src="/design-preview-guide.mjs"></script>
  <script type="module" src="/design-preview-survey.mjs"></script>
</body>
</html>
